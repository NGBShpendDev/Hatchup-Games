        content:  { type: string, minLength: 1, maxLength: 280 }

    FollowInput:
      type: object
      required: [followerId, followeeId]
      properties:
        followerId: { type: integer }
        followeeId: { type: integer }

    OnboardingInput:
      type: object
      properties:
        ageRange:          { type: string, enum: [under13, teen, adult, senior] }
        fitnessLevel:      { type: string, enum: [beginner, intermediate, advanced, elite] }
        accessibilityMode: { type: string, enum: [none, child, senior, low_impact] }
        identityPath:      { type: string }

    IdentityPathMeta:
      type: object
      required: [label, icon, description, evolutionTheme]
      properties:
        label:         { type: string }
        icon:          { type: string }
        description:   { type: string }
        evolutionTheme: { type: string }

    TodayGoalProgress:
      type: object
      required: [goals, progress, fitnessLevel, suggestedActivities, xpMultiplier, streakAtRisk, lowImpactFirst]
      properties:
        goals:
          type: object
          properties:
            steps:       { type: integer }
            workouts:    { type: integer }
            durationMin: { type: integer }
        progress:
          type: object
          properties:
            steps:           { type: integer }
            workouts:        { type: integer }
            stepsPercent:    { type: integer }
            workoutsPercent: { type: integer }
        fitnessLevel:      { type: string }
        accessibilityMode: { type: string }
        identityPath:      { type: string, nullable: true }
        identityPathMeta:
          nullable: true
          $ref: "#/components/schemas/IdentityPathMeta"
        suggestedActivities:
          type: array
          items: { type: string }
        xpMultiplier:    { type: number }
        streakAtRisk:    { type: boolean }
        recoveryMessage: { type: string, nullable: true }
        lowImpactFirst:  { type: boolean }

    FamilyMember:
      type: object
      required: [id, username, level, currentStreak, weeklySteps]
      properties:
        id:           { type: integer }
        username:     { type: string }
        displayName:  { type: string, nullable: true }
        avatarUrl:    { type: string, nullable: true }
        level:        { type: integer }
        currentStreak: { type: integer }
        totalSteps:   { type: integer }
        weeklySteps:  { type: integer }
        fitnessLevel: { type: string }
        identityPath: { type: string, nullable: true }

    FamilyGroup:
      type: object
      required: [id, name, creatorId, inviteCode, createdAt, members, hasParentalPin]
      properties:
        id:            { type: integer }
        name:          { type: string }
        creatorId:     { type: integer }
        inviteCode:    { type: string }
        createdAt:     { type: string }
        hasParentalPin: { type: boolean }
        members:
          type: array
          items:
            $ref: "#/components/schemas/FamilyMember"

    CreateFamilyGroupInput:
      type: object
      required: [name]
      properties:
        name:       { type: string }
        parentalPin: { type: string }

    JoinFamilyGroupInput:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:  { type: string }
        parentalPin: { type: string }

    # ── Location & GPS Leaderboard Schemas ────────────────────────────────────
    LocationUpdateBody:
      type: object
      properties:
        latitude:     { type: number }
        longitude:    { type: number }
        city:         { type: string }
        state:        { type: string }
        county:       { type: string }
        country:      { type: string }
        countryCode:  { type: string }
        visibility:
          type: string
          enum: [exact, neighborhood, city, hidden]

    PlayerLocationRecord:
      type: object
      description: >
        Location record derived from reverse geocoding. Privacy-first design: raw GPS coordinates
        are NEVER stored — only city/state/county/country fields from Nominatim. The "nearby" scope
        uses same-city matching (no distance calculation required). Visibility mirrors
        players.locationVisibility and is the canonical privacy control.
      required: [id, playerId, visibility, updatedAt]
      properties:
        id:          { type: integer }
        playerId:    { type: integer }
        country:     { type: ["string", "null"] }
        countryCode: { type: ["string", "null"] }
        state:       { type: ["string", "null"] }
        county:      { type: ["string", "null"] }
        city:        { type: ["string", "null"] }
        visibility:  { type: string, enum: [exact, neighborhood, city, hidden] }
        updatedAt:   { type: string }

    ArtifactCollectorEntry:
      type: object
      required: [position, playerId, username, rank, artifactCount, rarityScore, isMe]
      properties:
        position:      { type: integer }
        playerId:      { type: integer }
        username:      { type: string }
        displayName:   { type: ["string", "null"] }
        avatarUrl:     { type: ["string", "null"] }
        rank:          { type: string }
        artifactCount: { type: integer }
        rarityScore:   { type: integer }
        rarestRarity:  { type: ["string", "null"] }
        rarestName:    { type: ["string", "null"] }
        isMe:          { type: boolean }

    ScopedLeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, metricValue, metricLabel, isMe, currentStreak]
      properties:
        position:     { type: integer }
        playerId:     { type: integer }
        username:     { type: string }
        displayName:  { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        rank:         { type: string }
        metricValue:  { type: integer }
        metricLabel:  { type: string }
        isMe:         { type: boolean }
        currentStreak: { type: integer }

    ScopedLeaderboardResult:
      type: object
      required: [entries, scope, metric, locationRequired]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ScopedLeaderboardEntry"
        myEntry:
          oneOf:
            - $ref: "#/components/schemas/ScopedLeaderboardEntry"
            - type: "null"
        scope:            { type: string, enum: [world, country, state, county, city, nearby] }
        metric:           { type: string, enum: [xp, steps, workouts, battle_wins, streaks, artifacts] }
        totalInScope:     { type: integer }
        locationRequired: { type: boolean }
        locationContext:
          type: object
          nullable: true
          properties:
            city:    { type: ["string", "null"] }
            state:   { type: ["string", "null"] }
            country: { type: ["string", "null"] }

    LocalChallenge:
      type: object
      required: [id, title, scope, scopeValue, metric, targetValue, startAt, endAt, rewardXp, rewardCoins, participantCount, isJoined, isRelevant]
      properties:
        id:               { type: integer }
        title:            { type: string }
        description:      { type: ["string", "null"] }
        scope:            { type: string }
        scopeValue:       { type: string }
        metric:           { type: string }
        targetValue:      { type: integer }
        startAt:          { type: string }
        endAt:            { type: string }
        rewardXp:         { type: integer }
        rewardCoins:      { type: integer }
        rewardArtifactId: { type: ["integer", "null"] }
        participantCount: { type: integer }
        isJoined:         { type: boolean }
        isRelevant:       { type: boolean }

    LocalChallengeLeaderboardEntry:
      type: object
      required: [rank, playerId, username, level, currentValue, isMe]
      properties:
        rank:         { type: integer }
        playerId:     { type: integer }
        username:     { type: string }
        displayName:  { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        level:        { type: integer }
        currentValue: { type: integer }
        completedAt:  { type: ["string", "null"] }
        isMe:         { type: boolean }

    LocalChallengeLeaderboardResult:
      type: object
      required: [challenge, entries]
      properties:
        challenge:
          $ref: "#/components/schemas/LocalChallenge"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LocalChallengeLeaderboardEntry"
        myEntry:
          oneOf:
            - $ref: "#/components/schemas/LocalChallengeLeaderboardEntry"
            - type: "null"

    # ── Nutrition ──────────────────────────────────────────────────────────
    NutritionMacroBreakdown:
      type: object
      required: [calories, protein, carbs, fat]
      properties:
        calories: { type: number }
        protein:  { type: number }
        carbs:    { type: number }
        fat:      { type: number }

    NutritionTopFood:
      type: object
      required: [name, emoji, count]
      properties:
        name:  { type: string }
        emoji: { type: string }
        count: { type: integer }

    NutritionWeeklySummary:
      type: object
      required:
        - weekStart
        - daysLogged
        - mealsLogged
        - averages
        - targets
        - gaps
        - ratios
        - adherence
        - topFoods
        - hatchlingMood
        - hatchlingEmoji
        - aiTip
        - aiSource
      properties:
        weekStart:   { type: string, format: date-time }
        daysLogged:  { type: integer }
        mealsLogged: { type: integer }
        averages: { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        targets:  { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        gaps:     { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        ratios:   { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        adherence: { type: number }
        topFoods:
          type: array
          items:
            $ref: "#/components/schemas/NutritionTopFood"
        hatchlingMood:
          type: string
          enum: [thriving, happy, okay, hungry, sad]
        hatchlingEmoji: { type: string }
        aiTip:          { type: string }
        aiSource:
          type: string
          enum: [ai, fallback]

    MealAuthor:
      type: object
      required: [id, username, displayName]
      properties:
        id:          { type: integer }
        username:    { type: string }
        displayName: { type: ["string", "null"] }

    MealPost:
      type: object
      required:
        - id
        - playerId
        - emoji
        - name
        - tag
        - aiAnalyzed
        - likesCount
        - commentsCount
        - createdAt
        - liked
        - author
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        imageUrl:      { type: ["string", "null"] }
        emoji:         { type: string }
        name:          { type: string }
        tag:           { type: string }
        description:   { type: ["string", "null"] }
        calories:      { type: ["integer", "null"] }
        proteinG:      { type: ["number", "null"] }
        carbsG:        { type: ["number", "null"] }
        fatG:          { type: ["number", "null"] }
        aiAnalyzed:    { type: boolean }
        likesCount:    { type: integer }
        commentsCount: { type: integer }
        createdAt:     { type: string }
        liked:         { type: boolean }
        author:
          $ref: "#/components/schemas/MealAuthor"

    MealPostFeedPage:
      type: object
      required: [mode, fellBackToDiscover, posts]
      properties:
        mode:
          type: string
          enum: [feed, discover]
        fellBackToDiscover: { type: boolean }
        posts:
          type: array
          items:
            $ref: "#/components/schemas/MealPost"

    CreateMealPostInput:
      type: object
      required: [playerId, name]
      properties:
        playerId:     { type: integer }
        name:         { type: string, minLength: 1, maxLength: 100 }
        emoji:        { type: string }
        tag:          { type: string }
        description:  { type: string }
        imageUrl:
          type: string
          description: Object path returned by `/storage/uploads/request-url`. Must start with `/objects/`.
          maxLength: 500
        uploadToken:
          type: string
          description: HMAC token issued alongside the presigned upload URL. Required when `imageUrl` is provided.
          minLength: 1
          maxLength: 256
        calories:     { type: number }
        proteinG:     { type: number }
        carbsG:       { type: number }
        fatG:         { type: number }
        aiAnalyzed:   { type: boolean }
        qualityScore: { type: integer, minimum: 1, maximum: 10 }

    MealHatchlingStatChange:
      type: object
      required: [hatchlingId, hatchlingName, happinessDelta, energyDelta, happiness, energy, buffActive]
      properties:
        hatchlingId:    { type: integer }
        hatchlingName:  { type: string }
        happinessDelta: { type: integer }
        energyDelta:    { type: integer }
        happiness:      { type: integer }
        energy:         { type: integer }
        buffActive:     { type: boolean }

    MealDailyMacroRewardHatchling:
      type: object
      required: [hatchlingId, hatchlingName, bondDelta, xpDelta]
      properties:
        hatchlingId:   { type: integer }
        hatchlingName: { type: string }
        bondDelta:     { type: integer }
        xpDelta:       { type: integer }

    MealDailyMacroReward:
      type: object
      required:
        - currentStreak
        - longestStreak
        - playerXpDelta
        - playerCoinsDelta
        - hatchlingReward
        - goal
        - totals
        - target
      properties:
        currentStreak:    { type: integer }
        longestStreak:    { type: integer }
        playerXpDelta:    { type: integer }
        playerCoinsDelta: { type: integer }
        hatchlingReward:
          oneOf:
            - $ref: "#/components/schemas/MealDailyMacroRewardHatchling"
            - type: "null"
        goal:   { type: string }
        totals: { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        target: { $ref: "#/components/schemas/NutritionMacroBreakdown" }

    CreateMealPostResult:
      type: object
      required:
        - id
        - playerId
        - emoji
        - name
        - tag
        - aiAnalyzed
        - likesCount
        - commentsCount
        - createdAt
        - newBadges
        - hatchlingStatChange
        - dailyMacroReward
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        imageUrl:      { type: ["string", "null"] }
        emoji:         { type: string }
        name:          { type: string }
        tag:           { type: string }
        description:   { type: ["string", "null"] }
        calories:      { type: ["integer", "null"] }
        proteinG:      { type: ["number", "null"] }
        carbsG:        { type: ["number", "null"] }
        fatG:          { type: ["number", "null"] }
        aiAnalyzed:    { type: boolean }
        likesCount:    { type: integer }
        commentsCount: { type: integer }
        createdAt:     { type: string }
        newBadges:
          type: array
          items: { type: string }
        hatchlingStatChange:
          oneOf:
            - $ref: "#/components/schemas/MealHatchlingStatChange"
            - type: "null"
        dailyMacroReward:
          oneOf:
            - $ref: "#/components/schemas/MealDailyMacroReward"
            - type: "null"

    MealLikeResult:
      type: object
      required: [liked, likesCount]
      properties:
        liked:      { type: boolean }
        likesCount: { type: integer }

    MealCommentAuthor:
      type: object
      required: [username, displayName]
      properties:
        username:    { type: string }
        displayName: { type: ["string", "null"] }

    MealComment:
      type: object
      required: [id, mealPostId, playerId, content, createdAt, author]
      properties:
        id:         { type: integer }
        mealPostId: { type: integer }
        playerId:   { type: integer }
        content:    { type: string }
        createdAt:  { type: string }
        author:
          $ref: "#/components/schemas/MealCommentAuthor"

    AddMealCommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }

    NutritionAnalyzeInput:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 3, maxLength: 500 }

    NutritionAnalyzeResult:
      type: object
      properties:
        calories:      { type: number }
        protein_g:     { type: number }
        carbs_g:       { type: number }
        fat_g:         { type: number }
        quality_score: { type: integer, minimum: 1, maximum: 10 }
        suggestions:
          type: array
          items: { type: string }

    NutritionChallenge:
      type: object
      required:
        - key
        - name
        - description
        - target
        - unit
        - xpReward
        - coinsReward
        - badge
        - icon
        - currentValue
        - completedAt
      properties:
        key:          { type: string }
        name:         { type: string }
        description:  { type: string }
        target:       { type: integer }
        unit:         { type: string }
        xpReward:     { type: integer }
        coinsReward:  { type: integer }
        badge:        { type: string }
        icon:         { type: string }
        currentValue: { type: integer }
        completedAt:  { type: ["string", "null"] }

    ChallengeProgressInput:
      type: object
      required: [playerId]
      properties:
        playerId:  { type: integer }
        increment: { type: integer, default: 1 }

    ChallengeProgressResult:
      type: object
      required: [currentValue, target]
      properties:
        currentValue:     { type: integer }
        target:           { type: integer }
        isComplete:       { type: boolean }
        alreadyCompleted: { type: boolean }
        newBadge:         { type: ["string", "null"] }

    NutritionMacroTarget:
      type: object
      required: [goal, calories, protein, carbs, fat, tip, aiPersonalized]
      properties:
        goal:           { type: string }
        calories:       { type: number }
        protein:        { type: number }
        carbs:          { type: number }
        fat:            { type: number }
        tip:            { type: string }
        aiPersonalized: { type: boolean }

    NutritionStreakToday:
      type: object
      required: [totals, target, tolerance]
      properties:
        totals:    { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        target:    { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        tolerance: { type: number }

    NutritionStreak:
      type: object
      required: [currentStreak, longestStreak, lastHitDate, hitToday, today]
      properties:
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        lastHitDate:   { type: ["string", "null"] }
        hitToday:      { type: boolean }
        today:
          $ref: "#/components/schemas/NutritionStreakToday"

    NutritionRecapSendResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }

    PhysiqueGoalInput:
      type: object
      required: [playerId, physiqueGoal]
      properties:
        playerId:     { type: integer }
        physiqueGoal: { type: string }

    PhysiqueGoalResult:
      type: object
      required: [physiqueGoal]
      properties:
        physiqueGoal: { type: string }
