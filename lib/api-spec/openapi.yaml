openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HatchUp Fitness Pals Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: accessibility
    description: Onboarding, adaptive goals, family teams, and accessibility settings
  - name: health
    description: Health operations
  - name: players
    description: Player profile and stats
  - name: hatchlings
    description: Creature/hatchling management
  - name: evolutions
    description: Evolution catalog and system
  - name: competitions
    description: Mini-games and competitive play
  - name: leaderboards
    description: Rankings and leaderboards
  - name: items
    description: Items and inventory
  - name: events
    description: Live events
  - name: clubs
    description: Clubs and guilds
  - name: eggs
    description: Egg incubation and hatching
  - name: fitness
    description: Fitness tracking, quests, and realms
  - name: training
    description: AI workout plans, meal plans, and coaching
  - name: health-sync
    description: Health platform connections and passive fitness sync
  - name: groups
    description: Workout groups, team energy, challenges, raids, and chat
  - name: coach
    description: AI Fitness Coach chat
  - name: challenges
    description: User-generated fitness challenges
  - name: social
    description: Social feed, posts, reactions, comments, follows, and creator profiles
  - name: storage
    description: Object storage upload and serving endpoints
  - name: notifications
    description: In-app notifications (challenge invites, etc.)
  - name: nutrition
    description: Meal logging, macro tracking, and weekly nutrition rollups
  - name: appeals
    description: Account suspension appeals (player-facing and admin moderation)
  - name: analytics
    description: Lightweight product analytics events

paths:
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'

  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Send a message to the AI Fitness Coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatBody"
      responses:
        "200":
          description: SSE stream of coach reply chunks
          content:
            text/event-stream:
              schema:
                type: string

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Players ──────────────────────────────────────────────────────────────
  /players:
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/search:
    get:
      operationId: searchPlayers
      tags: [players]
      summary: Search players by username or display name
      description: |
        Returns up to `limit` players whose username or displayName contains the
        query string (case-insensitive). Used by the Invite Friends sheet on
        challenges to let creators invite anyone, not just people they follow.
        The current player is excluded from results.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Matching players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerStub"

  /players/invite-suggestions:
    get:
      operationId: listInviteSuggestions
      tags: [players]
      summary: Suggested players for the Invite Friends sheet
      description: |
        Returns a default list of players the viewer is likely to want to invite
        to a challenge BEFORE they type a search query. Combines (in priority
        order):
          1. Recent invitees — players the viewer has previously invited to any
             challenge (most recent first).
          2. Players the viewer follows.
          3. Shared-group members (other people in the viewer's groups).
        Applies the canonical people-discovery exclusion rule (blocked /
        hidden-visibility / minor accounts). May return an empty list for
        brand-new accounts with no follows, no past invites, and no groups.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Suggested players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerStub"

  /players/nearby:
    get:
      operationId: listNearbyPlayers
      tags: [players]
      summary: List players near the viewer
      description: |
        Returns players in the viewer's city (the "nearby" geographic scope),
        excluding the viewer, blocked users (in either direction), minors, and
        anyone whose locationVisibility is `hidden`. Each entry carries a
        privacy-safe distance bucket — never a raw coordinate or precise
        distance. Empty array if the viewer has no stored city/location.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Nearby players
          content:
            application/json:
              schema:
                type: object
                required: [entries, city, locationRequired]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/NearbyPlayer"
                  city:
                    type: ["string", "null"]
                    description: Viewer's stored city, or null if not set.
                  locationRequired:
                    type: boolean
                    description: True if the viewer has no city set and must update their location to see nearby players.

  /players/me:
    get:
      operationId: getCurrentPlayer
      tags: [players]
      summary: Get the authenticated player's own profile
      responses:
        "200":
          description: Current player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player profile not found

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/dashboard:
    get:
      operationId: getPlayerDashboard
      tags: [players]
      summary: Get player dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDashboard"

  # ── Hatchlings ────────────────────────────────────────────────────────────
  /hatchlings:
    get:
      operationId: listHatchlings
      tags: [hatchlings]
      summary: List hatchlings (optionally by owner)
      parameters:
        - name: playerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"
    post:
      operationId: createHatchling
      tags: [hatchlings]
      summary: Hatch a new creature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/{id}:
    get:
      operationId: getHatchling
      tags: [hatchlings]
      summary: Get hatchling by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hatchling found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
        "404":
          description: Not found
    patch:
      operationId: updateHatchling
      tags: [hatchlings]
      summary: Update hatchling (name, mood, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
    delete:
      operationId: deleteHatchling
      tags: [hatchlings]
      summary: Release a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /hatchlings/{id}/share-image:
    get:
      operationId: getHatchlingShareImage
      tags: [hatchlings]
      summary: Get a shareable PNG image card for a hatchling
      description: |
        Renders a 1200×630 branded PNG share card for the given hatchling.
        No authentication required — the image is intentionally public so
        social platforms and messaging apps can unfurl the card without a
        session cookie. An optional `steps` query parameter overrides the
        step count shown in the footer; when omitted the player's stored
        total steps are used.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: steps
          in: query
          required: false
          description: Step count to display on the card (overrides player total).
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: PNG share card image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid hatchling id.
        "404":
          description: Hatchling not found.
        "500":
          description: Failed to render share image.

  /hatchlings/{id}/evolve:
    post:
      operationId: evolveHatchling
      tags: [hatchlings]
      summary: Trigger evolution for a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveInput"
      responses:
        "200":
          description: Evolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolveHatchlingResponse"

  /hatchlings/showcase:
    get:
      operationId: getHatchlingShowcase
      tags: [hatchlings]
      summary: Get top/featured hatchlings for showcase
      responses:
        "200":
          description: Showcase hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"

  # ── Evolutions ────────────────────────────────────────────────────────────
  /evolutions:
    get:
      operationId: listEvolutions
      tags: [evolutions]
      summary: List all evolution types in the catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
        - name: realm
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Evolution catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionType"

  /evolutions/{id}:
    get:
      operationId: getEvolution
      tags: [evolutions]
      summary: Get evolution type by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evolution type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionType"

  /evolutions/categories:
    get:
      operationId: getEvolutionCategories
      tags: [evolutions]
      summary: Get evolution categories with counts
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionCategory"

  /evolutions/realms:
    get:
      operationId: getEvolutionRealms
      tags: [evolutions]
      summary: Get realm metadata with evolution counts
      responses:
        "200":
          description: Realm metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RealmInfo"

  # ── Competitions ──────────────────────────────────────────────────────────
  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List competitions (past and upcoming)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed]
        - name: mode
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Join or create a competition match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Competition created/joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get competition details and results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}/result:
    post:
      operationId: submitCompetitionResult
      tags: [competitions]
      summary: Submit result for a competition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionResultInput"
      responses:
        "200":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/game-modes:
    get:
      operationId: listGameModes
      tags: [competitions]
      summary: List all available game modes
      responses:
        "200":
          description: Game modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameMode"

  # ── Leaderboards ──────────────────────────────────────────────────────────
  /leaderboards/global:
    get:
      operationId: getGlobalLeaderboard
      tags: [leaderboards]
      summary: Get global player leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Global leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/by-mode:
    get:
      operationId: getModeLeaderboard
      tags: [leaderboards]
      summary: Get leaderboard for a specific game mode
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Mode leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/speed:
    get:
      operationId: getSpeedLeaderboard
      tags: [leaderboards]
      summary: Get speed/fitness leaderboard (mode=steps for top daily steps, mode=pace for fastest runners)
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [steps, pace]
            default: steps
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Speed leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeedLeaderboardEntry"

  /leaderboards/rank-distribution:
    get:
      operationId: getRankDistribution
      tags: [leaderboards]
      summary: Get distribution of players across ranks
      responses:
        "200":
          description: Rank distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankDistribution"

  /leaderboards/artifacts:
    get:
      operationId: getArtifactsLeaderboard
      tags: [leaderboards]
      summary: Top artifact collectors ranked by weighted rarity score
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Top artifact collectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactCollectorEntry"

  # ── Artifacts ─────────────────────────────────────────────────────────────
  /artifacts:
    get:
      operationId: listArtifacts
      tags: [players]
      summary: Get artifact museum — all artifacts with per-player discovery state
      responses:
        "200":
          description: Artifact museum list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactMuseumEntry"

  /players/me/artifacts:
    get:
      operationId: getMyArtifacts
      tags: [players]
      summary: Get owned artifacts for the authenticated player
      responses:
        "200":
          description: Owned artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedArtifact"

  /players/me/artifacts/{id}:
    patch:
      operationId: toggleOwnedArtifact
      tags: [players]
      summary: Toggle equipped / featured state on an owned artifact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleOwnedArtifactBody"
      responses:
        "200":
          description: Updated owned artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedArtifact"
        "404":
          description: Artifact not owned by the authenticated player

  /players/me/featured-swap:
    post:
      operationId: swapFeaturedArtifact
      tags: [players]
      summary: Atomically swap one featured artifact for another in a single transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapFeaturedArtifactBody"
      responses:
        "200":
          description: Swap completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapFeaturedArtifactResponse"
        "400":
          description: Invalid input or removeId is not currently featured
        "404":
          description: One of the artifacts is not owned by the authenticated player

  /players/me/featured-order:
    put:
      operationId: reorderFeaturedArtifacts
      tags: [players]
      summary: Reorder the authenticated player's featured artifact showcase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFeaturedArtifactsBody"
      responses:
        "200":
          description: New featured order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderFeaturedArtifactsResponse"

  /players/me/fitness-bars:
    get:
      operationId: getMyFitnessBars
      tags: [players]
      summary: Get all 8 fitness bar levels for the authenticated player
      responses:
        "200":
          description: Fitness bars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessBar"

  /players/me/daily-streak:
    get:
      operationId: getDailyStreak
      tags: [players]
      summary: Get the player's daily login streak state and 30-day reward calendar
      responses:
        "200":
          description: Daily streak state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStreakState"

  /players/me/daily-claim:
    post:
      operationId: claimDailyReward
      tags: [players]
      summary: Claim today's daily login reward
      responses:
        "200":
          description: Reward claimed and granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyClaimResult"
        "400":
          description: Already claimed today or invalid request
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /players/me/streak-shield/buy:
    post:
      operationId: buyStreakShield
      tags: [players]
      summary: Purchase a Streak Shield for 200 coins
      responses:
        "200":
          description: Shield purchased successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyStreakShieldResult"
        "400":
          description: Not enough coins
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }

  /artifacts/world-notifications:
    get:
      operationId: getArtifactWorldNotifications
      tags: [players]
      summary: Get recent world notifications for Mythic+ artifact drops
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: World notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactWorldNotification"

  # ── Artifact Loadouts ────────────────────────────────────────────────────
  /artifacts/loadout/{hatchlingId}:
    get:
      operationId: getArtifactLoadout
      tags: [players]
      summary: Get the active artifact loadout for a hatchling
      parameters:
        - name: hatchlingId
          in: path
