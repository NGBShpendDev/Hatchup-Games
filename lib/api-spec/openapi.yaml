                $ref: "#/components/schemas/PushSubscribeResult"

  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [notifications]
      summary: Remove a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /push/preferences:
    get:
      operationId: getPushPreferences
      tags: [notifications]
      summary: Get per-category push notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreferences"
    patch:
      operationId: updatePushPreferences
      tags: [notifications]
      summary: Update per-category push notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreferences"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List in-app notifications for the current player
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

    post:
      operationId: upsertNotification
      tags: [notifications]
      summary: Create an in-app notification for the current player (idempotent on type+sourceId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type:     { type: string }
                title:    { type: string }
                body:     { type: string }
                link:     { type: string }
                sourceId: { type: ["integer", "null"] }
      responses:
        "200":
          description: Already existed (deduped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get unread notification count for the current player
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read for the current player
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /clubs/{id}/invite:
    post:
      operationId: inviteToClub
      tags: [clubs]
      summary: Invite a player to a club (admins/leaders only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToClubBody"
      responses:
        "201":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubInvite"

  /club-invites:
    get:
      operationId: getMyClubInvites
      tags: [clubs]
      summary: Get pending club invites for the current player
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: array
