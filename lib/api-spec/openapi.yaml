    ArtifactAbility:
      type: object
      required: [name, description, value]
      properties:
        name:        { type: string }
        description: { type: string }
        value:       { type: number }

    ArtifactMuseumEntry:
      type: object
      required: [id, name, lore, rarity, type, imageSlug, isHidden, abilities, discovered, isEquipped, isFeatured]
