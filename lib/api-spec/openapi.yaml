        isFeatured:  { type: boolean }
        earnedAt:    { type: ["string", "null"] }

    OwnedArtifact:
      type: object
      required: [id, name, lore, rarity, type, imageSlug, abilities, isEquipped, isFeatured, earnedAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        lore:        { type: string }
        rarity:      { type: string }
        type:        { type: string }
        imageSlug:   { type: string }
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactAbility"
        isEquipped:  { type: boolean }
        isFeatured:  { type: boolean }
        earnedAt:    { type: string }

    FitnessBar:
      type: object
      required: [barType, level, xp, nextLevelXp, xpInCurrentLevel, progressPct]
