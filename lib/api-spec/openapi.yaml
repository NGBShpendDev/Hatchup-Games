  # ── Social Feed ───────────────────────────────────────────────────────────
  /social/feed:
    get:
      operationId: getSocialFeed
      tags: [social]
      summary: Get social feed (followed + global, scored by algorithm)
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: shuffle
          in: query
          description: When true, randomly samples `limit` posts from the top-scoring candidates so repeat visits see fresh highlights. Cursor is ignored when shuffling.
          schema:
            type: boolean
            default: false
        - name: excludeIds
          in: query
          description: |
            Comma-separated post ids the viewer has recently seen. Only honored in
            shuffle mode — the server drops these from the candidate pool before
            sampling so highlights don't repeat across visits, and falls back to
            the full pool if too few candidates remain after filtering.
          schema:
            type: string
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"

  /social/trending:
    get:
      operationId: getTrendingPosts
      tags: [social]
      summary: Get trending posts ranked by recent view counts
      description: |
        Returns posts with the most views in the selected window (day or week).
        Posts older than the window are excluded so the surface stays fresh.
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
        - name: window
          in: query
          description: Trending window. `day` covers the last 24h, `week` covers the last 7 days.
          schema:
            type: string
            enum: [day, week]
            default: day
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Trending posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingPage"

  /social/posts:
    post:
      operationId: createPost
      tags: [social]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPost"
        "422":
          description: Content flagged by moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationError"

  /social/posts/{id}:
    get:
      operationId: getPost
      tags: [social]
      summary: Get a single post with comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPost"
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [social]
      summary: Delete own post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /social/posts/{id}/view:
    post:
      operationId: recordPostView
      tags: [social]
      summary: Record a view on a post (deduped per viewer per day)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewResult"
        "404":
          description: Not found

  /social/posts/{id}/view-series:
    get:
      operationId: getPostViewSeries
      tags: [social]
      summary: View counts bucketed over a trailing window (creator-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: query
          required: true
          description: The viewing player — must be the post owner.
          schema:
            type: integer
        - name: window
          in: query
          required: false
          description: |
            Trend window. `day` returns 24 hourly buckets (default).
            `week` returns 7 daily buckets so creators can see slower-burn momentum.
            `month` returns 5 weekly buckets (~35 days) for evergreen posts that
            keep accruing views over weeks.
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        "200":
          description: Hourly view series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViewSeries"
        "403":
          description: Not the post owner
        "404":
          description: Post not found

  /social/posts/{id}/react:
    post:
