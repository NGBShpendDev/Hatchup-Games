      operationId: getDailyMemory
      tags: [social]
      summary: Get today's memory post for the player (anniversary or milestone)
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memory post or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MemoryPost"
                  - type: "null"

  # ── Health Sync ───────────────────────────────────────────────────────────
  /health/connections:
    get:
      operationId: listHealthConnections
      tags: [health-sync]
      summary: List the player's health platform connections
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthConnection"

  /health/connections/{platform}:
    delete:
      operationId: disconnectHealthPlatform
      tags: [health-sync]
      summary: Disconnect a health platform
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /health/sync:
    post:
      operationId: triggerHealthSync
      tags: [health-sync]
      summary: Manually trigger a Google Fit sync for the current player
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /health/acknowledge-passive-xp:
    post:
      operationId: acknowledgePassiveXp
      tags: [health-sync]
      summary: Acknowledge and reset the passive XP counter
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  # ── Challenges ────────────────────────────────────────────────────────────
  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: Browse challenges (trending, nearby, friends, my)
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [trending, nearby, friends, my]
        - name: metric
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeListItem"
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Create a new challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeBody"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get challenge detail with live leaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Challenge detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "404":
          description: Not found

  /challenges/{id}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join a challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeParticipant"

  /challenges/{id}/progress:
    post:
      operationId: submitChallengeProgress
      tags: [challenges]
      summary: Submit progress update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProgressBody"
      responses:
        "200":
          description: Updated participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeParticipant"

  /challenges/{id}/report:
    post:
      operationId: reportChallenge
      tags: [challenges]
      summary: Report a challenge for moderation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportChallengeBody"
      responses:
        "200":
          description: Reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /challenges/{id}/invite:
    post:
      operationId: inviteToChallenge
      tags: [challenges]
      summary: Invite a player to a challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToChallengeBody"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                type: object

  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [notifications]
      summary: Get the VAPID public key for browser push subscription
      responses:
        "200":
          description: Public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKey"
        "503":
          description: Push not configured

  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [notifications]
      summary: Register a browser push subscription for the current player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeBody"
      responses:
        "200":
          description: Updated existing subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscribeResult"
        "201":
          description: New subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscribeResult"

  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [notifications]
      summary: Remove a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /push/preferences:
    get:
      operationId: getPushPreferences
      tags: [notifications]
      summary: Get per-category push notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreferences"
    patch:
      operationId: updatePushPreferences
      tags: [notifications]
      summary: Update per-category push notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPreferencesUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreferences"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List in-app notifications for the current player
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

    post:
      operationId: upsertNotification
      tags: [notifications]
      summary: Create an in-app notification for the current player (idempotent on type+sourceId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type:     { type: string }
                title:    { type: string }
                body:     { type: string }
                link:     { type: string }
                sourceId: { type: ["integer", "null"] }
      responses:
        "200":
          description: Already existed (deduped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get unread notification count for the current player
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read for the current player
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /challenge-invites:
    get:
      operationId: getMyChallengeInvites
      tags: [challenges]
      summary: Get pending challenge invites for the current player
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeInvite"

  /challenge-invites/{id}/respond:
    post:
      operationId: respondToChallengeInvite
      tags: [challenges]
      summary: Accept or decline a challenge invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToInviteBody"
      responses:
        "200":
          description: Responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  # ── Accessibility & Adaptive Goals ───────────────────────────────────────────
  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [accessibility]
      summary: Save onboarding answers (fitness level, age range, accessibility mode, identity path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  player: { type: object }
                  identityPathMeta:
                    $ref: "#/components/schemas/IdentityPathMeta"

  /goals/today:
    get:
      operationId: getTodayGoals
      tags: [accessibility]
      summary: Get personalized adaptive daily goals and progress
      responses:
        "200":
          description: Today's goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayGoalProgress"

  /identity-paths:
    get:
      operationId: listIdentityPaths
      tags: [accessibility]
      summary: List all available fitness identity paths
      responses:
        "200":
          description: Identity paths map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/IdentityPathMeta"

  /streak/recover:
    post:
      operationId: acknowledgeStreakRecovery
      tags: [accessibility]
      summary: Acknowledge streak recovery message (no-shame reset acknowledgement)
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean }
                  streak:        { type: integer }
                  xp:            { type: integer }

  /family-groups:
    post:
      operationId: createFamilyGroup
      tags: [accessibility]
      summary: Create a new family group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyGroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyGroup"

  /family-groups/join:
    post:
      operationId: joinFamilyGroup
      tags: [accessibility]
      summary: Join an existing family group via invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyGroupInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined:    { type: boolean }
                  groupId:   { type: integer }
                  groupName: { type: string }

  /family-groups/{id}:
    get:
      operationId: getFamilyGroup
      tags: [accessibility]
      summary: Get family group details with weekly leaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Family group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyGroup"

  /family-groups/{id}/leave:
    post:
      operationId: leaveFamilyGroup
      tags: [accessibility]
      summary: Leave a family group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                type: object
                properties:
                  left: { type: boolean }

  # ── Location & GPS Leaderboard ─────────────────────────────────────────────
  /players/me/location:
    post:
      operationId: updateMyLocation
      tags: [players]
      summary: Update the current player's approximate location (derived from GPS or direct fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdateBody"
      responses:
        "200":
          description: Location stored (coordinates never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerLocationRecord"
    get:
      operationId: getMyLocation
      tags: [players]
      summary: Get the current player's stored location
      responses:
        "200":
          description: Location record or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlayerLocationRecord"
                  - type: "null"

  /leaderboards/scoped:
    get:
      operationId: getScopedLeaderboard
      tags: [leaderboards]
      summary: Get location-scoped leaderboard with configurable metric
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [world, country, state, county, city, nearby]
            default: world
        - name: metric
          in: query
          schema:
            type: string
            enum: [xp, steps, workouts, battle_wins, streaks, artifacts]
            default: xp
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Scoped leaderboard result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedLeaderboardResult"

  /local-challenges:
    get:
      operationId: listLocalChallenges
      tags: [leaderboards]
      summary: List active local GPS-based challenges visible to the current player
      responses:
        "200":
          description: Active local challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalChallenge"

  /local-challenges/{id}/join:
    post:
      operationId: joinLocalChallenge
      tags: [leaderboards]
      summary: Join a local challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined:       { type: boolean }
                  alreadyJoined: { type: boolean }

  /local-challenges/{id}/leaderboard:
    get:
      operationId: getLocalChallengeLeaderboard
      tags: [leaderboards]
      summary: Get leaderboard for a specific local challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Challenge leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalChallengeLeaderboardResult"

  # ── Nutrition ────────────────────────────────────────────────────────────
  /nutrition/summary:
    get:
      operationId: getNutritionSummary
      tags: [nutrition]
      summary: Weekly nutrition rollup for the authenticated player
      description: |
        Returns the player's last-7-days nutrition rollup: average daily macros,
        per-macro gaps and ratios vs the daily target derived from their
        physique goal, an overall adherence score, top logged foods, an AI
        (or static fallback) coaching tip, and a derived mood label for the
        active Hatchling that reflects how well targets were hit.
      responses:
        "200":
          description: Weekly nutrition summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionWeeklySummary"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/posts:
    get:
      operationId: listNutritionPosts
      tags: [nutrition]
      summary: List meal posts for the authenticated player
      description: |
        Returns a page of meal posts. In `feed` mode, results are restricted to
        the viewer and people they share a group with. When the viewer has no
        follow/group connections yet, the server automatically falls back to
        the global `discover` feed and reports that via `fellBackToDiscover`.
        Posts from blocked / blocking players are filtered out.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: mode
          in: query
          schema:
            type: string
            enum: [feed, discover]
            default: feed
      responses:
        "200":
          description: Meal post feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPostFeedPage"
    post:
      operationId: createMealPost
      tags: [nutrition]
      summary: Create a meal post
      description: |
        Logs a meal for the authenticated player. Optionally accepts macros and
        an AI-derived quality score; the server independently derives a quality
        score from the macros and uses the more conservative value to buff or
        debuff the player's active Hatchling. May also award badges and trigger
        the daily macro-target streak reward when all four macros land within
        ±10% of the player's daily target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealPostInput"
      responses:
        "201":
          description: Meal post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMealPostResult"
        "400":
          description: Invalid input or upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "403":
          description: Invalid or missing uploadToken for imageUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/posts/{id}/like:
    post:
      operationId: toggleMealPostLike
      tags: [nutrition]
      summary: Toggle a like on a meal post
      description: |
        Idempotent toggle: liking an already-liked post unlikes it. The likes
        counter on the post is updated atomically and never drops below zero.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealLikeResult"

  /nutrition/posts/{id}/comments:
    get:
      operationId: listMealPostComments
      tags: [nutrition]
      summary: List comments on a meal post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments on the meal post
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealComment"
    post:
      operationId: addMealPostComment
      tags: [nutrition]
      summary: Add a comment to a meal post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMealCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealComment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/analyze:
    post:
      operationId: analyzeMealDescription
      tags: [nutrition]
      summary: Estimate macros + quality score from a meal description
      description: |
        Sends a free-form meal description to the AI sports-nutritionist model
        and returns estimated macros, a 1-10 quality score, and 1-3 short
        improvement suggestions. Returns a static fallback estimate if the
        model response cannot be parsed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionAnalyzeInput"
      responses:
        "200":
          description: Estimated macros + AI suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionAnalyzeResult"
        "400":
          description: Description missing or too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/challenges:
    get:
      operationId: listNutritionChallenges
      tags: [nutrition]
      summary: List nutrition challenges with the player's current progress
      responses:
        "200":
          description: Challenges with player progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NutritionChallenge"

  /nutrition/challenges/{key}/progress:
    post:
      operationId: incrementNutritionChallengeProgress
      tags: [nutrition]
      summary: Increment progress on a nutrition challenge
      description: |
        Advances the player's progress for `key` by `increment`. When the
        challenge is completed for the first time, XP, coins, and the
        associated badge are awarded. Already-completed challenges return
        `alreadyCompleted=true` without applying further increments.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeProgressInput"
      responses:
        "200":
          description: Updated challenge progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgressResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "404":
          description: Challenge key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/macro-target:
    get:
      operationId: getNutritionMacroTarget
      tags: [nutrition]
      summary: Get the player's daily macro target
      description: |
        Returns the daily macro target for the authenticated player's physique
        goal. The server attempts an AI-personalized target first (using the
        player's level + fitness XP); if the AI call fails or returns invalid
        JSON, it falls back to the static per-goal table. `aiPersonalized`
        indicates which path produced the result.
      responses:
        "200":
          description: Daily macro target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionMacroTarget"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/streak:
    get:
      operationId: getNutritionStreak
      tags: [nutrition]
      summary: Get the player's daily macro-target streak
      description: |
        Returns the current and longest daily macro-target streak for the
        authenticated player, plus today's totals and target so the UI can
        render a progress meter without a second request. A streak lapses
        automatically when the player misses a day.
      responses:
        "200":
          description: Streak snapshot + today's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionStreak"

  /nutrition/recap/send:
    post:
      operationId: sendNutritionRecap
      tags: [nutrition]
      summary: Send this week's nutrition recap notification
      description: |
        Idempotent on-demand trigger. Creates this week's recap notification
        for the authenticated player if one has not already been delivered.
      responses:
        "200":
          description: Whether a recap was sent on this call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionRecapSendResult"
        "500":
          description: Recap delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/physique-goal:
    put:
      operationId: updatePhysiqueGoal
      tags: [nutrition]
      summary: Update the player's physique goal
      description: |
        Updates the physique goal used to derive daily macro targets and
        Hatchling reward tuning. The caller must own `playerId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysiqueGoalInput"
      responses:
        "200":
          description: Updated physique goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysiqueGoalResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:        { type: string, minLength: 1 }
        size:        { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:  { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    StorageErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Player ──────────────────────────────────────────────────────────────
    Player:
      type: object
      required: [id, username, level, xp, coins, rank, totalWins, totalMatches, totalSteps, fitnessXp, currentStreak, fitnessRealm, createdAt]
      properties:
        id:             { type: integer }
        username:       { type: string }
        displayName:    { type: ["string", "null"] }
        avatarUrl:      { type: ["string", "null"] }
        level:          { type: integer }
        xp:             { type: integer }
        coins:          { type: integer }
        rank:           { type: string }
        rankScore:      { type: integer }
        totalWins:      { type: integer }
        totalMatches:   { type: integer }
        clubId:         { type: ["integer", "null"] }
        activeHatchlingId: { type: ["integer", "null"] }
        totalSteps:     { type: integer }
        totalWorkouts:  { type: integer }
        fitnessXp:      { type: integer }
        currentStreak:  { type: integer }
        longestStreak:  { type: integer }
        fitnessRealm:   { type: string }
        waterCups:      { type: integer }
        dailyStepGoal:  { type: integer }
        lastActiveDate: { type: ["string", "null"] }
        createdAt:      { type: string }

    PlayerInput:
      type: object
      required: [username]
      properties:
        username:    { type: string, minLength: 2, maxLength: 20 }
        displayName: { type: string }
        avatarUrl:   { type: string }

    PlayerUpdate:
      type: object
      properties:
        displayName:   { type: string }
        avatarUrl:     { type: string }
        fitnessRealm:  { type: string }
        dailyStepGoal: { type: integer }
        waterCups:     { type: integer }
        activeHatchlingId: { type: ["integer", "null"] }

    PlayerDashboard:
      type: object
      required: [player, hatchlingCount, totalWins, recentCompetitions, activeEvents, topHatchling, activeEggs, fitnessStats]
      properties:
        player:               { $ref: "#/components/schemas/Player" }
        hatchlingCount:       { type: integer }
        totalWins:            { type: integer }
        winRate:              { type: number }
        recentCompetitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"
        activeEvents:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
        topHatchling:         { $ref: "#/components/schemas/Hatchling" }
        activeEggs:
          type: array
          items:
            $ref: "#/components/schemas/Egg"
        fitnessStats:         { $ref: "#/components/schemas/FitnessStats" }

    # ── Hatchling ────────────────────────────────────────────────────────────
    Hatchling:
      type: object
      required: [id, playerId, name, species, evolutionStage, personality, mood, level, xp, happiness, hunger, energy, fitnessType, realm, friendshipLevel, moodState, createdAt]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        name:           { type: string }
        species:        { type: string }
        evolutionStage: { type: integer }
        evolutionType:  { type: ["string", "null"] }
        category:       { type: string }
        rarity:         { type: string }
        personality:    { type: string }
        mood:           { type: string }
        level:          { type: integer }
        xp:             { type: integer }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        abilityName:    { type: ["string", "null"] }
        abilityDesc:    { type: ["string", "null"] }
        imageUrl:       { type: ["string", "null"] }
        isShiny:        { type: boolean }
        isFusion:       { type: boolean }
        color:          { type: ["string", "null"] }
        fitnessType:    { type: string }
        eggId:          { type: ["integer", "null"] }
        realm:          { type: string }
        genetics:       { type: ["object", "null"] }
        friendshipLevel: { type: integer }
        moodState:      { type: string }
        lastWorkoutAt:  { type: ["string", "null"] }
        createdAt:      { type: string }

    HatchlingInput:
      type: object
      required: [playerId, name]
      properties:
        playerId:    { type: integer }
        name:        { type: string, minLength: 1, maxLength: 30 }
        species:     { type: string }
        fitnessType: { type: string }

    HatchlingUpdate:
      type: object
      properties:
        name:           { type: string }
        mood:           { type: string }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        moodState:      { type: string }
        friendshipLevel: { type: integer }
        lastWorkoutAt:  { type: string }

    EvolveInput:
      type: object
      required: [triggerId]
      properties:
        triggerId: { type: integer }

    # ── Evolution ────────────────────────────────────────────────────────────
    EvolutionType:
      type: object
      required: [id, name, category, rarity, description, unlockedCount, realm, stage, evolutionPath, isPrestige]
      properties:
        id:            { type: integer }
        name:          { type: string }
        category:      { type: string }
        rarity:        { type: string }
        description:   { type: string }
        unlockHint:    { type: ["string", "null"] }
        imageUrl:      { type: ["string", "null"] }
        abilityName:   { type: ["string", "null"] }
        abilityDesc:   { type: ["string", "null"] }
        unlockedCount: { type: integer }
        color:         { type: ["string", "null"] }
        fitnessType:   { type: ["string", "null"] }
        realm:         { type: string }
        stage:         { type: integer }
        evolutionPath: { type: string }
        isPrestige:    { type: boolean }

    EvolutionCategory:
      type: object
      required: [category, count, rarest]
      properties:
        category: { type: string }
        count:    { type: integer }
        rarest:   { type: string }
        color:    { type: ["string", "null"] }

    RealmInfo:
      type: object
      required: [id, name, description, color, auraColor, evolutionCount, fitnessTypes]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string }
        color:         { type: string }
        auraColor:     { type: string }
        evolutionCount: { type: integer }
        fitnessTypes:
          type: array
          items:
            type: string

    # ── Competition ──────────────────────────────────────────────────────────
    Competition:
      type: object
      required: [id, mode, status, playerId, hatchlingId, score, rank, createdAt]
      properties:
        id:          { type: integer }
        mode:        { type: string }
        status:      { type: string }
        playerId:    { type: integer }
        playerName:  { type: ["string", "null"] }
        hatchlingId: { type: integer }
        hatchlingName: { type: ["string", "null"] }
        score:       { type: integer }
        rank:        { type: ["integer", "null"] }
        duration:    { type: ["integer", "null"] }
        xpEarned:    { type: ["integer", "null"] }
        coinsEarned: { type: ["integer", "null"] }
        createdAt:   { type: string }

    CompetitionInput:
      type: object
      required: [mode, playerId, hatchlingId]
      properties:
        mode:        { type: string }
        playerId:    { type: integer }
        hatchlingId: { type: integer }

    CompetitionResultInput:
      type: object
      required: [score, duration]
      properties:
        score:    { type: integer }
        duration: { type: integer }
        playerId: { type: integer }

    GameMode:
      type: object
      required: [id, name, description, minLevel]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        minLevel:    { type: integer }
        maxPlayers:  { type: ["integer", "null"] }
        xpMultiplier: { type: number }
        isLive:      { type: boolean }

    # ── Leaderboard ──────────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, score]
      properties:
        position:         { type: integer }
        playerId:         { type: integer }
        username:         { type: string }
        displayName:      { type: string, nullable: true }
        avatarUrl:        { type: string, nullable: true }
        rank:             { type: string }
        score:            { type: integer }
        wins:             { type: integer }
        hatchlingName:    { type: string, nullable: true }
        hatchlingCategory: { type: string, nullable: true }

    RankDistribution:
      type: object
      required: [rank, count, percentage]
      properties:
        rank:       { type: string }
        count:      { type: integer }
        percentage: { type: number }

    # ── Item ─────────────────────────────────────────────────────────────────
    Item:
      type: object
      required: [id, name, description, type, cost, effect]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        cost:        { type: integer }
        effect:      { type: string }
        imageUrl:    { type: ["string", "null"] }
        rarity:      { type: string }

    UseItemInput:
      type: object
      required: [hatchlingId]
      properties:
        hatchlingId: { type: integer }

    # ── Live Event ────────────────────────────────────────────────────────────
    LiveEvent:
      type: object
      required: [id, name, description, type, status, startTime, endTime]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        status:      { type: string }
        startTime:   { type: string }
        endTime:     { type: string }
        rewardXp:    { type: ["integer", "null"] }
        rewardCoins: { type: ["integer", "null"] }
        imageUrl:    { type: ["string", "null"] }
        participantCount: { type: integer }

    # ── Club ─────────────────────────────────────────────────────────────────
    Club:
      type: object
      required: [id, name, description, memberCount, totalXp, rank, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        badge:       { type: ["string", "null"] }
        memberCount: { type: integer }
        maxMembers:  { type: integer }
        totalXp:     { type: integer }
        rank:        { type: string }
        isPublic:    { type: boolean }
        createdAt:   { type: string }

    ClubMember:
      type: object
      required: [id, username, level, rank, totalWins]
      properties:
        id:          { type: integer }
        username:    { type: string }
        displayName: { type: ["string", "null"] }
        avatarUrl:   { type: ["string", "null"] }
        level:       { type: integer }
        rank:        { type: string }
        totalWins:   { type: integer }
        clubRole:    { type: ["string", "null"] }

    ClubInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 2, maxLength: 30 }
        description: { type: string }
        isPublic:    { type: boolean }

    JoinClubInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    # ── Eggs ─────────────────────────────────────────────────────────────────
    Egg:
      type: object
      required: [id, playerId, rarity, eggType, stepsRequired, stepsProgress, isHatched, name, realm, createdAt]
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        rarity:        { type: string }
        eggType:       { type: string }
        realm:         { type: string }
        stepsRequired: { type: integer }
        stepsProgress: { type: integer }
        isHatched:     { type: boolean }
        hatchlingId:   { type: ["integer", "null"] }
        imageUrl:      { type: ["string", "null"] }
        name:          { type: string }
        description:   { type: ["string", "null"] }
        progressPct:   { type: number }
        isReady:       { type: boolean }
        createdAt:     { type: string }
        hatchedAt:     { type: ["string", "null"] }

    AddEggInput:
      type: object
      required: [playerId, eggType]
      properties:
        playerId: { type: integer }
        eggType:  { type: string }
        rarity:   { type: string }

    HatchEggInput:
      type: object
      required: [playerId, name]
      properties:
        playerId: { type: integer }
        name:     { type: string, minLength: 1, maxLength: 30 }

    HatchResult:
      type: object
      required: [egg, hatchling]
      properties:
        egg:       { $ref: "#/components/schemas/Egg" }
        hatchling: { $ref: "#/components/schemas/Hatchling" }

    # ── Fitness ──────────────────────────────────────────────────────────────
    FitnessStats:
      type: object
      required: [playerId, totalSteps, totalWorkouts, fitnessXp, currentStreak, longestStreak, fitnessRealm, waterCups, todaySteps, todayXp, dailyStepGoal]
      properties:
        playerId:       { type: integer }
        totalSteps:     { type: integer }
        totalWorkouts:  { type: integer }
        fitnessXp:      { type: integer }
        currentStreak:  { type: integer }
        longestStreak:  { type: integer }
        fitnessRealm:   { type: string }
        waterCups:      { type: integer }
        todaySteps:     { type: integer }
        todayXp:        { type: integer }
        dailyStepGoal:  { type: integer }
        stepGoalPct:    { type: number }
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/FitnessActivity"

    FitnessActivity:
      type: object
      required: [id, playerId, type, value, unit, fitnessXpEarned, realm, createdAt]
      properties:
        id:              { type: integer }
        playerId:        { type: integer }
        type:            { type: string }
        value:           { type: integer }
        unit:            { type: string }
        fitnessXpEarned: { type: integer }
        realm:           { type: string }
        note:            { type: ["string", "null"] }
        createdAt:       { type: string }

    LogActivityInput:
      type: object
      required: [playerId, type, value]
      properties:
        playerId:      { type: integer }
        type:          { type: string }
        value:         { type: integer }
        note:          { type: string }
        groupId:       { type: integer }
        distanceMiles: { type: number, description: "Optional distance in miles (for running/cycling pace tracking)" }

    ActivityLogResult:
      type: object
      required: [activity, fitnessXpEarned, eggsUpdated, player]
      properties:
        activity:         { $ref: "#/components/schemas/FitnessActivity" }
        fitnessXpEarned:  { type: integer }
        eggsUpdated:      { type: integer }
        player:           { $ref: "#/components/schemas/Player" }
        groupBonusXp:     { type: integer }
        groupXpBonusPct:  { type: integer }
        prResult:
          nullable: true
          type: object
          properties:
            activityType: { type: string }
            metric:       { type: string }
            value:        { type: integer }
            isNew:        { type: boolean }

    FitnessQuest:
      type: object
      required: [id, playerId, title, description, type, targetValue, currentValue, xpReward, coinReward, isCompleted, realm, expiresAt, createdAt]
      properties:
        id:           { type: integer }
        playerId:     { type: integer }
        title:        { type: string }
        description:  { type: string }
        type:         { type: string }
        targetValue:  { type: integer }
        currentValue: { type: integer }
        xpReward:     { type: integer }
        coinReward:   { type: integer }
        isCompleted:  { type: boolean }
        realm:        { type: string }
        expiresAt:    { type: string }
        createdAt:    { type: string }
        progressPct:  { type: number }

    FitnessRealm:
      type: object
      required: [id, name, description, color, icon, fitnessTypes, evolutionBonus]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string }
        color:         { type: string }
        icon:          { type: string }
        fitnessTypes:
          type: array
          items:
            type: string
        evolutionBonus: { type: string }
        playerXp:      { type: ["integer", "null"] }
        isUnlocked:    { type: boolean }

    # ── Training ──────────────────────────────────────────────────────────────
    WorkoutDay:
      type: object
      required: [day, name, exercises, realm, durationMinutes, xpReward]
      properties:
        day:             { type: string }
        name:            { type: string }
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        realm:           { type: string }
        durationMinutes: { type: integer }
        xpReward:        { type: integer }
        coinsReward:     { type: integer }

    Exercise:
      type: object
      required: [name, sets, reps, rest]
      properties:
        name:   { type: string }
        sets:   { type: integer }
        reps:   { type: string }
        rest:   { type: string }
        tip:    { type: string }
        muscle: { type: string }

    WorkoutPlan:
      type: object
      required: [id, playerId, goal, fitnessLevel, equipment, weekNumber, isActive, createdAt, days]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        goal:           { type: string }
        fitnessLevel:   { type: string }
        equipment:      { type: string }
        weekNumber:     { type: integer }
        isActive:       { type: boolean }
        createdAt:      { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutDay"

    WorkoutSession:
      type: object
      required: [id, playerId, workoutType, durationMinutes, exercisesCompleted, xpEarned, coinsEarned, realm, createdAt]
      properties:
        id:                  { type: integer }
        playerId:            { type: integer }
        workoutType:         { type: string }
        durationMinutes:     { type: integer }
        exercisesCompleted:  { type: integer }
        xpEarned:            { type: integer }
        coinsEarned:         { type: integer }
        realm:               { type: string }
        notes:               { type: ["string", "null"] }
        createdAt:           { type: string }

    MealItem:
      type: object
      required: [name, calories, protein, carbs, fat]
      properties:
        name:     { type: string }
        calories: { type: integer }
        protein:  { type: integer }
        carbs:    { type: integer }
        fat:      { type: integer }
        tip:      { type: string }

    MealDay:
      type: object
      required: [day, breakfast, lunch, dinner, snacks, totalCalories, totalProtein]
      properties:
        day:           { type: string }
        breakfast:     { $ref: "#/components/schemas/MealItem" }
        lunch:         { $ref: "#/components/schemas/MealItem" }
        dinner:        { $ref: "#/components/schemas/MealItem" }
        snacks:
          type: array
          items:
            $ref: "#/components/schemas/MealItem"
        totalCalories: { type: integer }
        totalProtein:  { type: integer }
        hydrationGoal: { type: integer }

    MealPlan:
      type: object
      required: [id, playerId, goal, calorieTarget, proteinTarget, carbTarget, fatTarget, isActive, createdAt, days]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        goal:           { type: string }
        calorieTarget:  { type: integer }
        proteinTarget:  { type: integer }
        carbTarget:     { type: integer }
        fatTarget:      { type: integer }
        isActive:       { type: boolean }
        createdAt:      { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/MealDay"

    GeneratePlanInput:
      type: object
      required: [playerId, goal]
      properties:
        playerId:     { type: integer }
        goal:         { type: string }
        fitnessLevel: { type: string }
        equipment:    { type: string }

    LogSessionInput:
      type: object
      required: [playerId, workoutType, durationMinutes]
      properties:
        playerId:           { type: integer }
        workoutType:        { type: string }
        durationMinutes:    { type: integer }
        exercisesCompleted: { type: integer }
        notes:              { type: string }

    GenerateMealPlanInput:
      type: object
      required: [playerId, goal]
      properties:
        playerId: { type: integer }
        goal:     { type: string }
        calories: { type: integer }

    # ── Health Sync ──────────────────────────────────────────────────────────
    HealthConnection:
      type: object
      required: [id, platform, isConnected, createdAt]
      properties:
        id:             { type: integer }
        platform:       { type: string }
        isConnected:    { type: boolean }
        lastSyncedAt:   { type: ["string", "null"] }
        consentGivenAt: { type: string }
        createdAt:      { type: string }

    SyncResult:
      type: object
      required: [activitiesImported, xpEarned, lastSyncedAt]
      properties:
        activitiesImported: { type: integer }
        xpEarned:           { type: integer }
        lastSyncedAt:       { type: string }

    SuccessResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ── Groups ────────────────────────────────────────────────────────────────
    WorkoutGroupSummary:
      type: object
      required: [id, name, type, inviteCode, creatorPlayerId, teamEnergy, totalTeamEnergy, maxMembers, isActive, memberCount, activeChallenges, hasActiveRaid, createdAt]
      properties:
        id:                { type: integer }
        name:              { type: string }
        type:              { type: string }
        inviteCode:        { type: string }
        creatorPlayerId:   { type: integer }
        teamEnergy:        { type: integer }
        totalTeamEnergy:   { type: integer }
        maxMembers:        { type: integer }
        isActive:          { type: boolean }
        memberCount:       { type: integer }
        activeChallenges:  { type: integer }
        hasActiveRaid:     { type: boolean }
        createdAt:         { type: string }

    GroupMemberDetail:
      type: object
      required: [id, groupId, playerId, friendshipLevel, coWorkoutCount, joinedAt, username]
      properties:
        id:                  { type: integer }
        groupId:             { type: integer }
        playerId:            { type: integer }
        username:            { type: string }
        displayName:         { type: ["string", "null"] }
        friendshipLevel:     { type: integer }
        coWorkoutCount:      { type: integer }
        lastWorkoutTogether: { type: ["string", "null"] }
        joinedAt:            { type: string }

    GroupChallenge:
      type: object
      required: [id, groupId, title, description, targetValue, currentValue, rewardType, rewardAmount, isCompleted, progressPct, expiresAt, createdAt]
      properties:
        id:           { type: integer }
        groupId:      { type: integer }
        title:        { type: string }
        description:  { type: string }
        targetValue:  { type: integer }
        currentValue: { type: integer }
        rewardType:   { type: string }
        rewardAmount: { type: integer }
        isCompleted:  { type: boolean }
        progressPct:  { type: integer }
