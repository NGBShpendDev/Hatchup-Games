openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HatchUp Fitness Pals Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player profile and stats
  - name: hatchlings
    description: Creature/hatchling management
  - name: evolutions
    description: Evolution catalog and system
  - name: competitions
    description: Mini-games and competitive play
  - name: leaderboards
    description: Rankings and leaderboards
  - name: items
    description: Items and inventory
  - name: events
    description: Live events
  - name: clubs
    description: Clubs and guilds
  - name: eggs
    description: Egg incubation and hatching
  - name: fitness
    description: Fitness tracking, quests, and realms
  - name: training
    description: AI workout plans, meal plans, and coaching
  - name: health-sync
    description: Health platform connections and passive fitness sync
  - name: groups
    description: Workout groups, team energy, challenges, raids, and chat
  - name: coach
    description: AI Fitness Coach chat

paths:
  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Send a message to the AI Fitness Coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatBody"
      responses:
        "200":
          description: SSE stream of coach reply chunks
          content:
            text/event-stream:
              schema:
                type: string

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Players ──────────────────────────────────────────────────────────────
  /players:
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/dashboard:
    get:
      operationId: getPlayerDashboard
      tags: [players]
      summary: Get player dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDashboard"

  # ── Hatchlings ────────────────────────────────────────────────────────────
  /hatchlings:
    get:
      operationId: listHatchlings
      tags: [hatchlings]
      summary: List hatchlings (optionally by owner)
      parameters:
        - name: playerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"
    post:
      operationId: createHatchling
      tags: [hatchlings]
      summary: Hatch a new creature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/{id}:
    get:
      operationId: getHatchling
      tags: [hatchlings]
      summary: Get hatchling by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hatchling found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
        "404":
          description: Not found
    patch:
      operationId: updateHatchling
      tags: [hatchlings]
      summary: Update hatchling (name, mood, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
    delete:
      operationId: deleteHatchling
      tags: [hatchlings]
      summary: Release a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /hatchlings/{id}/evolve:
    post:
      operationId: evolveHatchling
      tags: [hatchlings]
      summary: Trigger evolution for a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveInput"
      responses:
        "200":
          description: Evolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/showcase:
    get:
      operationId: getHatchlingShowcase
      tags: [hatchlings]
      summary: Get top/featured hatchlings for showcase
      responses:
        "200":
          description: Showcase hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"

  # ── Evolutions ────────────────────────────────────────────────────────────
  /evolutions:
    get:
      operationId: listEvolutions
      tags: [evolutions]
      summary: List all evolution types in the catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
        - name: realm
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Evolution catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionType"

  /evolutions/{id}:
    get:
      operationId: getEvolution
      tags: [evolutions]
      summary: Get evolution type by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evolution type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionType"

  /evolutions/categories:
    get:
      operationId: getEvolutionCategories
      tags: [evolutions]
      summary: Get evolution categories with counts
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionCategory"

  /evolutions/realms:
    get:
      operationId: getEvolutionRealms
      tags: [evolutions]
      summary: Get realm metadata with evolution counts
      responses:
        "200":
          description: Realm metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RealmInfo"

  # ── Competitions ──────────────────────────────────────────────────────────
  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List competitions (past and upcoming)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed]
        - name: mode
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Join or create a competition match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Competition created/joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get competition details and results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}/result:
    post:
      operationId: submitCompetitionResult
      tags: [competitions]
      summary: Submit result for a competition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionResultInput"
      responses:
        "200":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/game-modes:
    get:
      operationId: listGameModes
      tags: [competitions]
      summary: List all available game modes
      responses:
        "200":
          description: Game modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameMode"

  # ── Leaderboards ──────────────────────────────────────────────────────────
  /leaderboards/global:
    get:
      operationId: getGlobalLeaderboard
      tags: [leaderboards]
      summary: Get global player leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Global leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/by-mode:
    get:
      operationId: getModeLeaderboard
      tags: [leaderboards]
      summary: Get leaderboard for a specific game mode
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Mode leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/speed:
    get:
      operationId: getSpeedLeaderboard
      tags: [leaderboards]
      summary: Get speed/fitness leaderboard (mode=steps for top daily steps, mode=pace for fastest runners)
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [steps, pace]
            default: steps
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Speed leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeedLeaderboardEntry"

  /leaderboards/rank-distribution:
    get:
      operationId: getRankDistribution
      tags: [leaderboards]
      summary: Get distribution of players across ranks
      responses:
        "200":
          description: Rank distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankDistribution"

  # ── Artifacts ─────────────────────────────────────────────────────────────
  /artifacts:
    get:
      operationId: listArtifacts
      tags: [players]
      summary: Get artifact museum — all artifacts with per-player discovery state
      responses:
        "200":
          description: Artifact museum list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactMuseumEntry"

  /players/me/artifacts:
    get:
      operationId: getMyArtifacts
      tags: [players]
      summary: Get owned artifacts for the authenticated player
      responses:
        "200":
          description: Owned artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedArtifact"

  /players/me/fitness-bars:
    get:
      operationId: getMyFitnessBars
      tags: [players]
      summary: Get all 8 fitness bar levels for the authenticated player
      responses:
        "200":
          description: Fitness bars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessBar"

  /artifacts/world-notifications:
    get:
      operationId: getArtifactWorldNotifications
      tags: [players]
      summary: Get recent world notifications for Mythic+ artifact drops
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: World notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactWorldNotification"

  # ── Items ─────────────────────────────────────────────────────────────────
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List available items in the shop/catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /items/{id}/use:
    post:
      operationId: useItem
      tags: [items]
      summary: Use an item on a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseItemInput"
      responses:
        "200":
          description: Item used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  # ── Live Events ───────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List current and upcoming live events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, upcoming, past]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveEvent"

  /events/{id}:
    get:
      operationId: getLiveEvent
      tags: [events]
      summary: Get live event details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEvent"

  # ── Clubs ─────────────────────────────────────────────────────────────────
  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: List clubs/guilds
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"
    post:
      operationId: createClub
      tags: [clubs]
      summary: Create a new club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [clubs]
      summary: Get club details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}/join:
    post:
      operationId: joinClub
      tags: [clubs]
      summary: Join a club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinClubInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  # ── Eggs ─────────────────────────────────────────────────────────────────
  /eggs:
    get:
      operationId: listEggs
      tags: [eggs]
      summary: List player's eggs
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
        - name: hatched
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Eggs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Egg"

  /eggs/{id}:
    get:
      operationId: getEgg
      tags: [eggs]
      summary: Get egg by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Egg found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Egg"

  /eggs/{id}/hatch:
    post:
      operationId: hatchEgg
      tags: [eggs]
      summary: Hatch a ready egg into a creature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchEggInput"
      responses:
        "200":
          description: Hatched creature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HatchResult"

  /eggs/incubate:
    post:
      operationId: addEgg
      tags: [eggs]
      summary: Add a new egg to incubation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEggInput"
      responses:
        "201":
          description: Egg added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Egg"

  # ── Fitness ──────────────────────────────────────────────────────────────
  /fitness/stats/{playerId}:
    get:
      operationId: getFitnessStats
      tags: [fitness]
      summary: Get player's fitness stats and today's summary
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fitness stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessStats"

  /fitness/log:
    post:
      operationId: logActivity
      tags: [fitness]
      summary: Log a fitness activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogActivityInput"
      responses:
        "201":
          description: Activity logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogResult"

  /fitness/activities:
    get:
      operationId: listFitnessActivities
      tags: [fitness]
      summary: List recent fitness activities for a player
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessActivity"

  /fitness/quests/{playerId}:
    get:
      operationId: getActiveQuests
      tags: [fitness]
      summary: Get active daily quests for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily quests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessQuest"

  /fitness/quests/{id}/complete:
    post:
      operationId: completeQuest
      tags: [fitness]
      summary: Mark a quest as completed and claim reward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitnessQuest"

  /fitness/realms:
    get:
      operationId: listRealms
      tags: [fitness]
      summary: Get all fitness realms with progression info
      parameters:
        - name: playerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Realms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessRealm"

  # ── Training ─────────────────────────────────────────────────────────────
  /training/workout-plan:
    get:
      operationId: getWorkoutPlan
      tags: [training]
      summary: Get active workout plan for a player
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlan"
        "404":
          description: No plan found

  /training/generate-plan:
    post:
      operationId: generateWorkoutPlan
      tags: [training]
      summary: Generate a new AI workout plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePlanInput"
      responses:
        "201":
          description: Generated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutPlan"

  /training/log-session:
    post:
      operationId: logWorkoutSession
      tags: [training]
      summary: Log a completed workout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSessionInput"
      responses:
        "201":
          description: Logged session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSession"

  /training/sessions:
    get:
      operationId: listWorkoutSessions
      tags: [training]
      summary: List recent workout sessions for a player
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSession"

  /training/meal-plan:
    get:
      operationId: getMealPlan
      tags: [training]
      summary: Get active meal plan for a player
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "404":
          description: No plan found

  /training/generate-meal-plan:
    post:
      operationId: generateMealPlan
      tags: [training]
      summary: Generate a personalized AI meal plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateMealPlanInput"
      responses:
        "201":
          description: Generated meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"

  # ── Groups ───────────────────────────────────────────────────────────────
  /groups/join-by-code:
    post:
      operationId: joinGroupByCode
      tags: [groups]
      summary: Join a group using only an invite code (no group ID needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupByCodeInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutGroupSummary"
        "404":
          description: Group not found
        "403":
          description: Invalid invite code
        "409":
          description: Already a member

  /groups/mine:
    get:
      operationId: listMyGroups
      tags: [groups]
      summary: List workout groups for a player
      parameters:
        - name: playerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player's groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutGroupSummary"

  /groups:
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new workout group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutGroupSummary"

  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group detail with members, challenges, and raid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutGroupDetail"
        "403":
          description: Not a group member
        "404":
          description: Not found

  /groups/{id}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group by invite code or direct join
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /groups/{id}/leave:
    post:
      operationId: leaveGroup
      tags: [groups]
      summary: Leave a group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveGroupInput"
      responses:
        "200":
          description: Left group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /groups/{id}/workout:
    post:
      operationId: logGroupWorkout
      tags: [groups]
      summary: Log a group workout, earn team energy and XP bonus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogGroupWorkoutInput"
      responses:
        "200":
          description: Workout logged with bonuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWorkoutResult"

  /groups/{id}/challenge-progress:
    post:
      operationId: contributeGroupChallenge
      tags: [groups]
      summary: Contribute progress toward active group challenges
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupChallengeProgressInput"
      responses:
        "200":
          description: Challenge progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupChallengeProgressResult"

  /groups/{id}/raid/attack:
    post:
      operationId: attackGroupRaid
      tags: [groups]
      summary: Deal damage to the active raid boss
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRaidAttackInput"
      responses:
        "200":
          description: Raid damage dealt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupRaid"
        "404":
          description: No active raid

  /groups/{id}/messages:
    get:
      operationId: listGroupMessages
      tags: [groups]
      summary: Get recent group chat messages (membership required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMessage"
    post:
      operationId: sendGroupMessage
      tags: [groups]
      summary: Send a message in group chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendGroupMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMessage"

  # ── Health Sync ───────────────────────────────────────────────────────────
  /health/connections:
    get:
      operationId: listHealthConnections
      tags: [health-sync]
      summary: List the player's health platform connections
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthConnection"

  /health/connections/{platform}:
    delete:
      operationId: disconnectHealthPlatform
      tags: [health-sync]
      summary: Disconnect a health platform
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /health/sync:
    post:
      operationId: triggerHealthSync
      tags: [health-sync]
      summary: Manually trigger a Google Fit sync for the current player
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /health/acknowledge-passive-xp:
    post:
      operationId: acknowledgePassiveXp
      tags: [health-sync]
      summary: Acknowledge and reset the passive XP counter
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Player ──────────────────────────────────────────────────────────────
    Player:
      type: object
      required: [id, username, level, xp, coins, rank, totalWins, totalMatches, totalSteps, fitnessXp, currentStreak, fitnessRealm, createdAt]
      properties:
        id:             { type: integer }
        username:       { type: string }
        displayName:    { type: ["string", "null"] }
        avatarUrl:      { type: ["string", "null"] }
        level:          { type: integer }
        xp:             { type: integer }
        coins:          { type: integer }
        rank:           { type: string }
        rankScore:      { type: integer }
        totalWins:      { type: integer }
        totalMatches:   { type: integer }
        clubId:         { type: ["integer", "null"] }
        totalSteps:     { type: integer }
        totalWorkouts:  { type: integer }
        fitnessXp:      { type: integer }
        currentStreak:  { type: integer }
        longestStreak:  { type: integer }
        fitnessRealm:   { type: string }
        waterCups:      { type: integer }
        dailyStepGoal:  { type: integer }
        lastActiveDate: { type: ["string", "null"] }
        createdAt:      { type: string }

    PlayerInput:
      type: object
      required: [username]
      properties:
        username:    { type: string, minLength: 2, maxLength: 20 }
        displayName: { type: string }
        avatarUrl:   { type: string }

    PlayerUpdate:
      type: object
      properties:
        displayName:   { type: string }
        avatarUrl:     { type: string }
        fitnessRealm:  { type: string }
        dailyStepGoal: { type: integer }
        waterCups:     { type: integer }

    PlayerDashboard:
      type: object
      required: [player, hatchlingCount, totalWins, recentCompetitions, activeEvents, topHatchling, activeEggs, fitnessStats]
      properties:
        player:               { $ref: "#/components/schemas/Player" }
        hatchlingCount:       { type: integer }
        totalWins:            { type: integer }
        winRate:              { type: number }
        recentCompetitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"
        activeEvents:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
        topHatchling:         { $ref: "#/components/schemas/Hatchling" }
        activeEggs:
          type: array
          items:
            $ref: "#/components/schemas/Egg"
        fitnessStats:         { $ref: "#/components/schemas/FitnessStats" }

    # ── Hatchling ────────────────────────────────────────────────────────────
    Hatchling:
      type: object
      required: [id, playerId, name, species, evolutionStage, personality, mood, level, xp, happiness, hunger, energy, fitnessType, realm, friendshipLevel, moodState, createdAt]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        name:           { type: string }
        species:        { type: string }
        evolutionStage: { type: integer }
        evolutionType:  { type: ["string", "null"] }
        category:       { type: string }
        rarity:         { type: string }
        personality:    { type: string }
        mood:           { type: string }
        level:          { type: integer }
        xp:             { type: integer }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        abilityName:    { type: ["string", "null"] }
        abilityDesc:    { type: ["string", "null"] }
        imageUrl:       { type: ["string", "null"] }
        isShiny:        { type: boolean }
        isFusion:       { type: boolean }
        color:          { type: ["string", "null"] }
        fitnessType:    { type: string }
        eggId:          { type: ["integer", "null"] }
        realm:          { type: string }
        genetics:       { type: ["object", "null"] }
        friendshipLevel: { type: integer }
        moodState:      { type: string }
        lastWorkoutAt:  { type: ["string", "null"] }
        createdAt:      { type: string }

    HatchlingInput:
      type: object
      required: [playerId, name]
      properties:
        playerId:    { type: integer }
        name:        { type: string, minLength: 1, maxLength: 30 }
        species:     { type: string }
        fitnessType: { type: string }

    HatchlingUpdate:
      type: object
      properties:
        name:           { type: string }
        mood:           { type: string }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        moodState:      { type: string }
        friendshipLevel: { type: integer }
        lastWorkoutAt:  { type: string }

    EvolveInput:
      type: object
      required: [triggerId]
      properties:
        triggerId: { type: integer }

    # ── Evolution ────────────────────────────────────────────────────────────
    EvolutionType:
      type: object
      required: [id, name, category, rarity, description, unlockedCount, realm, stage, evolutionPath, isPrestige]
      properties:
        id:            { type: integer }
        name:          { type: string }
        category:      { type: string }
        rarity:        { type: string }
        description:   { type: string }
        unlockHint:    { type: ["string", "null"] }
        imageUrl:      { type: ["string", "null"] }
        abilityName:   { type: ["string", "null"] }
        abilityDesc:   { type: ["string", "null"] }
        unlockedCount: { type: integer }
        color:         { type: ["string", "null"] }
        fitnessType:   { type: ["string", "null"] }
        realm:         { type: string }
        stage:         { type: integer }
        evolutionPath: { type: string }
        isPrestige:    { type: boolean }

    EvolutionCategory:
      type: object
      required: [category, count, rarest]
      properties:
        category: { type: string }
        count:    { type: integer }
        rarest:   { type: string }
        color:    { type: ["string", "null"] }

    RealmInfo:
      type: object
      required: [id, name, description, color, auraColor, evolutionCount, fitnessTypes]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string }
        color:         { type: string }
        auraColor:     { type: string }
        evolutionCount: { type: integer }
        fitnessTypes:
          type: array
          items:
            type: string

    # ── Competition ──────────────────────────────────────────────────────────
    Competition:
      type: object
      required: [id, mode, status, playerId, hatchlingId, score, rank, createdAt]
      properties:
        id:          { type: integer }
        mode:        { type: string }
        status:      { type: string }
        playerId:    { type: integer }
        playerName:  { type: ["string", "null"] }
        hatchlingId: { type: integer }
        hatchlingName: { type: ["string", "null"] }
        score:       { type: integer }
        rank:        { type: ["integer", "null"] }
        duration:    { type: ["integer", "null"] }
        xpEarned:    { type: ["integer", "null"] }
        coinsEarned: { type: ["integer", "null"] }
        createdAt:   { type: string }

    CompetitionInput:
      type: object
      required: [mode, playerId, hatchlingId]
      properties:
        mode:        { type: string }
        playerId:    { type: integer }
        hatchlingId: { type: integer }

    CompetitionResultInput:
      type: object
      required: [score, duration]
      properties:
        score:    { type: integer }
        duration: { type: integer }
        playerId: { type: integer }

    GameMode:
      type: object
      required: [id, name, description, minLevel]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        minLevel:    { type: integer }
        maxPlayers:  { type: ["integer", "null"] }
        xpMultiplier: { type: number }
        isLive:      { type: boolean }

    # ── Leaderboard ──────────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, score]
      properties:
        position:         { type: integer }
        playerId:         { type: integer }
        username:         { type: string }
        displayName:      { type: string, nullable: true }
        avatarUrl:        { type: string, nullable: true }
        rank:             { type: string }
        score:            { type: integer }
        wins:             { type: integer }
        hatchlingName:    { type: string, nullable: true }
        hatchlingCategory: { type: string, nullable: true }

    RankDistribution:
      type: object
      required: [rank, count, percentage]
      properties:
        rank:       { type: string }
        count:      { type: integer }
        percentage: { type: number }

    # ── Item ─────────────────────────────────────────────────────────────────
    Item:
      type: object
      required: [id, name, description, type, cost, effect]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        cost:        { type: integer }
        effect:      { type: string }
        imageUrl:    { type: ["string", "null"] }
        rarity:      { type: string }

    UseItemInput:
      type: object
      required: [hatchlingId]
      properties:
        hatchlingId: { type: integer }

    # ── Live Event ────────────────────────────────────────────────────────────
    LiveEvent:
      type: object
      required: [id, name, description, type, status, startTime, endTime]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        status:      { type: string }
        startTime:   { type: string }
        endTime:     { type: string }
        rewardXp:    { type: ["integer", "null"] }
        rewardCoins: { type: ["integer", "null"] }
        imageUrl:    { type: ["string", "null"] }
        participantCount: { type: integer }

    # ── Club ─────────────────────────────────────────────────────────────────
    Club:
      type: object
      required: [id, name, description, memberCount, totalXp, rank, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        badge:       { type: ["string", "null"] }
        memberCount: { type: integer }
        maxMembers:  { type: integer }
        totalXp:     { type: integer }
        rank:        { type: string }
        isPublic:    { type: boolean }
        createdAt:   { type: string }

    ClubInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 2, maxLength: 30 }
        description: { type: string }
        isPublic:    { type: boolean }

    JoinClubInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    # ── Eggs ─────────────────────────────────────────────────────────────────
    Egg:
      type: object
      required: [id, playerId, rarity, eggType, stepsRequired, stepsProgress, isHatched, name, realm, createdAt]
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        rarity:        { type: string }
        eggType:       { type: string }
        realm:         { type: string }
        stepsRequired: { type: integer }
        stepsProgress: { type: integer }
        isHatched:     { type: boolean }
        hatchlingId:   { type: ["integer", "null"] }
        imageUrl:      { type: ["string", "null"] }
        name:          { type: string }
        description:   { type: ["string", "null"] }
        progressPct:   { type: number }
        isReady:       { type: boolean }
        createdAt:     { type: string }
        hatchedAt:     { type: ["string", "null"] }

    AddEggInput:
      type: object
      required: [playerId, eggType]
      properties:
        playerId: { type: integer }
        eggType:  { type: string }
        rarity:   { type: string }

    HatchEggInput:
      type: object
      required: [playerId, name]
      properties:
        playerId: { type: integer }
        name:     { type: string, minLength: 1, maxLength: 30 }

    HatchResult:
      type: object
      required: [egg, hatchling]
      properties:
        egg:       { $ref: "#/components/schemas/Egg" }
        hatchling: { $ref: "#/components/schemas/Hatchling" }

    # ── Fitness ──────────────────────────────────────────────────────────────
    FitnessStats:
      type: object
      required: [playerId, totalSteps, totalWorkouts, fitnessXp, currentStreak, longestStreak, fitnessRealm, waterCups, todaySteps, todayXp, dailyStepGoal]
      properties:
        playerId:       { type: integer }
        totalSteps:     { type: integer }
        totalWorkouts:  { type: integer }
        fitnessXp:      { type: integer }
        currentStreak:  { type: integer }
        longestStreak:  { type: integer }
        fitnessRealm:   { type: string }
        waterCups:      { type: integer }
        todaySteps:     { type: integer }
        todayXp:        { type: integer }
        dailyStepGoal:  { type: integer }
        stepGoalPct:    { type: number }
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/FitnessActivity"

    FitnessActivity:
      type: object
      required: [id, playerId, type, value, unit, fitnessXpEarned, realm, createdAt]
      properties:
        id:              { type: integer }
        playerId:        { type: integer }
        type:            { type: string }
        value:           { type: integer }
        unit:            { type: string }
        fitnessXpEarned: { type: integer }
        realm:           { type: string }
        note:            { type: ["string", "null"] }
        createdAt:       { type: string }

    LogActivityInput:
      type: object
      required: [playerId, type, value]
      properties:
        playerId:      { type: integer }
        type:          { type: string }
        value:         { type: integer }
        note:          { type: string }
        groupId:       { type: integer }
        distanceMiles: { type: number, description: "Optional distance in miles (for running/cycling pace tracking)" }

    ActivityLogResult:
      type: object
      required: [activity, fitnessXpEarned, eggsUpdated, player]
      properties:
        activity:         { $ref: "#/components/schemas/FitnessActivity" }
        fitnessXpEarned:  { type: integer }
        eggsUpdated:      { type: integer }
        player:           { $ref: "#/components/schemas/Player" }
        groupBonusXp:     { type: integer }
        groupXpBonusPct:  { type: integer }
        prResult:
          nullable: true
          type: object
          properties:
            activityType: { type: string }
            metric:       { type: string }
            value:        { type: integer }
            isNew:        { type: boolean }

    FitnessQuest:
      type: object
      required: [id, playerId, title, description, type, targetValue, currentValue, xpReward, coinReward, isCompleted, realm, expiresAt, createdAt]
      properties:
        id:           { type: integer }
        playerId:     { type: integer }
        title:        { type: string }
        description:  { type: string }
        type:         { type: string }
        targetValue:  { type: integer }
        currentValue: { type: integer }
        xpReward:     { type: integer }
        coinReward:   { type: integer }
        isCompleted:  { type: boolean }
        realm:        { type: string }
        expiresAt:    { type: string }
        createdAt:    { type: string }
        progressPct:  { type: number }

    FitnessRealm:
      type: object
      required: [id, name, description, color, icon, fitnessTypes, evolutionBonus]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string }
        color:         { type: string }
        icon:          { type: string }
        fitnessTypes:
          type: array
          items:
            type: string
        evolutionBonus: { type: string }
        playerXp:      { type: ["integer", "null"] }
        isUnlocked:    { type: boolean }

    # ── Training ──────────────────────────────────────────────────────────────
    WorkoutDay:
      type: object
      required: [day, name, exercises, realm, durationMinutes, xpReward]
      properties:
        day:             { type: string }
        name:            { type: string }
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        realm:           { type: string }
        durationMinutes: { type: integer }
        xpReward:        { type: integer }
        coinsReward:     { type: integer }

    Exercise:
      type: object
      required: [name, sets, reps, rest]
      properties:
        name:   { type: string }
        sets:   { type: integer }
        reps:   { type: string }
        rest:   { type: string }
        tip:    { type: string }
        muscle: { type: string }

    WorkoutPlan:
      type: object
      required: [id, playerId, goal, fitnessLevel, equipment, weekNumber, isActive, createdAt, days]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        goal:           { type: string }
        fitnessLevel:   { type: string }
        equipment:      { type: string }
        weekNumber:     { type: integer }
        isActive:       { type: boolean }
        createdAt:      { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutDay"

    WorkoutSession:
      type: object
      required: [id, playerId, workoutType, durationMinutes, exercisesCompleted, xpEarned, coinsEarned, realm, createdAt]
      properties:
        id:                  { type: integer }
        playerId:            { type: integer }
        workoutType:         { type: string }
        durationMinutes:     { type: integer }
        exercisesCompleted:  { type: integer }
        xpEarned:            { type: integer }
        coinsEarned:         { type: integer }
        realm:               { type: string }
        notes:               { type: ["string", "null"] }
        createdAt:           { type: string }

    MealItem:
      type: object
      required: [name, calories, protein, carbs, fat]
      properties:
        name:     { type: string }
        calories: { type: integer }
        protein:  { type: integer }
        carbs:    { type: integer }
        fat:      { type: integer }
        tip:      { type: string }

    MealDay:
      type: object
      required: [day, breakfast, lunch, dinner, snacks, totalCalories, totalProtein]
      properties:
        day:           { type: string }
        breakfast:     { $ref: "#/components/schemas/MealItem" }
        lunch:         { $ref: "#/components/schemas/MealItem" }
        dinner:        { $ref: "#/components/schemas/MealItem" }
        snacks:
          type: array
          items:
            $ref: "#/components/schemas/MealItem"
        totalCalories: { type: integer }
        totalProtein:  { type: integer }
        hydrationGoal: { type: integer }

    MealPlan:
      type: object
      required: [id, playerId, goal, calorieTarget, proteinTarget, carbTarget, fatTarget, isActive, createdAt, days]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        goal:           { type: string }
        calorieTarget:  { type: integer }
        proteinTarget:  { type: integer }
        carbTarget:     { type: integer }
        fatTarget:      { type: integer }
        isActive:       { type: boolean }
        createdAt:      { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/MealDay"

    GeneratePlanInput:
      type: object
      required: [playerId, goal]
      properties:
        playerId:     { type: integer }
        goal:         { type: string }
        fitnessLevel: { type: string }
        equipment:    { type: string }

    LogSessionInput:
      type: object
      required: [playerId, workoutType, durationMinutes]
      properties:
        playerId:           { type: integer }
        workoutType:        { type: string }
        durationMinutes:    { type: integer }
        exercisesCompleted: { type: integer }
        notes:              { type: string }

    GenerateMealPlanInput:
      type: object
      required: [playerId, goal]
      properties:
        playerId: { type: integer }
        goal:     { type: string }
        calories: { type: integer }

    # ── Health Sync ──────────────────────────────────────────────────────────
    HealthConnection:
      type: object
      required: [id, platform, isConnected, createdAt]
      properties:
        id:             { type: integer }
        platform:       { type: string }
        isConnected:    { type: boolean }
        lastSyncedAt:   { type: ["string", "null"] }
        consentGivenAt: { type: string }
        createdAt:      { type: string }

    SyncResult:
      type: object
      required: [activitiesImported, xpEarned, lastSyncedAt]
      properties:
        activitiesImported: { type: integer }
        xpEarned:           { type: integer }
        lastSyncedAt:       { type: string }

    SuccessResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ── Groups ────────────────────────────────────────────────────────────────
    WorkoutGroupSummary:
      type: object
      required: [id, name, type, inviteCode, creatorPlayerId, teamEnergy, totalTeamEnergy, maxMembers, isActive, memberCount, activeChallenges, hasActiveRaid, createdAt]
      properties:
        id:                { type: integer }
        name:              { type: string }
        type:              { type: string }
        inviteCode:        { type: string }
        creatorPlayerId:   { type: integer }
        teamEnergy:        { type: integer }
        totalTeamEnergy:   { type: integer }
        maxMembers:        { type: integer }
        isActive:          { type: boolean }
        memberCount:       { type: integer }
        activeChallenges:  { type: integer }
        hasActiveRaid:     { type: boolean }
        createdAt:         { type: string }

    GroupMemberDetail:
      type: object
      required: [id, groupId, playerId, friendshipLevel, coWorkoutCount, joinedAt, username]
      properties:
        id:                  { type: integer }
        groupId:             { type: integer }
        playerId:            { type: integer }
        username:            { type: string }
        displayName:         { type: ["string", "null"] }
        friendshipLevel:     { type: integer }
        coWorkoutCount:      { type: integer }
        lastWorkoutTogether: { type: ["string", "null"] }
        joinedAt:            { type: string }

    GroupChallenge:
      type: object
      required: [id, groupId, title, description, targetValue, currentValue, rewardType, rewardAmount, isCompleted, progressPct, expiresAt, createdAt]
      properties:
        id:           { type: integer }
        groupId:      { type: integer }
        title:        { type: string }
        description:  { type: string }
        targetValue:  { type: integer }
        currentValue: { type: integer }
        rewardType:   { type: string }
        rewardAmount: { type: integer }
        isCompleted:  { type: boolean }
        progressPct:  { type: integer }
        expiresAt:    { type: string }
        createdAt:    { type: string }

    GroupRaid:
      type: object
      required: [id, groupId, bossName, bossHp, currentDamage, status, hpPct, unlockedAt, createdAt]
      properties:
        id:            { type: integer }
        groupId:       { type: integer }
        bossName:      { type: string }
        bossHp:        { type: integer }
        currentDamage: { type: integer }
        status:        { type: string }
        hpPct:         { type: integer }
        unlockedAt:    { type: string }
        createdAt:     { type: string }

    WorkoutGroupDetail:
      type: object
      required: [id, name, type, inviteCode, creatorPlayerId, teamEnergy, totalTeamEnergy, maxMembers, isActive, memberCount, members, challenges, createdAt]
      properties:
        id:              { type: integer }
        name:            { type: string }
        type:            { type: string }
        inviteCode:      { type: string }
        creatorPlayerId: { type: integer }
        teamEnergy:      { type: integer }
        totalTeamEnergy: { type: integer }
        maxMembers:      { type: integer }
        isActive:        { type: boolean }
        memberCount:     { type: integer }
        createdAt:       { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberDetail"
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/GroupChallenge"
        raid:
          oneOf:
            - $ref: "#/components/schemas/GroupRaid"
            - type: "null"

    GroupMessage:
      type: object
      required: [id, groupId, playerId, playerName, content, isFiltered, createdAt]
      properties:
        id:         { type: integer }
        groupId:    { type: integer }
        playerId:   { type: integer }
        playerName: { type: string }
        content:    { type: string }
        isFiltered: { type: boolean }
        createdAt:  { type: string }

    CreateGroupInput:
      type: object
      required: [name, creatorPlayerId]
      properties:
        name:            { type: string, minLength: 2, maxLength: 40 }
        type:            { type: string }
        creatorPlayerId: { type: integer }
        maxMembers:      { type: integer }

    LeaveGroupInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    JoinGroupInput:
      type: object
      required: [playerId]
      properties:
        playerId:   { type: integer }
        inviteCode: { type: string }

    LogGroupWorkoutInput:
      type: object
      required: [playerId, baseXp]
      properties:
        playerId: { type: integer }
        baseXp:   { type: integer }
        steps:    { type: integer }
        workoutType: { type: string }

    GroupWorkoutResult:
      type: object
      required: [energyGained, teamEnergy, bonusXp, xpBonusPct, memberCount, challengesAdvanced, raidDamage, raidUnlocked, fitnessXpEarned]
      properties:
