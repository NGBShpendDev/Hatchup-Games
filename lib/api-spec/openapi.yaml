        xpInCurrentLevel: { type: integer }
        progressPct:      { type: integer }

    ArtifactWorldNotification:
      type: object
      required: [id, playerUsername, artifactName, rarity, createdAt]
      properties:
        id:             { type: integer }
        playerUsername: { type: string }
        artifactName:   { type: string }
        rarity:         { type: string }
        createdAt:      { type: string }

    SpeedLeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, metricValue, metricLabel, currentStreak]
      properties:
        position:      { type: integer }
        playerId:      { type: integer }
        username:      { type: string }
        displayName:   { type: string, nullable: true }
        avatarUrl:     { type: string, nullable: true }
        rank:          { type: string }
        metricValue:   { type: integer }
        metricLabel:   { type: string }
        currentStreak: { type: integer }
        achievedAt:    { type: string }

    CoachChatMessage:
      type: object
      required: [role, content]
      properties:
        role:    { type: string, enum: [user, assistant] }
