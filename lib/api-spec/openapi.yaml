  # ── Live Events ───────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List current and upcoming live events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, upcoming, past]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveEvent"

  /events/{id}:
    get:
      operationId: getLiveEvent
      tags: [events]
      summary: Get live event details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEvent"

  /events/{id}/join:
    post:
      operationId: joinLiveEvent
      tags: [events]
      summary: Join a live event and claim entry rewards
      description: |
        Records the authenticated player's participation in the given live
        event. The server is the source of truth for any XP/reward granted —
        the client must refetch hatchling state afterward. The centralized
        evolution share prompt fires automatically if a Pal's post-join
        level crosses an evolution threshold.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Join acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [eventId, joinedAt]
                properties:
                  eventId:
                    type: integer
                  joinedAt:
                    type: string
                    format: date-time
                  xpEarned:
                    type: integer
                  coinsEarned:
                    type: integer
                  palXpResult:
                    nullable: true
                    type: object
                    description: "XP awarded to the active Pal from joining this event, if applicable."
                    required: [hatchlingId, xpDelta, prevLevel, newLevel, newXp]
                    properties:
                      hatchlingId: { type: integer }
                      xpDelta:     { type: integer }
                      prevLevel:   { type: integer }
                      newLevel:    { type: integer }
                      newXp:       { type: integer }
                      evolutionSharePrompt: { type: boolean, description: "True when the Pal crossed an evolution milestone (level 5 or 15)." }
        "404":
          description: Event not found
        "409":
          description: Event not currently active

  /players/me/events:
    get:
      operationId: getMyEventHistory
      tags: [events]
      summary: Get the authenticated player's event participation history
      description: |
        Returns every event the authenticated player has ever joined, ordered by
        join date descending (most recent first). Includes the event name, reward
        XP, and the timestamp when the player joined.
      responses:
        "200":
          description: Event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerEventHistoryItem"

