        lifetimePushups: { type: integer }
        lifetimeSquats:  { type: integer }
        lifetimeBurpees: { type: integer }
        lifetimePullups: { type: integer }
        lifetimePlanks:  { type: integer }
        lifetimeSitups:  { type: integer }

    PlayerRecordsResult:
      type: object
      required: [personalRecords, strengthTotals, monthlyRunMiles]
      properties:
        personalRecords:
          type: array
          items:
            $ref: "#/components/schemas/PersonalRecord"
        strengthTotals:
          $ref: "#/components/schemas/StrengthTotals"
