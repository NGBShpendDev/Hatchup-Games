      summary: List pending invites for a club (admins/leaders only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pending invites for this club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingClubInvite"

  /club-invites/{id}:
    delete:
      operationId: cancelClubInvite
      tags: [clubs]
      summary: Cancel a pending club invite (admins/leaders only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invite cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /club-invites/{id}/respond:
    post:
      operationId: respondToClubInvite
      tags: [clubs]
      summary: Accept or decline a club invite
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToInviteBody"
      responses:
        "200":
          description: Responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  /challenge-invites:
    get:
      operationId: getMyChallengeInvites
      tags: [challenges]
      summary: Get pending challenge invites for the current player
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeInvite"

  /challenge-invites/{id}/respond:
    post:
      operationId: respondToChallengeInvite
      tags: [challenges]
      summary: Accept or decline a challenge invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToInviteBody"
      responses:
        "200":
          description: Responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  # ── Accessibility & Adaptive Goals ───────────────────────────────────────────
  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [accessibility]
      summary: Save onboarding answers (fitness level, age range, accessibility mode, identity path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  player: { type: object }
                  identityPathMeta:
                    $ref: "#/components/schemas/IdentityPathMeta"

  /goals/today:
    get:
      operationId: getTodayGoals
      tags: [accessibility]
      summary: Get personalized adaptive daily goals and progress
      responses:
        "200":
          description: Today's goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayGoalProgress"

  /identity-paths:
    get:
      operationId: listIdentityPaths
      tags: [accessibility]
      summary: List all available fitness identity paths
      responses:
        "200":
          description: Identity paths map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/IdentityPathMeta"

  /streak/recover:
    post:
      operationId: acknowledgeStreakRecovery
      tags: [accessibility]
      summary: Acknowledge streak recovery message (no-shame reset acknowledgement)
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean }
                  streak:        { type: integer }
                  xp:            { type: integer }

  /family-groups:
    post:
      operationId: createFamilyGroup
      tags: [accessibility]
      summary: Create a new family group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyGroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyGroup"

  /family-groups/join:
    post:
      operationId: joinFamilyGroup
      tags: [accessibility]
      summary: Join an existing family group via invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyGroupInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined:    { type: boolean }
                  groupId:   { type: integer }
                  groupName: { type: string }

  /family-groups/{id}:
    get:
      operationId: getFamilyGroup
      tags: [accessibility]
      summary: Get family group details with weekly leaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Family group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyGroup"

  /family-groups/{id}/leave:
    post:
      operationId: leaveFamilyGroup
      tags: [accessibility]
      summary: Leave a family group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                type: object
                properties:
                  left: { type: boolean }

  # ── Location & GPS Leaderboard ─────────────────────────────────────────────
  /players/me/location:
    post:
      operationId: updateMyLocation
      tags: [players]
      summary: Update the current player's approximate location (derived from GPS or direct fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdateBody"
      responses:
        "200":
          description: Location stored (coordinates never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerLocationRecord"
    get:
      operationId: getMyLocation
      tags: [players]
      summary: Get the current player's stored location
      responses:
        "200":
          description: Location record or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlayerLocationRecord"
                  - type: "null"

  /leaderboards/scoped:
    get:
      operationId: getScopedLeaderboard
      tags: [leaderboards]
      summary: Get location-scoped leaderboard with configurable metric
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [world, country, state, county, city, nearby]
            default: world
        - name: metric
          in: query
          schema:
            type: string
            enum: [xp, steps, workouts, battle_wins, streaks, artifacts]
            default: xp
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Scoped leaderboard result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedLeaderboardResult"

  /local-challenges:
    get:
      operationId: listLocalChallenges
      tags: [leaderboards]
      summary: List active local GPS-based challenges visible to the current player
      responses:
        "200":
          description: Active local challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalChallenge"

  /local-challenges/{id}/join:
    post:
      operationId: joinLocalChallenge
      tags: [leaderboards]
      summary: Join a local challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined:       { type: boolean }
                  alreadyJoined: { type: boolean }

  /local-challenges/{id}/leaderboard:
    get:
      operationId: getLocalChallengeLeaderboard
      tags: [leaderboards]
      summary: Get leaderboard for a specific local challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Challenge leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalChallengeLeaderboardResult"

  # ── Nutrition ────────────────────────────────────────────────────────────
  /nutrition/summary:
    get:
      operationId: getNutritionSummary
      tags: [nutrition]
      summary: Weekly nutrition rollup for the authenticated player
      description: |
        Returns the player's last-7-days nutrition rollup: average daily macros,
        per-macro gaps and ratios vs the daily target derived from their
        physique goal, an overall adherence score, top logged foods, an AI
        (or static fallback) coaching tip, and a derived mood label for the
        active Hatchling that reflects how well targets were hit.
      responses:
        "200":
          description: Weekly nutrition summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionWeeklySummary"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/posts:
    get:
      operationId: listNutritionPosts
      tags: [nutrition]
      summary: List meal posts for the authenticated player
      description: |
        Returns a page of meal posts. In `feed` mode, results are restricted to
        the viewer and people they share a group with. When the viewer has no
        follow/group connections yet, the server automatically falls back to
        the global `discover` feed and reports that via `fellBackToDiscover`.
        Posts from blocked / blocking players are filtered out.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: mode
          in: query
          schema:
            type: string
            enum: [feed, discover]
            default: feed
      responses:
        "200":
          description: Meal post feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPostFeedPage"
    post:
      operationId: createMealPost
      tags: [nutrition]
      summary: Create a meal post
      description: |
        Logs a meal for the authenticated player. Optionally accepts macros and
        an AI-derived quality score; the server independently derives a quality
        score from the macros and uses the more conservative value to buff or
        debuff the player's active Hatchling. May also award badges and trigger
        the daily macro-target streak reward when all four macros land within
        ±10% of the player's daily target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealPostInput"
      responses:
        "201":
          description: Meal post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMealPostResult"
        "400":
          description: Invalid input or upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "403":
          description: Invalid or missing uploadToken for imageUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/posts/{id}:
    patch:
      operationId: updateMealPost
      tags: [nutrition]
      summary: Edit your own meal post
      description: |
        Owner-only edit. Any subset of name/emoji/tag/description/macros/imageUrl
        may be supplied. Changing the image requires a fresh uploadToken (same
        HMAC verification used when creating a meal post).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealPostInput"
      responses:
        "200":
          description: Updated meal post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPostRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "403":
          description: Not the owner, or invalid uploadToken for imageUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "404":
          description: Meal post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
    delete:
      operationId: deleteMealPost
      tags: [nutrition]
      summary: Delete your own meal post
      description: |
        Owner-only delete. Also removes any likes and comments attached to the
        post. The 404 envelope shape matches the rest of the storage error
        responses for consistency.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meal post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMealPostResult"
        "403":
          description: Not the owner of the meal post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "404":
          description: Meal post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/posts/{id}/like:
    post:
      operationId: toggleMealPostLike
      tags: [nutrition]
      summary: Toggle a like on a meal post
      description: |
        Idempotent toggle: liking an already-liked post unlikes it. The likes
        counter on the post is updated atomically and never drops below zero.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealLikeResult"

  /nutrition/posts/{id}/comments:
    get:
      operationId: listMealPostComments
      tags: [nutrition]
      summary: List comments on a meal post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments on the meal post
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealComment"
    post:
      operationId: addMealPostComment
      tags: [nutrition]
      summary: Add a comment to a meal post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMealCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealComment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/analyze:
    post:
      operationId: analyzeMealDescription
      tags: [nutrition]
      summary: Estimate macros + quality score from a meal description
      description: |
        Sends a free-form meal description to the AI sports-nutritionist model
        and returns estimated macros, a 1-10 quality score, and 1-3 short
        improvement suggestions. Returns a static fallback estimate if the
        model response cannot be parsed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionAnalyzeInput"
      responses:
        "200":
          description: Estimated macros + AI suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionAnalyzeResult"
        "400":
          description: Description missing or too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/analyze-image:
    post:
      operationId: analyzeMealImage
      tags: [nutrition]
      summary: Estimate macros + quality score from an uploaded food photo
      description: |
        Reads a previously uploaded meal photo (the same `/objects/...` path and
        `uploadToken` issued by the storage upload flow) and sends it to a
        vision model to estimate calories, macros, a 1-10 quality score, a
        short food description, and 1-3 improvement suggestions. Returns
        `recognized=false` with a static fallback estimate if the model cannot
        confidently identify the meal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionAnalyzeImageInput"
      responses:
        "200":
          description: Estimated macros + AI suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionAnalyzeImageResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "403":
          description: Upload token does not match the uploaded image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "404":
          description: Uploaded image not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/challenges:
    get:
      operationId: listNutritionChallenges
      tags: [nutrition]
      summary: List nutrition challenges with the player's current progress
      responses:
        "200":
          description: Challenges with player progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NutritionChallenge"

  /nutrition/challenges/{key}/progress:
    post:
      operationId: incrementNutritionChallengeProgress
      tags: [nutrition]
      summary: Increment progress on a nutrition challenge
      description: |
        Advances the player's progress for `key` by `increment`. When the
        challenge is completed for the first time, XP, coins, and the
        associated badge are awarded. Already-completed challenges return
        `alreadyCompleted=true` without applying further increments.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeProgressInput"
      responses:
        "200":
          description: Updated challenge progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgressResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "404":
          description: Challenge key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/macro-target:
    get:
      operationId: getNutritionMacroTarget
      tags: [nutrition]
      summary: Get the player's daily macro target
      description: |
        Returns the daily macro target for the authenticated player's physique
        goal. The server attempts an AI-personalized target first (using the
        player's level + fitness XP); if the AI call fails or returns invalid
        JSON, it falls back to the static per-goal table. `aiPersonalized`
        indicates which path produced the result.
      responses:
        "200":
          description: Daily macro target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionMacroTarget"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/suggest-next:
    get:
      operationId: getNutritionSuggestNext
      tags: [nutrition]
      summary: Suggest the next meal to fill today's macro gaps
      description: |
        Compares today's macro totals against the player's daily macro target
        and recommends a concrete meal idea sized to the most-behind macro.
        Returns `hasGap=false` with `suggestion=null` when every macro is on
        or over target. The serving is scaled (0.5x–2x) to fill the primary
        gap without significantly overshooting macros already at target.

        Pass `exclude` (comma-separated list of meal names) to skip ideas
        the player has already seen or dismissed this session. The server
        will pick a different template that still targets the same macro
        gap; if every template in the matching pool has been excluded the
        exclusion is ignored so the player still gets a suggestion.

        When `useAi=true` or a non-empty `pantry` string is supplied, the
        server tries the AI nutritionist first — personalizing the idea to
        the player's frequent meal tags (e.g. vegan, high-protein), physique
        goal, and any ingredients on hand. The static catalog is used as a
        deterministic fallback when the AI call fails or is unavailable.
        The `source` field in the suggestion reports which path produced it.
      parameters:
        - name: exclude
          in: query
          required: false
          schema:
            type: string
            maxLength: 1000
          description: |
            Comma-separated list of meal `name` values to exclude from the
            suggestion (case-insensitive). Used by the "Try another" button
            to avoid re-suggesting ideas already shown this session.
        - name: pantry
          in: query
          required: false
          schema: { type: string, maxLength: 300 }
          description: Free-text list of ingredients the player has on hand. Implies `useAi=true` when non-empty.
        - name: useAi
          in: query
          required: false
          schema: { type: boolean }
          description: Opt in to AI personalization even without a pantry string.
      responses:
        "200":
          description: Next-meal suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionNextMealSuggestion"

  /nutrition/streak:
    get:
      operationId: getNutritionStreak
      tags: [nutrition]
      summary: Get the player's daily macro-target streak
      description: |
        Returns the current and longest daily macro-target streak for the
        authenticated player, plus today's totals and target so the UI can
        render a progress meter without a second request. A streak lapses
        automatically when the player misses a day.
      responses:
        "200":
          description: Streak snapshot + today's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionStreak"

  /nutrition/recap/send:
    post:
      operationId: sendNutritionRecap
      tags: [nutrition]
      summary: Send this week's nutrition recap notification
      description: |
        Idempotent on-demand trigger. Creates this week's recap notification
        for the authenticated player if one has not already been delivered.
      responses:
        "200":
          description: Whether a recap was sent on this call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionRecapSendResult"
        "500":
          description: Recap delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/recap/preview:
    post:
      operationId: previewNutritionRecap
      tags: [nutrition]
      summary: Send a sample weekly nutrition recap notification
      description: |
        Computes the player's current weekly recap, inserts a one-off
        "preview" notification (separate from the scheduled weekly recap),
        and returns the rendered title, body, and full recap payload so the
        UI can show an inline sample. Rate-limited to once per hour per IP.
      responses:
        "200":
          description: Preview notification inserted and payload returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionRecapPreview"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "429":
          description: Too many preview requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"
        "500":
          description: Recap preview failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  # ── Battles (REST) ───────────────────────────────────────────────────────
  /battles/queue/join:
    post:
      operationId: joinBattleQueue
      tags: [battles]
      summary: REST fallback for joining the battle queue
      description: |
        Validates the chosen hatchling and mode and returns a hint pointing
        clients to the live battle WebSocket. The actual matchmaking happens
        over `/api/ws/battle` — this REST endpoint only exists for
        environments that cannot speak the live socket directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleQueueJoinBody"
      responses:
        "200":
          description: Queue join acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleQueueJoinResponse"
        "400":
          description: Invalid input
        "403":
          description: Invalid hatchling, ranked level gate, or daily battle cap reached.

  /battles/ws-token:
    post:
      operationId: issueBattleWsToken
      tags: [battles]
      summary: Issue a short-lived battle WebSocket handshake token
      description: |
        Issues a 60-second one-time token bound to the authenticated player.
        The frontend appends it as `?token=<uuid>` on the `/api/ws/battle`
        handshake so the server can verify identity without trusting a
        client-supplied `?playerId=` parameter.
      responses:
        "200":
          description: New WS handshake token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWsTokenResponse"

  /battles/queue/leave:
    delete:
      operationId: leaveBattleQueue
      tags: [battles]
      summary: Acknowledge a queue leave request
      description: |
        Returns `{ ok: true }`. Real queue removal happens when the underlying
        WebSocket closes — this endpoint exists so non-WS clients can signal
        intent symmetrically with `joinBattleQueue`.
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /battles/history:
    get:
      operationId: listBattleHistory
      tags: [battles]
      summary: List the authenticated player's recent battles
      description: |
        Returns up to `limit` recent battles (default 10, max 20) for the
        authenticated player, newest first. Each entry is enriched with the
        viewer's perspective (own/opponent hatchling names, viewerWon, etc.).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Recent battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleHistoryEntry"

  /battles/rivals:
    get:
      operationId: listBattleRivals
      tags: [battles]
      summary: Aggregated head-to-head record vs human opponents
      description: |
        Returns opponents the authenticated player has battled at least twice
        (bots are excluded). Sorted by total battles desc, then most recent
        battle desc. Capped at `limit` rows (default 20, max 50).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Rival rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleRival"

  /battles/rivals/{opponentId}:
    get:
      operationId: getBattleRivalDetail
      tags: [battles]
      summary: Full head-to-head battle log vs a specific opponent
      description: |
        Returns aggregated head-to-head stats and a reverse-chronological list
        of every battle the authenticated player has fought against
        `opponentId`. Each log entry is enriched from the viewer's perspective
        (own/opponent hatchling names, outcome, signed ELO change).
      parameters:
        - name: opponentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Head-to-head detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleRivalDetail"
        "400":
          description: Invalid `opponentId` (non-numeric, non-positive, or equal to the caller's id)
        "404":
          description: Opponent not found

  /battles/{id}:
    get:
      operationId: getBattle
      tags: [battles]
      summary: Get a single battle by id
      description: |
        Returns the full battle row (including `turnsJson`) for a battle the
        authenticated player participated in.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Battle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleDetail"
        "403":
          description: Caller did not participate in this battle
        "404":
          description: Battle not found

  /battles/rematch:
    post:
      operationId: createBattleRematch
      tags: [battles]
      summary: Send a rematch challenge to a previous opponent
      description: |
        Creates an in-memory rematch invite (5-minute expiry) targeted at the
        opposing player from a prior battle, and drops a persistent
        `rematch_invite` notification in their inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleRematchCreateBody"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleRematchInvite"
        "400":
          description: Invalid input or attempting to rematch a bot
        "403":
          description: Caller is not a participant in the referenced battle or does not own the hatchling
        "404":
          description: Battle or opponent not found

  /battles/rematch/pending:
    get:
      operationId: listPendingBattleRematches
      tags: [battles]
      summary: List pending rematch invites involving the caller
      description: |
        Returns all pending invites where the caller is either the inviter
        or the recipient, enriched with display names for both sides.
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleRematchInvite"

  /battles/rematch/{id}:
    get:
      operationId: getBattleRematch
      tags: [battles]
      summary: Fetch a single rematch invite by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleRematchInvite"
        "403":
          description: Caller is not a participant in the invite
        "404":
          description: Invite not found or expired

  /battles/rematch/{id}/accept:
    post:
      operationId: acceptBattleRematch
      tags: [battles]
      summary: Accept a rematch invite
      description: |
        Only the recipient of a pending invite may accept. Marks the invite
        as `accepted` and notifies the inviter so they can hop into the
        queue.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleRematchAcceptResponse"
        "403":
          description: Only the recipient may accept this invite
        "404":
          description: Invite not found or expired
        "409":
          description: Invite is no longer pending

  /battles/rematch/{id}/decline:
    post:
      operationId: declineBattleRematch
      tags: [battles]
      summary: Decline (or cancel) a rematch invite
      description: |
        Either side may decline. The recipient declining notifies the
        inviter. The inviter declining acts as a quiet cancellation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Caller is not a participant in the invite
        "404":
          description: Invite not found or expired

  /leaderboards/battle-elo:
    get:
      operationId: getBattleEloLeaderboard
      tags: [leaderboards]
      summary: Top players ranked by battle ELO
      description: |
        Returns the top `limit` players ordered by `battleElo` desc (default
        100, max 100).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Battle ELO leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleEloLeaderboardEntry"

  # ── Live battle WebSocket protocol (documentation-only endpoints) ─────────
  # The real transport for these messages is the WebSocket at `/api/ws/battle`,
  # not these HTTP endpoints. They exist solely to attach the discriminated
  # message unions to operations so Orval emits reusable Zod schemas that the
  # server and frontend can both import for validation.
  /battles/ws/protocol/client-message:
    post:
      summary: "[Docs only] Validate a client→server battle WS message"
      operationId: docsValidateBattleWsClientMessage
      description: |
        Documentation-only endpoint that defines the schema of messages the
        client sends over the live battle WebSocket (`/api/ws/battle`). The
        endpoint itself returns `410 Gone` — clients should send these
        messages over the WebSocket, not via HTTP.
      tags: [docs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleWsClientMessage"
      responses:
        "410":
          description: This endpoint is documentation-only; send the message over the WebSocket instead.
  /battles/ws/protocol/server-message:
    post:
      summary: "[Docs only] Validate a server→client battle WS message"
      operationId: docsValidateBattleWsServerMessage
      description: |
        Documentation-only endpoint that defines the schema of messages the
        server pushes to clients over the live battle WebSocket
        (`/api/ws/battle`). The endpoint itself returns `410 Gone`.
      tags: [docs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleWsServerMessage"
      responses:
        "410":
          description: This endpoint is documentation-only; the server sends these messages over the WebSocket.

  /nutrition/physique-goal:
    put:
      operationId: updatePhysiqueGoal
      tags: [nutrition]
      summary: Update the player's physique goal
      description: |
        Updates the physique goal used to derive daily macro targets and
        Hatchling reward tuning. The caller must own `playerId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysiqueGoalInput"
      responses:
        "200":
          description: Updated physique goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysiqueGoalResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  /nutrition/pantry:
    put:
      operationId: updatePantryNotes
      tags: [nutrition]
      summary: Save the player's pantry notes
      description: |
        Persists the free-text "what I have on hand" string used to
        personalize the AI next-meal suggestion. Stored on the player so
        the value follows the user across devices and sessions. Pass an
        empty string to clear the saved pantry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PantryNotesInput"
      responses:
        "200":
          description: Updated pantry notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryNotesResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageErrorEnvelope"

  # ── Appeals ──────────────────────────────────────────────────────────────
  /account/appeals/mine:
    get:
      operationId: getMyAppeal
      tags: [appeals]
      summary: Get the current player's most recent suspension appeal
      description: |
        Returns the current player's latest appeal (any status) or `null` if
        they have never filed one. Used by the suspended-account banner to
        decide whether to show the submit form, a pending-review notice, or a
        resolved-decision notice.
      responses:
        "200":
          description: Latest appeal (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAppealResponse"

  /account/appeals:
    post:
      operationId: submitAppeal
      tags: [appeals]
      summary: Submit a suspension appeal
      description: |
        Suspended players can submit one short message explaining why they
        think the suspension is a mistake. Only one appeal can be `pending` at
        a time per player; further submissions return `409 appeal_already_open`
        until an admin resolves the existing one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmitBody"
      responses:
        "201":
          description: Appeal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealEnvelope"
        "400":
          description: Invalid message (too short or too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealErrorEnvelope"
        "403":
          description: Caller is not suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealErrorEnvelope"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealErrorEnvelope"
        "409":
          description: An appeal is already pending for this player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConflictEnvelope"

  /admin/appeals:
    get:
      operationId: listAdminAppeals
      tags: [appeals]
      summary: List suspension appeals (admin)
      description: |
        Admin-only. Returns appeals (optionally filtered by status), each
        hydrated with a minimal player summary so the moderation UI can show
        who submitted the appeal without firing N follow-up requests.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by appeal status (`pending`, `approved`, `denied`)
          schema:
            type: string
            enum: [pending, approved, denied]
      responses:
        "200":
          description: Appeals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAppeal"

  /admin/appeals/{id}:
    patch:
      operationId: resolveAdminAppeal
      tags: [appeals]
      summary: Approve or deny a suspension appeal (admin)
      description: |
        Admin-only. Approving an appeal also unsuspends the player by default
        (set `unsuspend=false` to approve without lifting the suspension, e.g.
        for partial resolutions). Denying never changes suspension state.
        Both outcomes write an audit-log entry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealResolveBody"
      responses:
        "200":
          description: Appeal resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealResolveResponse"
        "400":
          description: Invalid id or status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealErrorEnvelope"
        "404":
          description: Appeal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealErrorEnvelope"
        "409":
          description: Appeal has already been resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealErrorEnvelope"

  /analytics/share:
    post:
      tags: [analytics]
      operationId: trackShareEvent
      summary: Record a share button analytics event
      description: |
        Fire-and-forget endpoint that records when a player opens the share
        dialog, completes a native share, or copies a link. Requires auth so
        events are attributable to a player. Failures are silently ignored
        by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareEventBody"
      responses:
        "204":
          description: Event recorded.
        "400":
          description: Invalid payload.
        "401":
          description: Unauthorized.

components:
  schemas:
    ShareEventBody:
      type: object
      required: [contentType, contentId, action]
      properties:
        contentType:
          type: string
          enum: [player, club, post]
          description: The type of content being shared.
        contentId:
          type: string
          description: The identifier of the content (username, club ID, or post ID).
          minLength: 1
          maxLength: 256
        action:
          type: string
          enum: [dialog_opened, native_share, copy_link]
          description: Which share action the player performed.
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:        { type: string, minLength: 1 }
        size:        { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:  { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    StorageErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Player ──────────────────────────────────────────────────────────────
    Player:
      type: object
      required: [id, username, level, xp, coins, rank, totalWins, totalMatches, totalSteps, fitnessXp, currentStreak, fitnessRealm, createdAt]
      properties:
        id:             { type: integer }
        username:       { type: string }
        displayName:    { type: ["string", "null"] }
        avatarUrl:      { type: ["string", "null"] }
        level:          { type: integer }
        xp:             { type: integer }
        coins:          { type: integer }
        rank:           { type: string }
        rankScore:      { type: integer }
        totalWins:      { type: integer }
        totalMatches:   { type: integer }
        clubId:         { type: ["integer", "null"] }
        activeHatchlingId: { type: ["integer", "null"] }
        totalSteps:     { type: integer }
        totalWorkouts:  { type: integer }
        fitnessXp:      { type: integer }
        currentStreak:  { type: integer }
        longestStreak:  { type: integer }
        fitnessRealm:   { type: string }
        waterCups:      { type: integer }
        dailyStepGoal:  { type: integer }
        lastActiveDate: { type: ["string", "null"] }
        createdAt:      { type: string }

    PlayerInput:
      type: object
      required: [username]
      properties:
        username:    { type: string, minLength: 2, maxLength: 20 }
        displayName: { type: string }
        avatarUrl:   { type: string }

    PlayerUpdate:
      type: object
      properties:
        displayName:   { type: string }
        avatarUrl:     { type: string }
        fitnessRealm:  { type: string }
        dailyStepGoal: { type: integer }
        waterCups:     { type: integer }
        activeHatchlingId: { type: ["integer", "null"] }

    PlayerDashboard:
      type: object
      required: [player, hatchlingCount, totalWins, recentCompetitions, activeEvents, topHatchling, activeEggs, fitnessStats]
      properties:
        player:               { $ref: "#/components/schemas/Player" }
        hatchlingCount:       { type: integer }
        totalWins:            { type: integer }
        winRate:              { type: number }
        recentCompetitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"
        activeEvents:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
        topHatchling:         { $ref: "#/components/schemas/Hatchling" }
        activeEggs:
          type: array
          items:
            $ref: "#/components/schemas/Egg"
        fitnessStats:         { $ref: "#/components/schemas/FitnessStats" }

    # ── Hatchling ────────────────────────────────────────────────────────────
    Hatchling:
      type: object
      required: [id, playerId, name, species, evolutionStage, personality, mood, level, xp, happiness, hunger, energy, fitnessType, realm, friendshipLevel, moodState, createdAt]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        name:           { type: string }
        species:        { type: string }
        evolutionStage: { type: integer }
        evolutionType:  { type: ["string", "null"] }
        category:       { type: string }
        rarity:         { type: string }
        personality:    { type: string }
        mood:           { type: string }
        level:          { type: integer }
        xp:             { type: integer }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        abilityName:    { type: ["string", "null"] }
        abilityDesc:    { type: ["string", "null"] }
        imageUrl:       { type: ["string", "null"] }
        isShiny:        { type: boolean }
        isFusion:       { type: boolean }
        color:          { type: ["string", "null"] }
        fitnessType:    { type: string }
        eggId:          { type: ["integer", "null"] }
        realm:          { type: string }
        genetics:       { type: ["object", "null"] }
        friendshipLevel: { type: integer }
        moodState:      { type: string }
        lastWorkoutAt:  { type: ["string", "null"] }
        loyaltyScore:    { type: integer }
        motivationScore: { type: integer }
        confidenceScore: { type: integer }
        battleWins:      { type: integer }
        powerScore:      { type: integer }
        stepsToEvolution: { type: integer }
        streakCount:     { type: ["integer", "null"] }
        createdAt:       { type: string }

    HatchlingInput:
      type: object
      required: [playerId, name]
      properties:
        playerId:    { type: integer }
        name:        { type: string, minLength: 1, maxLength: 30 }
        species:     { type: string }
        fitnessType: { type: string }

    HatchlingUpdate:
      type: object
      properties:
        name:           { type: string }
        mood:           { type: string }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        moodState:      { type: string }
        friendshipLevel: { type: integer }
        lastWorkoutAt:  { type: string }

    EvolveInput:
      type: object
      required: [triggerId]
      properties:
        triggerId: { type: integer }

    EvolveHatchlingResponse:
      allOf:
        - $ref: "#/components/schemas/Hatchling"
        - type: object
          required: [evolutionSharePrompt]
          properties:
            evolutionSharePrompt:
              type: boolean
              description: When true, the client should surface a share sheet so the player can brag about the evolution.

    # ── Evolution ────────────────────────────────────────────────────────────
    EvolutionType:
      type: object
      required: [id, name, category, rarity, description, unlockedCount, realm, stage, evolutionPath, isPrestige]
      properties:
        id:            { type: integer }
        name:          { type: string }
        category:      { type: string }
        rarity:        { type: string }
        description:   { type: string }
        unlockHint:    { type: ["string", "null"] }
        imageUrl:      { type: ["string", "null"] }
        abilityName:   { type: ["string", "null"] }
        abilityDesc:   { type: ["string", "null"] }
        unlockedCount: { type: integer }
        color:         { type: ["string", "null"] }
        fitnessType:   { type: ["string", "null"] }
        realm:         { type: string }
        stage:         { type: integer }
        evolutionPath: { type: string }
        isPrestige:    { type: boolean }

    EvolutionCategory:
      type: object
      required: [category, count, rarest]
      properties:
        category: { type: string }
        count:    { type: integer }
        rarest:   { type: string }
        color:    { type: ["string", "null"] }

    RealmInfo:
      type: object
      required: [id, name, description, color, auraColor, evolutionCount, fitnessTypes]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string }
        color:         { type: string }
        auraColor:     { type: string }
        evolutionCount: { type: integer }
        fitnessTypes:
          type: array
          items:
            type: string

    # ── Competition ──────────────────────────────────────────────────────────
    Competition:
      type: object
      required: [id, mode, status, playerId, hatchlingId, score, rank, createdAt]
      properties:
        id:          { type: integer }
        mode:        { type: string }
        status:      { type: string }
        playerId:    { type: integer }
        playerName:  { type: ["string", "null"] }
        hatchlingId: { type: integer }
        hatchlingName: { type: ["string", "null"] }
        score:       { type: integer }
        rank:        { type: ["integer", "null"] }
        duration:    { type: ["integer", "null"] }
        xpEarned:    { type: ["integer", "null"] }
        coinsEarned: { type: ["integer", "null"] }
        createdAt:   { type: string }
        hatchlingXpDelta:  { type: ["integer", "null"], description: "XP awarded to the Pal this race/competition." }
        hatchlingPrevLevel: { type: ["integer", "null"], description: "Pal level before the XP was applied." }
        hatchlingNewLevel:  { type: ["integer", "null"], description: "Pal level after XP was applied." }
        hatchlingNewXp:     { type: ["integer", "null"], description: "Pal total XP after the reward." }
        hatchlingEvolutionSharePrompt: { type: ["boolean", "null"], description: "True when the Pal crossed an evolution milestone (level 5 or 15) in this result." }

    CompetitionInput:
      type: object
      required: [mode, playerId]
      properties:
        mode:        { type: string }
        playerId:    { type: integer }
        # Optional — when omitted, the server uses the caller's active partner
        # Hatchling (players.activeHatchlingId, with a most-recent fallback).
        hatchlingId: { type: integer }

    CompetitionResultInput:
      type: object
      required: [score, duration, rank]
      properties:
        score:    { type: integer }
        duration: { type: integer }
        rank:     { type: integer }
        playerId: { type: integer }

    GameMode:
      type: object
      required: [id, name, description, minLevel]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        minLevel:    { type: integer }
        maxPlayers:  { type: ["integer", "null"] }
        xpMultiplier: { type: number }
        isLive:      { type: boolean }

    # ── Leaderboard ──────────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, score]
      properties:
        position:         { type: integer }
        playerId:         { type: integer }
        username:         { type: string }
        displayName:      { type: string, nullable: true }
        avatarUrl:        { type: string, nullable: true }
        rank:             { type: string }
        score:            { type: integer }
        wins:             { type: integer }
        hatchlingName:    { type: string, nullable: true }
        hatchlingCategory: { type: string, nullable: true }

    RankDistribution:
      type: object
      required: [rank, count, percentage]
      properties:
        rank:       { type: string }
        count:      { type: integer }
        percentage: { type: number }

    # ── Item ─────────────────────────────────────────────────────────────────
    Item:
      type: object
      required: [id, name, description, type, cost, effect]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        cost:        { type: integer }
        effect:      { type: string }
        imageUrl:    { type: ["string", "null"] }
        rarity:      { type: string }

    UseItemInput:
      type: object
      required: [hatchlingId]
      properties:
        hatchlingId: { type: integer }

    # ── Live Event ────────────────────────────────────────────────────────────
    LiveEvent:
      type: object
      required: [id, name, description, type, status, startTime, endTime]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        status:      { type: string }
        startTime:   { type: string }
        endTime:     { type: string }
        rewardXp:    { type: ["integer", "null"] }
        rewardCoins: { type: ["integer", "null"] }
        imageUrl:    { type: ["string", "null"] }
        participantCount: { type: integer }
        isFeatured:  { type: boolean }
        color:       { type: ["string", "null"] }
        hasJoined:   { type: boolean }

    PlayerEventHistoryItem:
      type: object
      required: [eventId, eventName, joinedAt]
      properties:
        eventId:    { type: integer }
        eventName:  { type: string }
        eventType:  { type: string }
        status:     { type: string }
        joinedAt:   { type: string, format: date-time }
        xpEarned:   { type: ["integer", "null"] }
        startTime:  { type: string, format: date-time }
        endTime:    { type: string, format: date-time }
        imageUrl:   { type: ["string", "null"] }

    # ── Club ─────────────────────────────────────────────────────────────────
    Club:
      type: object
      required: [id, name, description, memberCount, totalXp, rank, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        badge:       { type: ["string", "null"] }
        memberCount: { type: integer }
        maxMembers:  { type: integer }
        totalXp:     { type: integer }
        rank:        { type: string }
        isPublic:    { type: boolean }
        createdAt:   { type: string }

    ClubMember:
      type: object
      required: [id, username, level, rank, totalWins]
      properties:
        id:          { type: integer }
        username:    { type: string }
        displayName: { type: ["string", "null"] }
        avatarUrl:   { type: ["string", "null"] }
        level:       { type: integer }
        rank:        { type: string }
        totalWins:   { type: integer }
        clubRole:
          type: ["string", "null"]
          enum: [owner, officer, member, null]

    UpdateClubMemberRoleInput:
      type: object
      required: [clubRole]
      properties:
        clubRole:
          type: string
          enum: [owner, officer, member]

    TransferClubOwnershipInput:
      type: object
      required: [newOwnerId]
      properties:
        newOwnerId:
          type: integer
          minimum: 1
          description: Player ID of the member who should become the new owner.
        alsoLeave:
          type: boolean
          default: false
          description: If true, the current owner is also removed from the club in the same transaction after the new owner is assigned.

    ClubInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 2, maxLength: 30 }
        description: { type: string }
        isPublic:    { type: boolean }

    JoinClubInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    # ── Eggs ─────────────────────────────────────────────────────────────────
    Egg:
      type: object
      required: [id, playerId, rarity, eggType, stepsRequired, stepsProgress, isHatched, name, realm, createdAt]
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        rarity:        { type: string }
        eggType:       { type: string }
        realm:         { type: string }
        stepsRequired: { type: integer }
        stepsProgress: { type: integer }
        isHatched:     { type: boolean }
        hatchlingId:   { type: ["integer", "null"] }
        imageUrl:      { type: ["string", "null"] }
        name:          { type: string }
        description:   { type: ["string", "null"] }
        progressPct:   { type: number }
        isReady:       { type: boolean }
        createdAt:     { type: string }
        hatchedAt:     { type: ["string", "null"] }

    AddEggInput:
      type: object
      required: [playerId, eggType]
      properties:
        playerId: { type: integer }
        eggType:  { type: string }
        rarity:   { type: string }

    HatchEggInput:
      type: object
      required: [playerId, name]
      properties:
        playerId: { type: integer }
        name:     { type: string, minLength: 1, maxLength: 30 }

    HatchResult:
      type: object
      required: [egg, hatchling]
      properties:
        egg:       { $ref: "#/components/schemas/Egg" }
        hatchling: { $ref: "#/components/schemas/Hatchling" }

    # ── Fitness ──────────────────────────────────────────────────────────────
    FitnessStats:
      type: object
      required: [playerId, totalSteps, totalWorkouts, fitnessXp, currentStreak, longestStreak, fitnessRealm, waterCups, todaySteps, todayXp, dailyStepGoal]
      properties:
        playerId:       { type: integer }
        totalSteps:     { type: integer }
        totalWorkouts:  { type: integer }
        fitnessXp:      { type: integer }
        currentStreak:  { type: integer }
        longestStreak:  { type: integer }
        fitnessRealm:   { type: string }
        waterCups:      { type: integer }
        todaySteps:     { type: integer }
        todayXp:        { type: integer }
        dailyStepGoal:  { type: integer }
        stepGoalPct:    { type: number }
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/FitnessActivity"

    FitnessActivity:
      type: object
      required: [id, playerId, type, value, unit, fitnessXpEarned, realm, createdAt]
      properties:
        id:              { type: integer }
        playerId:        { type: integer }
        type:            { type: string }
        value:           { type: integer }
        unit:            { type: string }
        fitnessXpEarned: { type: integer }
        realm:           { type: string }
        note:            { type: ["string", "null"] }
        createdAt:       { type: string }

    LogActivityInput:
      type: object
      required: [playerId, type, value]
      properties:
        playerId:      { type: integer }
        type:          { type: string }
        value:         { type: integer }
        note:          { type: string }
        groupId:       { type: integer }
        distanceMiles: { type: number, description: "Optional distance in miles (for running/cycling pace tracking)" }

    ActivityLogResult:
      type: object
      required: [activity, fitnessXpEarned, eggsUpdated, player]
      properties:
        activity:         { $ref: "#/components/schemas/FitnessActivity" }
        fitnessXpEarned:  { type: integer }
        eggsUpdated:      { type: integer }
        player:           { $ref: "#/components/schemas/Player" }
        groupBonusXp:     { type: integer }
        groupXpBonusPct:  { type: integer }
        prResult:
          nullable: true
          type: object
          required: [activityType, metric, value, isNew]
          properties:
            activityType: { type: string }
            metric:       { type: string }
            value:        { type: integer }
            isNew:        { type: boolean }
        newBadges:
          type: array
          description: "Badges newly awarded to the player as a result of this activity log."
          items: { $ref: "#/components/schemas/BadgeDefinition" }
        newArtifacts:
          type: array
          description: "Artifact rewards newly unlocked by this activity log."
          items: { $ref: "#/components/schemas/ArtifactUnlock" }
        palXpResult:
          nullable: true
          type: object
          description: "XP awarded to the active Pal from this fitness activity, if applicable."
          required: [hatchlingId, xpDelta, prevLevel, newLevel, newXp]
          properties:
            hatchlingId: { type: integer }
            xpDelta:     { type: integer, description: "XP awarded to the Pal." }
            prevLevel:   { type: integer, description: "Pal level before XP was applied." }
            newLevel:    { type: integer, description: "Pal level after XP was applied." }
            newXp:       { type: integer, description: "Pal total XP after the reward." }
            evolutionSharePrompt: { type: boolean, description: "True when the Pal crossed an evolution milestone (level 5 or 15)." }

    BadgeDefinition:
      type: object
      required: [key, name, description, tier, category, icon, isSecret, xpReward, coinsReward]
      properties:
        key:                  { type: string }
        name:                 { type: string }
        description:          { type: string }
        tier:                 { type: string, enum: [Common, Rare, Epic, Legendary, Mythic] }
        category:             { type: string, enum: [fitness, streak, hatchling, social, achievement, event, secret, strength, speed, nutrition] }
        icon:                 { type: string }
        isSecret:             { type: boolean }
        xpReward:             { type: integer }
        coinsReward:          { type: integer }
        creatureAbilityHint:  { type: string, description: "Optional hint about a special creature ability unlocked alongside this badge." }

    ArtifactUnlock:
      type: object
      required: [id, name, rarity, lore, imageSlug]
      properties:
        id:        { type: integer }
        name:      { type: string }
        rarity:    { type: string }
        lore:      { type: string }
        imageSlug: { type: string }

    FitnessQuest:
      type: object
      required: [id, playerId, title, description, type, targetValue, currentValue, xpReward, coinReward, isCompleted, realm, expiresAt, createdAt]
      properties:
        id:           { type: integer }
        playerId:     { type: integer }
        title:        { type: string }
        description:  { type: string }
        type:         { type: string }
        targetValue:  { type: integer }
        currentValue: { type: integer }
        xpReward:     { type: integer }
        coinReward:   { type: integer }
        isCompleted:  { type: boolean }
        realm:        { type: string }
        expiresAt:    { type: string }
        createdAt:    { type: string }
        progressPct:  { type: number }

    FitnessRealm:
      type: object
      required: [id, name, description, color, icon, fitnessTypes, evolutionBonus]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string }
        color:         { type: string }
        icon:          { type: string }
        fitnessTypes:
          type: array
          items:
            type: string
        evolutionBonus: { type: string }
        playerXp:      { type: ["integer", "null"] }
        isUnlocked:    { type: boolean }

    # ── Training ──────────────────────────────────────────────────────────────
    WorkoutDay:
      type: object
      required: [day, name, exercises, realm, durationMinutes, xpReward]
      properties:
        day:             { type: string }
        name:            { type: string }
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        realm:           { type: string }
        durationMinutes: { type: integer }
        xpReward:        { type: integer }
        coinsReward:     { type: integer }

    Exercise:
      type: object
      required: [name, sets, reps, rest]
      properties:
        name:   { type: string }
        sets:   { type: integer }
        reps:   { type: string }
        rest:   { type: string }
        tip:    { type: string }
        muscle: { type: string }

    WorkoutPlan:
      type: object
      required: [id, playerId, goal, fitnessLevel, equipment, weekNumber, isActive, createdAt, days]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        goal:           { type: string }
        fitnessLevel:   { type: string }
        equipment:      { type: string }
        weekNumber:     { type: integer }
        isActive:       { type: boolean }
        createdAt:      { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutDay"

    WorkoutSession:
      type: object
      required: [id, playerId, workoutType, durationMinutes, exercisesCompleted, xpEarned, coinsEarned, realm, createdAt]
      properties:
        id:                  { type: integer }
        playerId:            { type: integer }
        workoutType:         { type: string }
        durationMinutes:     { type: integer }
        exercisesCompleted:  { type: integer }
        xpEarned:            { type: integer }
        coinsEarned:         { type: integer }
        realm:               { type: string }
        notes:               { type: ["string", "null"] }
        createdAt:           { type: string }
        palXpResult:
          nullable: true
          type: object
          description: "XP awarded to the active Pal from this training session, if applicable."
          required: [hatchlingId, xpDelta, prevLevel, newLevel, newXp]
          properties:
            hatchlingId: { type: integer }
            xpDelta:     { type: integer, description: "XP awarded to the Pal." }
            prevLevel:   { type: integer, description: "Pal level before XP was applied." }
            newLevel:    { type: integer, description: "Pal level after XP was applied." }
            newXp:       { type: integer, description: "Pal total XP after the reward." }
            evolutionSharePrompt: { type: boolean, description: "True when the Pal crossed an evolution milestone (level 5 or 15)." }

    MealItem:
      type: object
      required: [name, calories, protein, carbs, fat]
      properties:
        name:     { type: string }
        calories: { type: integer }
        protein:  { type: integer }
        carbs:    { type: integer }
        fat:      { type: integer }
        tip:      { type: string }

    MealDay:
      type: object
      required: [day, breakfast, lunch, dinner, snacks, totalCalories, totalProtein]
      properties:
        day:           { type: string }
        breakfast:     { $ref: "#/components/schemas/MealItem" }
        lunch:         { $ref: "#/components/schemas/MealItem" }
        dinner:        { $ref: "#/components/schemas/MealItem" }
        snacks:
          type: array
          items:
            $ref: "#/components/schemas/MealItem"
        totalCalories: { type: integer }
        totalProtein:  { type: integer }
        hydrationGoal: { type: integer }

    MealPlan:
      type: object
      required: [id, playerId, goal, calorieTarget, proteinTarget, carbTarget, fatTarget, isActive, createdAt, days]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        goal:           { type: string }
        calorieTarget:  { type: integer }
        proteinTarget:  { type: integer }
        carbTarget:     { type: integer }
        fatTarget:      { type: integer }
        isActive:       { type: boolean }
        createdAt:      { type: string }
        days:
          type: array
          items:
            $ref: "#/components/schemas/MealDay"

    GeneratePlanInput:
      type: object
      required: [playerId, goal]
      properties:
        playerId:     { type: integer }
        goal:         { type: string }
        fitnessLevel: { type: string }
        equipment:    { type: string }

    LogSessionInput:
      type: object
      required: [playerId, workoutType, durationMinutes]
      properties:
        playerId:           { type: integer }
        workoutType:        { type: string }
        durationMinutes:    { type: integer }
        exercisesCompleted: { type: integer }
        notes:              { type: string }

    GenerateMealPlanInput:
      type: object
      required: [playerId, goal]
      properties:
        playerId: { type: integer }
        goal:     { type: string }
        calories: { type: integer }

    # ── Health Sync ──────────────────────────────────────────────────────────
    HealthConnection:
      type: object
      required: [id, platform, isConnected, createdAt]
      properties:
        id:             { type: integer }
        platform:       { type: string }
        isConnected:    { type: boolean }
        lastSyncedAt:   { type: ["string", "null"] }
        consentGivenAt: { type: string }
        createdAt:      { type: string }

    SyncResult:
      type: object
      required: [activitiesImported, xpEarned, lastSyncedAt]
      properties:
        activitiesImported: { type: integer }
        xpEarned:           { type: integer }
        lastSyncedAt:       { type: string }

    SuccessResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ── Groups ────────────────────────────────────────────────────────────────
    WorkoutGroupSummary:
      type: object
      required: [id, name, type, inviteCode, creatorPlayerId, teamEnergy, totalTeamEnergy, maxMembers, isActive, memberCount, activeChallenges, hasActiveRaid, createdAt]
      properties:
        id:                { type: integer }
        name:              { type: string }
        type:              { type: string }
        inviteCode:        { type: string }
        creatorPlayerId:   { type: integer }
        teamEnergy:        { type: integer }
        totalTeamEnergy:   { type: integer }
        maxMembers:        { type: integer }
        isActive:          { type: boolean }
        memberCount:       { type: integer }
        activeChallenges:  { type: integer }
        hasActiveRaid:     { type: boolean }
        createdAt:         { type: string }

    GroupMemberDetail:
      type: object
      required: [id, groupId, playerId, friendshipLevel, coWorkoutCount, joinedAt, username]
      properties:
        id:                  { type: integer }
        groupId:             { type: integer }
        playerId:            { type: integer }
        username:            { type: string }
        displayName:         { type: ["string", "null"] }
        friendshipLevel:     { type: integer }
        coWorkoutCount:      { type: integer }
        lastWorkoutTogether: { type: ["string", "null"] }
        joinedAt:            { type: string }

    GroupChallenge:
      type: object
      required: [id, groupId, title, description, targetValue, currentValue, rewardType, rewardAmount, isCompleted, progressPct, expiresAt, createdAt]
      properties:
        id:           { type: integer }
        groupId:      { type: integer }
        title:        { type: string }
        description:  { type: string }
        targetValue:  { type: integer }
        currentValue: { type: integer }
        rewardType:   { type: string }
        rewardAmount: { type: integer }
        isCompleted:  { type: boolean }
        progressPct:  { type: integer }
        expiresAt:    { type: string }
        createdAt:    { type: string }

    GroupRaid:
      type: object
      required: [id, groupId, bossName, bossHp, currentDamage, status, hpPct, unlockedAt, createdAt]
      properties:
        id:            { type: integer }
        groupId:       { type: integer }
        bossName:      { type: string }
        bossHp:        { type: integer }
        currentDamage: { type: integer }
        status:        { type: string }
        hpPct:         { type: integer }
        unlockedAt:    { type: string }
        createdAt:     { type: string }

    WorkoutGroupDetail:
      type: object
      required: [id, name, type, inviteCode, creatorPlayerId, teamEnergy, totalTeamEnergy, maxMembers, isActive, memberCount, members, challenges, createdAt]
      properties:
        id:              { type: integer }
        name:            { type: string }
        type:            { type: string }
        inviteCode:      { type: string }
        creatorPlayerId: { type: integer }
        teamEnergy:      { type: integer }
        totalTeamEnergy: { type: integer }
        maxMembers:      { type: integer }
        isActive:        { type: boolean }
        memberCount:     { type: integer }
        createdAt:       { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberDetail"
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/GroupChallenge"
        raid:
          oneOf:
            - $ref: "#/components/schemas/GroupRaid"
            - type: "null"

    GroupMessage:
      type: object
      required: [id, groupId, playerId, playerName, content, isFiltered, createdAt]
      properties:
        id:         { type: integer }
        groupId:    { type: integer }
        playerId:   { type: integer }
        playerName: { type: string }
        content:    { type: string }
        isFiltered: { type: boolean }
        createdAt:  { type: string }

    CreateGroupInput:
      type: object
      required: [name, creatorPlayerId]
      properties:
        name:            { type: string, minLength: 2, maxLength: 40 }
        type:            { type: string }
        creatorPlayerId: { type: integer }
        maxMembers:      { type: integer }

    LeaveGroupInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    JoinGroupInput:
      type: object
      required: [playerId]
      properties:
        playerId:   { type: integer }
        inviteCode: { type: string }

    LogGroupWorkoutInput:
      type: object
      required: [playerId, baseXp]
      properties:
        playerId: { type: integer }
        baseXp:   { type: integer }
        steps:    { type: integer }
        workoutType: { type: string }

    GroupWorkoutResult:
      type: object
      required: [energyGained, teamEnergy, bonusXp, xpBonusPct, memberCount, challengesAdvanced, raidDamage, raidUnlocked, fitnessXpEarned]
      properties:
        energyGained:      { type: integer }
        teamEnergy:        { type: integer }
        bonusXp:           { type: integer }
        xpBonusPct:        { type: integer }
        memberCount:       { type: integer }
        challengesAdvanced: { type: integer }
        raidDamage:        { type: integer }
        raidUnlocked:      { type: boolean }
        fitnessXpEarned:   { type: integer }
        activity:          { $ref: "#/components/schemas/FitnessActivity" }
        player:            { $ref: "#/components/schemas/Player" }

    SendGroupMessageInput:
      type: object
      required: [playerId, content]
      properties:
        playerId: { type: integer }
        content:  { type: string, minLength: 1, maxLength: 280 }

    JoinGroupByCodeInput:
      type: object
      required: [playerId, inviteCode]
      properties:
        playerId:   { type: integer }
        inviteCode: { type: string, minLength: 6, maxLength: 6 }

    GroupChallengeProgressInput:
      type: object
      required: [playerId, progressValue]
      properties:
        playerId:      { type: integer }
        progressValue: { type: integer }

    GroupChallengeProgressResult:
      type: object
      required: [challengesAdvanced, challenges]
      properties:
        challengesAdvanced: { type: integer }
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/GroupChallenge"

    GroupRaidAttackInput:
      type: object
      required: [playerId, damage]
      properties:
        playerId: { type: integer }
        damage:   { type: integer }

    PersonalRecord:
      type: object
      required: [id, playerId, activityType, metric, value, achievedAt]
      properties:
        id:           { type: integer }
        playerId:     { type: integer }
        activityType: { type: string }
        metric:       { type: string }
        value:        { type: integer }
        achievedAt:   { type: string, format: date-time }

    StrengthTotals:
      type: object
      required: [totalReps, lifetimePushups, lifetimeSquats, lifetimeBurpees, lifetimePullups, lifetimePlanks, lifetimeSitups]
      properties:
        totalReps:       { type: integer }
        lifetimePushups: { type: integer }
        lifetimeSquats:  { type: integer }
        lifetimeBurpees: { type: integer }
        lifetimePullups: { type: integer }
        lifetimePlanks:  { type: integer }
        lifetimeSitups:  { type: integer }

    PlayerRecordsResult:
      type: object
      required: [personalRecords, strengthTotals, monthlyRunMiles]
      properties:
        personalRecords:
          type: array
          items:
            $ref: "#/components/schemas/PersonalRecord"
        strengthTotals:
          $ref: "#/components/schemas/StrengthTotals"
        monthlyRunMiles: { type: number }

    ArtifactAbility:
      type: object
      required: [name, description, value]
      properties:
        name:        { type: string }
        description: { type: string }
        value:       { type: number }

    ArtifactMuseumEntry:
      type: object
      required: [id, name, lore, rarity, type, imageSlug, isHidden, abilities, discovered, isEquipped, isFeatured, featuredOrder]
      properties:
        id:          { type: integer }
        name:        { type: string }
        lore:        { type: string }
        rarity:      { type: string }
        type:        { type: string }
        imageSlug:   { type: string }
        isHidden:    { type: boolean }
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactAbility"
        discovered:  { type: boolean }
        isEquipped:  { type: boolean }
        isFeatured:  { type: boolean }
        featuredOrder:
          type: ["integer", "null"]
          description: 1-based position in the player's profile showcase, or null if not featured.
        earnedAt:    { type: ["string", "null"] }

    OwnedArtifact:
      type: object
      required: [id, name, lore, rarity, type, imageSlug, abilities, isEquipped, isFeatured, featuredOrder, earnedAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        lore:        { type: string }
        rarity:      { type: string }
        type:        { type: string }
        imageSlug:   { type: string }
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactAbility"
        isEquipped:  { type: boolean }
        isFeatured:  { type: boolean }
        featuredOrder:
          type: ["integer", "null"]
          description: 1-based position in the player's profile showcase, or null if not featured.
        earnedAt:    { type: string }

    ToggleOwnedArtifactBody:
      type: object
      properties:
        isEquipped: { type: boolean }
        isFeatured: { type: boolean }
      description: At least one of `isEquipped` or `isFeatured` should be provided. Omitted fields are left unchanged.

    SwapFeaturedArtifactBody:
      type: object
      required: [removeId, addId]
      properties:
        removeId:
          type: integer
          minimum: 1
          description: ID of the artifact currently featured that should be unfeatured.
        addId:
          type: integer
          minimum: 1
          description: ID of the artifact to feature in its place.

    SwapFeaturedArtifactResponse:
      type: object
      required: [ok, removedId, addedId, featured]
      properties:
        ok: { type: boolean }
        removedId: { type: integer }
        addedId: { type: integer }
        featured:
          type: array
          description: Updated list of the player's featured artifacts in display order.
          items:
            $ref: "#/components/schemas/OwnedArtifact"

    ReorderFeaturedArtifactsBody:
      type: object
      required: [artifactIds]
      properties:
        artifactIds:
          type: array
          maxItems: 10
          items:
            type: integer
            minimum: 1
          description: Featured artifact IDs in the desired display order. Every ID must already be featured and owned by the player.

    ReorderFeaturedArtifactsResponse:
      type: object
      required: [ok, order]
      properties:
        ok: { type: boolean }
        order:
          type: array
          items: { type: integer }

    DailyRewardDay:
      type: object
      required: [day, coins, xp, kind, label, icon]
      properties:
        day:   { type: integer, description: "Day number (1-30)" }
        coins: { type: integer }
        xp:    { type: integer }
        bonus: { type: string, description: "Optional bonus reward key e.g. rare_egg, streak_freeze, legendary_chest" }
        kind:  { type: string, enum: [coins, xp, egg, artifact, chest] }
        label: { type: string }
        icon:  { type: string }

    DailyStreakState:
      type: object
      required: [currentDay, streakBroken, alreadyClaimed, lastClaimedAt, schedule, streakShields, shieldActive]
      properties:
        currentDay:    { type: integer, description: "Current streak day (1-30), or 1 if streak was just reset" }
        streakBroken:  { type: boolean, description: "True if the streak reset today due to a missed day" }
        alreadyClaimed: { type: boolean, description: "Whether today has already been claimed" }
        lastClaimedAt: { type: ["string", "null"], format: date-time }
        streakShields: { type: integer, description: "Number of Streak Shields the player owns" }
        shieldActive:  { type: boolean, description: "True if a Streak Shield was auto-consumed in the last 48 hours" }
        todayReward:
          $ref: "#/components/schemas/DailyRewardDay"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/DailyRewardDay"

    DailyClaimResult:
      type: object
      required: [ok, day, coinsGranted, xpGranted, streakDay, newStreakDay, eggAdded, newBadges, shieldConsumed, streakShieldGranted]
      properties:
        ok:                  { type: boolean }
        day:                 { type: integer }
        coinsGranted:        { type: integer }
        xpGranted:           { type: integer }
        streakDay:           { type: integer, description: "Streak day after claim" }
        newStreakDay:         { type: integer, description: "Next unclaimed day (for badge/UI purposes)" }
        eggAdded:            { type: boolean }
        bonus:               { type: ["string", "null"] }
        shieldConsumed:      { type: boolean, description: "True if a Streak Shield was auto-consumed to preserve the streak" }
        streakShieldGranted: { type: boolean, description: "True if a Streak Shield was granted as a daily reward bonus" }
        artifactGranted:
          nullable: true
          type: object
          required: [artifactId, artifactName]
          properties:
            artifactId:   { type: integer }
            artifactName: { type: string }
        newBadges:
          type: array
          items:
            type: object
            required: [key, name, icon, tier]
            properties:
              key:  { type: string }
              name: { type: string }
              icon: { type: string }
              tier: { type: string }

    BuyStreakShieldResult:
      type: object
      required: [ok, streakShields, coinsSpent, coinsRemaining]
      properties:
        ok:              { type: boolean }
        streakShields:   { type: integer, description: "Updated shield count" }
        coinsSpent:      { type: integer }
        coinsRemaining:  { type: integer }

    FitnessBar:
      type: object
      required: [barType, level, xp, nextLevelXp, xpInCurrentLevel, progressPct]
      properties:
        barType:          { type: string }
        level:            { type: integer }
        xp:               { type: integer }
        nextLevelXp:      { type: integer }
        xpInCurrentLevel: { type: integer }
        progressPct:      { type: integer }

    ArtifactWorldNotification:
      type: object
      required: [id, playerId, playerUsername, artifactId, artifactName, rarity, createdAt]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        playerUsername: { type: string }
        artifactId:     { type: integer }
        artifactName:   { type: string }
        rarity:         { type: string }
        challengeId:    { type: integer, nullable: true }
        createdAt:      { type: string }

    SpeedLeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, metricValue, metricLabel, currentStreak]
      properties:
        position:      { type: integer }
        playerId:      { type: integer }
        username:      { type: string }
        displayName:   { type: string, nullable: true }
        avatarUrl:     { type: string, nullable: true }
        rank:          { type: string }
        metricValue:   { type: integer }
        metricLabel:   { type: string }
        currentStreak: { type: integer }
        achievedAt:    { type: string }

    CoachChatMessage:
      type: object
      required: [role, content]
      properties:
        role:    { type: string, enum: [user, assistant] }
        content: { type: string }

    CoachChatBody:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        history:
          type: array
          items:
            $ref: "#/components/schemas/CoachChatMessage"

    ArtifactLoadout:
      type: object
      required: [playerId, hatchlingId, buildName, powerScore]
      properties:
        id:               { type: integer }
        playerId:         { type: integer }
        hatchlingId:      { type: integer }
        majorArtifactId:  { type: ["integer", "null"] }
        minorArtifact1Id: { type: ["integer", "null"] }
        minorArtifact2Id: { type: ["integer", "null"] }
        buildName:        { type: string }
        powerScore:       { type: number }
        createdAt:        { type: string }
        updatedAt:        { type: string }

    SaveArtifactLoadoutBody:
      type: object
      properties:
        majorArtifactId:  { type: ["integer", "null"] }
        minorArtifact1Id: { type: ["integer", "null"] }
        minorArtifact2Id: { type: ["integer", "null"] }

    SaveArtifactBuildBody:
      type: object
      required: [hatchlingId, buildName]
      properties:
        hatchlingId:      { type: integer }
        buildName:        { type: string, minLength: 1, maxLength: 40 }
        majorArtifactId:  { type: ["integer", "null"] }
        minorArtifact1Id: { type: ["integer", "null"] }
        minorArtifact2Id: { type: ["integer", "null"] }

    ArtifactBattleXpEntry:
      type: object
      required: [playerArtifactId, artifactId, artifactName, rarity, imageSlug, battleXp, evolutionStage]
      properties:
        playerArtifactId: { type: integer }
        artifactId:       { type: integer }
        artifactName:     { type: string }
        rarity:           { type: string }
        imageSlug:        { type: string }
        battleXp:         { type: integer }
        evolutionStage:   { type: integer }

    # ── Challenges ───────────────────────────────────────────────────────────
    Challenge:
      type: object
      required: [id, creatorId, title, description, metric, targetValue, durationDays, type, status, rewardXp, rewardCoins, requiresPublicMeetup, startAt, endAt, maxParticipants, isElimination, currentRound, createdAt]
      properties:
        id:                   { type: integer }
        creatorId:            { type: integer }
        title:                { type: string }
        description:          { type: string }
        metric:               { type: string }
        targetValue:          { type: integer }
        durationDays:         { type: integer }
        type:                 { type: string }
        status:               { type: string }
        rewardXp:             { type: integer }
        rewardCoins:          { type: integer }
        rewardArtifactId:     { type: ["integer", "null"] }
        requiresPublicMeetup: { type: boolean }
        startAt:              { type: string }
        endAt:                { type: string }
        maxParticipants:      { type: integer }
        isElimination:        { type: boolean }
        currentRound:         { type: integer }
        createdAt:            { type: string }

    ChallengeListItem:
      type: object
      required: [id, creatorId, title, metric, targetValue, type, status, rewardXp, rewardCoins, requiresPublicMeetup, startAt, endAt, participantCount, isJoined, createdAt]
      properties:
        id:                   { type: integer }
        creatorId:            { type: integer }
        creator:
          type: ["object", "null"]
          properties:
            id:          { type: integer }
            username:    { type: string }
            displayName: { type: ["string", "null"] }
            avatarUrl:   { type: ["string", "null"] }
        title:                { type: string }
        description:          { type: string }
        metric:               { type: string }
        targetValue:          { type: integer }
        durationDays:         { type: integer }
        type:                 { type: string }
        status:               { type: string }
        rewardXp:             { type: integer }
        rewardCoins:          { type: integer }
        requiresPublicMeetup: { type: boolean }
        startAt:              { type: string }
        endAt:                { type: string }
        participantCount:     { type: integer }
        isJoined:             { type: boolean }
        createdAt:            { type: string }

    ChallengeParticipant:
      type: object
      required: [id, challengeId, playerId, currentValue, eliminated, joinedAt]
      properties:
        id:             { type: integer }
        challengeId:    { type: integer }
        playerId:       { type: integer }
        currentValue:   { type: integer }
        eliminated:     { type: boolean }
        rank:           { type: ["integer", "null"] }
        joinedAt:       { type: string }
        eliminatedRound: { type: ["integer", "null"] }

    ChallengeDetail:
      type: object
      required: [id, creatorId, title, description, metric, targetValue, type, status, rewardXp, rewardCoins, requiresPublicMeetup, startAt, endAt, maxParticipants, isElimination, currentRound, createdAt, leaderboard, participantCount, isJoined]
      properties:
        id:                   { type: integer }
        creatorId:            { type: integer }
        title:                { type: string }
        description:          { type: string }
        metric:               { type: string }
        targetValue:          { type: integer }
        durationDays:         { type: integer }
        type:                 { type: string }
        status:               { type: string }
        rewardXp:             { type: integer }
        rewardCoins:          { type: integer }
        rewardArtifactId:     { type: ["integer", "null"] }
        requiresPublicMeetup: { type: boolean }
        startAt:              { type: string }
        endAt:                { type: string }
        maxParticipants:      { type: integer }
        isElimination:        { type: boolean }
        currentRound:         { type: integer }
        createdAt:            { type: string }
        participantCount:     { type: integer }
        isJoined:             { type: boolean }
        creator:              { type: object }
        leaderboard:
          type: array
          items:
            type: object

    PushPublicKey:
      type: object
      required: [publicKey, configured]
      properties:
        publicKey: { type: string }
        configured: { type: boolean }

    PushSubscribeBody:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string }
        userAgent: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth:   { type: string }

    PushSubscribeResult:
      type: object
      required: [success, id]
      properties:
        success: { type: boolean }
        id:      { type: integer }

    PushPreferences:
      type: object
      required: [invites, endingSoon, completed]
      properties:
        invites:           { type: boolean }
        endingSoon:        { type: boolean }
        completed:         { type: boolean }
        subscriptionCount: { type: integer }

    PushPreferencesUpdate:
      type: object
      properties:
        invites:    { type: boolean }
        endingSoon: { type: boolean }
        completed:  { type: boolean }

    Notification:
      type: object
      required: [id, playerId, type, title, body, link, read, createdAt]
      properties:
        id:         { type: integer }
        playerId:   { type: integer }
        type:       { type: string }
        title:      { type: string }
        body:       { type: string }
        link:       { type: string }
        sourceId:   { type: ["integer", "null"] }
        read:       { type: boolean }
        createdAt:  { type: string }

    ChallengeInvite:
      type: object
      required: [id, challengeId, inviteeId, inviterId, status, sentAt]
      properties:
        id:          { type: integer }
        challengeId: { type: integer }
        inviteeId:   { type: integer }
        inviterId:   { type: integer }
        status:      { type: string }
        sentAt:      { type: string }
        challenge:   { type: object }
        inviter:
          type: object
          nullable: true
          required: [id]
          properties:
            id:          { type: integer }
            displayName: { type: string, nullable: true }
            avatarUrl:   { type: string, nullable: true }

    CreateChallengeBody:
      type: object
      required: [title, metric, targetValue, durationDays]
      properties:
        title:                { type: string, minLength: 3, maxLength: 80 }
        description:          { type: string, maxLength: 500 }
        metric:               { type: string }
        targetValue:          { type: integer, minimum: 1 }
        durationDays:         { type: integer, minimum: 1, maximum: 90 }
        type:                 { type: string, enum: [public, private, guild, city] }
        rewardXp:             { type: integer, minimum: 0 }
        rewardCoins:          { type: integer, minimum: 0 }
        requiresPublicMeetup: { type: boolean }
        maxParticipants:      { type: integer, minimum: 2, maximum: 500 }
        isElimination:        { type: boolean }

    SubmitProgressBody:
      type: object
      required: [value]
      properties:
        value: { type: integer, minimum: 1 }

    ReportChallengeBody:
      type: object
      properties:
        reason: { type: string }

    InviteToChallengeBody:
      type: object
      required: [inviteeId]
      properties:
        inviteeId: { type: integer }

    ClubInvite:
      type: object
      required: [id, clubId, inviteeId, inviterId, status, sentAt]
      properties:
        id:        { type: integer }
        clubId:    { type: integer }
        inviteeId: { type: integer }
        inviterId: { type: integer }
        status:    { type: string }
        sentAt:    { type: string }
        club:      { type: object }
        inviter:
          type: object
          nullable: true
          required: [id]
          properties:
            id:          { type: integer }
            displayName: { type: string, nullable: true }
            avatarUrl:   { type: string, nullable: true }

    PendingClubInvite:
      type: object
      required: [id, clubId, inviteeId, inviterId, status, sentAt, inviteeName]
      properties:
        id:           { type: integer }
        clubId:       { type: integer }
        inviteeId:    { type: integer }
        inviterId:    { type: integer }
        status:       { type: string }
        sentAt:       { type: string }
        inviteeName:  { type: string }
        inviteeAvatar: { type: ["string", "null"] }
        inviterName:  { type: ["string", "null"] }

    InviteToClubBody:
      type: object
      required: [inviteeId]
      properties:
        inviteeId: { type: integer }

    RespondToInviteBody:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, declined] }

    # ── Social ────────────────────────────────────────────────────────────────
    FeedPost:
      type: object
      required: [id, playerId, content, postType, xpEarned, energyEarned, isFlagged, engagementScore, viewCount, createdAt, authorName, reactionCounts, commentCount, myReaction]
      properties:
        id:              { type: integer }
        playerId:        { type: integer }
        authorName:      { type: string }
        authorAvatar:    { type: ["string", "null"] }
        creatorBadge:    { type: ["string", "null"] }
        content:         { type: string }
        mediaUrl:        { type: ["string", "null"] }
        postType:        { type: string }
        creatureId:      { type: ["integer", "null"] }
        creatureName:    { type: ["string", "null"] }
        xpEarned:        { type: integer }
        energyEarned:    { type: integer }
        isFlagged:       { type: boolean }
        engagementScore: { type: integer }
        viewCount:       { type: integer }
        createdAt:       { type: string }
        metadata:
          description: |
            Structured payload that depends on `postType`. For
            `tournament_win`, expect `challengeId` (integer),
            `challengeTitle` (string), `bracketSize` (integer),
            `boostedXp` (integer), and `boostedCoins` (integer). For
            `evolution_reveal`, expect `hatchlingId` (integer),
            `hatchlingName` (string), `fromStage` (integer 1-3),
            `toStage` (integer 1-3), optional `fromStageName` /
            `toStageName` / `realm` / `imageUrl`, and `statDeltas`
            (object of stat → delta numbers). May be null for post types
            that don't carry extra data.
          nullable: true
          type: object
          additionalProperties: true
        reactionCounts:
          type: object
          properties:
            like:      { type: integer }
            encourage: { type: integer }
            fire:      { type: integer }
            flex:      { type: integer }
        commentCount:   { type: integer }
        myReaction:     { type: ["string", "null"] }
        notificationsMuted:
          type: boolean
          description: |
            True when the viewer has muted reaction/comment/comment-like
            notifications for this post. Null/false for anonymous viewers.
        comments:
          type: array
          items:
            $ref: "#/components/schemas/PostComment"

    FeedPage:
      type: object
      required: [posts, nextCursor]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
        nextCursor: { type: ["integer", "null"] }
        total:      { type: integer }

    TrendingPost:
      allOf:
        - $ref: "#/components/schemas/FeedPost"
        - type: object
          required: [recentViewCount]
          properties:
            recentViewCount:
              type: integer
              description: Number of unique views recorded within the trending window.

    TrendingPage:
      type: object
      required: [posts, window]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/TrendingPost"
        window:
          type: string
          enum: [day, week]

    PostComment:
      type: object
      required: [id, postId, playerId, content, isFlagged, createdAt, authorName, likeCount, myLiked]
      properties:
        id:         { type: integer }
        postId:     { type: integer }
        playerId:   { type: integer }
        authorName: { type: string }
        authorAvatar: { type: ["string", "null"] }
        content:    { type: string }
        isFlagged:  { type: boolean }
        createdAt:  { type: string }
        updatedAt:  { type: ["string", "null"] }
        likeCount:  { type: integer }
        myLiked:    { type: boolean }
        isTopComment:
          type: boolean
          description: |
            True when this comment is the most-liked one on its post (likeCount > 0)
            and is being surfaced as the lead comment in a preview. Only set by
            endpoints that enrich a post with its comments (feed/highlights);
            comment-mutation endpoints leave it unset.

    PostCommentRevision:
      type: object
      required: [id, commentId, content, editedAt]
      properties:
        id:        { type: integer }
        commentId: { type: integer }
        content:   { type: string }
        editedAt:  { type: string }

    CommentLikeResult:
      type: object
      required: [liked, likeCount]
      properties:
        liked:     { type: boolean }
        likeCount: { type: integer }

    CommentLikeInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    PlayerStub:
      type: object
      required: [id, username, displayName, avatarUrl, creatorBadge]
      properties:
        id:          { type: integer }
        username:    { type: string }
        displayName: { type: ["string", "null"] }
        avatarUrl:   { type: ["string", "null"] }
        creatorBadge: { type: ["string", "null"] }
        sharedGroups:
          type: array
          description: |
            Groups that both the viewer and this player are members of. Optional
            because not every surface populates it (e.g. raw follower lists).
            When present, picker UIs should surface "Also in <group> with you"
            so the player feels trustworthy at every social touchpoint.
          items:
            $ref: "#/components/schemas/SharedGroup"
        mutualWorkoutPartners:
          type: array
          description: |
            Up to a small number of third players who have actually worked out
            (logged a co-workout in a shared group) with BOTH the viewer and
            this player. Optional — only populated on people-discovery surfaces
            (invite picker, social search, followers, following). Strengthens
            the trust signal beyond raw shared-group overlap: "you've both
            sweated with X" is a stronger reason to trust an unfamiliar profile.
          items:
            $ref: "#/components/schemas/MutualWorkoutPartner"

    MutualWorkoutPartner:
      type: object
      required: [id, displayName, username, avatarUrl, creatorBadge]
      properties:
        id:           { type: integer }
        displayName:  { type: string }
        username:     { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        creatorBadge: { type: ["string", "null"] }

    NearbyPlayer:
      type: object
      required: [id, username, displayName, avatarUrl, distanceBucket, city]
      properties:
        id:             { type: integer }
        username:       { type: string }
        displayName:    { type: ["string", "null"] }
        avatarUrl:      { type: ["string", "null"] }
        city:           { type: ["string", "null"] }
        distanceBucket:
          type: string
          description: |
            Privacy-safe distance label. One of: `under_1km`, `under_5km`,
            `under_25km`, `same_city`. Distance is only computed when both
            the viewer and the target opted into `exact` visibility; in every
            other case the bucket is `same_city`.
          enum: [under_1km, under_5km, under_25km, same_city]

    DiscoverablePlayer:
      type: object
      required: [id, username, displayName, avatarUrl, creatorBadge, followerCount, isFollowing, reason, sharedGroups]
      properties:
        id:            { type: integer }
        username:      { type: string }
        displayName:   { type: ["string", "null"] }
        avatarUrl:     { type: ["string", "null"] }
        creatorBadge:  { type: ["string", "null"] }
        followerCount: { type: integer }
        isFollowing:   { type: boolean }
        reason:        { type: string }
        reasonDetail:  { type: ["string", "null"] }
        sharedGroups:
          type: array
          description: Groups that both the viewer and this player are members of.
          items:
            $ref: "#/components/schemas/SharedGroup"
        mutualWorkoutPartners:
          type: array
          description: |
            Up to a small number of third players who have actually worked out
            (logged a co-workout in a shared group) with BOTH the viewer and
            this player. Optional — only populated on people-discovery surfaces.
          items:
            $ref: "#/components/schemas/MutualWorkoutPartner"

    PlayerSocialProfile:
      type: object
      required:
        - player
        - posts
        - followerCount
        - followingCount
        - isFollowing
        - memory
        - mutualFollowers
        - mutualFollowersTotal
        - mutualFollowing
        - mutualFollowingTotal
        - sharedGroups
        - mutualWorkoutPartners
      properties:
        player:
          $ref: "#/components/schemas/PlayerStub"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/FeedPost"
        followerCount:  { type: integer }
        followingCount: { type: integer }
        isFollowing:    { type: boolean }
        memory:
          oneOf:
            - $ref: "#/components/schemas/MemoryPost"
            - type: "null"
        mutualFollowers:
          type: array
          description: Up to 3 followers of this player that the viewer also follows.
          items:
            $ref: "#/components/schemas/PlayerStub"
        mutualFollowersTotal:
          type: integer
          description: Total number of mutual followers (not limited to the preview list).
        mutualFollowing:
          type: array
          description: Up to 3 accounts that both the viewer and this player follow.
          items:
            $ref: "#/components/schemas/PlayerStub"
        mutualFollowingTotal:
          type: integer
          description: Total number of accounts both the viewer and this player follow (not limited to the preview list).
        sharedGroups:
          type: array
          description: Groups that both the viewer and this player are members of.
          items:
            $ref: "#/components/schemas/SharedGroup"
        mutualWorkoutPartners:
          type: array
          description: |
            Up to 3 third players who have actually logged a co-workout with
            BOTH the viewer and this profile. Same trust signal surfaced on
            follower/following lists, social search, and the invite picker.
          items:
            $ref: "#/components/schemas/MutualWorkoutPartner"

    FollowersPage:
      type: object
      required: [players, total, nextCursor]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerStub"
        total:      { type: integer }
        nextCursor: { type: ["integer", "null"] }

    FollowingPage:
      type: object
      required: [players, total, nextCursor]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerStub"
        total:      { type: integer }
        nextCursor: { type: ["integer", "null"] }

    MutualFollowersPage:
      type: object
      required: [players, total, nextCursor]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerStub"
        total:      { type: integer }
        nextCursor: { type: ["integer", "null"] }

    MutualFollowingPage:
      type: object
      required: [players, total, nextCursor]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerStub"
        total:      { type: integer }
        nextCursor: { type: ["integer", "null"] }

    SharedGroup:
      type: object
      required: [id, name]
      properties:
        id:   { type: integer }
        name: { type: string }

    MemoryPost:
      type: object
      required: [post, memoryType, yearsAgo, label]
      properties:
        post:       { $ref: "#/components/schemas/FeedPost" }
        memoryType: { type: string }
        yearsAgo:   { type: integer }
        label:      { type: string }

    ViewResult:
      type: object
      required: [viewCount, counted]
      properties:
        viewCount: { type: integer }
        counted:   { type: boolean }

    PostViewSeries:
      type: object
      required: [window, windowHours, bucketHours, buckets, total]
      properties:
        window:
          type: string
          enum: [day, week, month]
          description: Which trend window was returned.
        windowHours: { type: integer, description: Total hours covered by the series (24 for day, 168 for week, 840 for month). }
        bucketHours: { type: integer, description: Hours per bucket (1 for day, 24 for week, 168 for month). }
        total:       { type: integer, description: Total views across the returned buckets }
        buckets:
          type: array
          description: Buckets ordered oldest first, zero-filled. 24 entries for `day`, 7 for `week`, 5 for `month`.
          items:
            type: object
            required: [hour, views]
            properties:
              hour:  { type: string, description: ISO timestamp at the start of the bucket (UTC). For `week`, this is the start of the day; for `month`, the start of the week. }
              views: { type: integer }

    PostInsight:
      type: object
      required: [id, content, postType, createdAt, viewCount, reactionCount, commentCount, repostCount, engagementScore, mediaUrl]
      properties:
        id:              { type: integer }
        content:         { type: string }
        mediaUrl:        { type: ["string", "null"] }
        postType:        { type: string }
        createdAt:       { type: string }
        viewCount:       { type: integer }
        reactionCount:   { type: integer }
        commentCount:    { type: integer }
        repostCount:     { type: integer }
        engagementScore: { type: integer }

    PostInsightsResponse:
      type: object
      required: [posts, totals]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostInsight"
        totals:
          type: object
          required: [postCount, viewCount, reactionCount, commentCount, repostCount]
          properties:
            postCount:     { type: integer }
            viewCount:     { type: integer }
            reactionCount: { type: integer }
            commentCount:  { type: integer }
            repostCount:   { type: integer }

    RepostInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }

    RepostResult:
      type: object
      required: [reposted, repostCount]
      properties:
        reposted:    { type: boolean }
        repostCount: { type: integer }

    PostMuteResult:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }

    ReactionResult:
      type: object
      required: [added, reactionType, reactionCounts]
      properties:
        added:        { type: boolean }
        reactionType: { type: string }
        reactionCounts:
          type: object
          properties:
            like:      { type: integer }
            encourage: { type: integer }
            fire:      { type: integer }
            flex:      { type: integer }

    ModerationError:
      type: object
      required: [error, flaggedTerms]
      properties:
        error:        { type: string }
        flaggedTerms:
          type: array
          items:
            type: string

    CreatePostInput:
      type: object
      required: [playerId, content]
      properties:
        playerId:   { type: integer }
        content:    { type: string, minLength: 1, maxLength: 500 }
        mediaUrl:   { type: string }
        postType:   { type: string }
        creatureId: { type: integer }
        metadata:
          description: |
            Structured payload that depends on `postType`. See `FeedPost.metadata`
            for the per-type shape (e.g. `tournament_win` carries `challengeId`,
            `challengeTitle`, `bracketSize`, `boostedXp`, `boostedCoins`;
            `evolution_reveal` carries `hatchlingId`, `hatchlingName`,
            `fromStage`, `toStage`, optional stage/realm/image fields, and
            `statDeltas`; `artifact_unlock` carries `artifactId`,
            `artifactName`, `artifactRarity`, `artifactLore`). The server
            validates this object against a per-postType Zod schema at
            write time — payloads with missing required keys or wrong
            types are rejected with `400`. For `tournament_win`, the
            server also verifies the authenticated player actually
            placed first (rank=1) in the referenced challenge. For
            `evolution_reveal`, the server enforces creature ownership
            and that `toStage > fromStage`.
          nullable: true
          type: object
          additionalProperties: true

    ShareArtifactToFriendInput:
      type: object
      required: [recipientId, artifactId, artifactName, artifactRarity]
      properties:
        recipientId:    { type: integer, description: "Player id to DM. Must be following the sender or be followed back." }
        artifactId:     { type: integer }
        artifactName:   { type: string }
        artifactRarity: { type: string }
        artifactLore:   { type: ["string", "null"] }
        message:        { type: ["string", "null"], description: "Optional short message attached to the share." }

    ShareArtifactToFriendResult:
      type: object
      required: [delivered, notificationId]
      properties:
        delivered:      { type: boolean }
        notificationId: { type: integer }

    ReactToPostInput:
      type: object
      required: [playerId, reactionType]
      properties:
        playerId:     { type: integer }
        reactionType: { type: string, enum: [like, encourage, fire, flex] }

    AddCommentInput:
      type: object
      required: [playerId, content]
      properties:
        playerId: { type: integer }
        content:  { type: string, minLength: 1, maxLength: 280 }

    EditCommentInput:
      type: object
      required: [playerId, content]
      properties:
        playerId: { type: integer }
        content:  { type: string, minLength: 1, maxLength: 280 }

    FollowInput:
      type: object
      required: [followerId, followeeId]
      properties:
        followerId: { type: integer }
        followeeId: { type: integer }

    OnboardingInput:
      type: object
      properties:
        ageRange:          { type: string, enum: [under13, teen, adult, senior] }
        fitnessLevel:      { type: string, enum: [beginner, intermediate, advanced, elite] }
        accessibilityMode: { type: string, enum: [none, child, senior, low_impact] }
        identityPath:      { type: string }

    IdentityPathMeta:
      type: object
      required: [label, icon, description, evolutionTheme]
      properties:
        label:         { type: string }
        icon:          { type: string }
        description:   { type: string }
        evolutionTheme: { type: string }

    TodayGoalProgress:
      type: object
      required: [goals, progress, fitnessLevel, suggestedActivities, xpMultiplier, streakAtRisk, lowImpactFirst]
      properties:
        goals:
          type: object
          properties:
            steps:       { type: integer }
            workouts:    { type: integer }
            durationMin: { type: integer }
        progress:
          type: object
          properties:
            steps:           { type: integer }
            workouts:        { type: integer }
            stepsPercent:    { type: integer }
            workoutsPercent: { type: integer }
        fitnessLevel:      { type: string }
        accessibilityMode: { type: string }
        identityPath:      { type: string, nullable: true }
        identityPathMeta:
          nullable: true
          $ref: "#/components/schemas/IdentityPathMeta"
        suggestedActivities:
          type: array
          items: { type: string }
        xpMultiplier:    { type: number }
        streakAtRisk:    { type: boolean }
        recoveryMessage: { type: string, nullable: true }
        lowImpactFirst:  { type: boolean }

    FamilyMember:
      type: object
      required: [id, username, level, currentStreak, weeklySteps]
      properties:
        id:           { type: integer }
        username:     { type: string }
        displayName:  { type: string, nullable: true }
        avatarUrl:    { type: string, nullable: true }
        level:        { type: integer }
        currentStreak: { type: integer }
        totalSteps:   { type: integer }
        weeklySteps:  { type: integer }
        fitnessLevel: { type: string }
        identityPath: { type: string, nullable: true }

    FamilyGroup:
      type: object
      required: [id, name, creatorId, inviteCode, createdAt, members, hasParentalPin]
      properties:
        id:            { type: integer }
        name:          { type: string }
        creatorId:     { type: integer }
        inviteCode:    { type: string }
        createdAt:     { type: string }
        hasParentalPin: { type: boolean }
        members:
          type: array
          items:
            $ref: "#/components/schemas/FamilyMember"

    CreateFamilyGroupInput:
      type: object
      required: [name]
      properties:
        name:       { type: string }
        parentalPin: { type: string }

    JoinFamilyGroupInput:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:  { type: string }
        parentalPin: { type: string }

    # ── Location & GPS Leaderboard Schemas ────────────────────────────────────
    LocationUpdateBody:
      type: object
      properties:
        latitude:     { type: number }
        longitude:    { type: number }
        city:         { type: string }
        state:        { type: string }
        county:       { type: string }
        country:      { type: string }
        countryCode:  { type: string }
        visibility:
          type: string
          enum: [exact, neighborhood, city, hidden]

    PlayerLocationRecord:
      type: object
      description: >
        Location record derived from reverse geocoding. Privacy-first design: raw GPS coordinates
        are NEVER stored — only city/state/county/country fields from Nominatim. The "nearby" scope
        uses same-city matching (no distance calculation required). Visibility mirrors
        players.locationVisibility and is the canonical privacy control.
      required: [id, playerId, visibility, updatedAt]
      properties:
        id:          { type: integer }
        playerId:    { type: integer }
        country:     { type: ["string", "null"] }
        countryCode: { type: ["string", "null"] }
        state:       { type: ["string", "null"] }
        county:      { type: ["string", "null"] }
        city:        { type: ["string", "null"] }
        visibility:  { type: string, enum: [exact, neighborhood, city, hidden] }
        updatedAt:   { type: string }

    ArtifactCollectorEntry:
      type: object
      required: [position, playerId, username, rank, artifactCount, rarityScore, isMe]
      properties:
        position:      { type: integer }
        playerId:      { type: integer }
        username:      { type: string }
        displayName:   { type: ["string", "null"] }
        avatarUrl:     { type: ["string", "null"] }
        rank:          { type: string }
        artifactCount: { type: integer }
        rarityScore:   { type: integer }
        rarestRarity:  { type: ["string", "null"] }
        rarestName:    { type: ["string", "null"] }
        rarestImageSlug: { type: ["string", "null"] }
        topArtifacts:
          type: array
          items:
            type: object
            required: [name, rarity, imageSlug]
            properties:
              name:      { type: string }
              rarity:    { type: string }
              imageSlug: { type: string }
        isMe:          { type: boolean }

    ScopedLeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, metricValue, metricLabel, isMe, currentStreak]
      properties:
        position:     { type: integer }
        playerId:     { type: integer }
        username:     { type: string }
        displayName:  { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        rank:         { type: string }
        metricValue:  { type: integer }
        metricLabel:  { type: string }
        isMe:         { type: boolean }
        currentStreak: { type: integer }

    ScopedLeaderboardResult:
      type: object
      required: [entries, scope, metric, locationRequired]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ScopedLeaderboardEntry"
        myEntry:
          oneOf:
            - $ref: "#/components/schemas/ScopedLeaderboardEntry"
            - type: "null"
        scope:            { type: string, enum: [world, country, state, county, city, nearby] }
        metric:           { type: string, enum: [xp, steps, workouts, battle_wins, streaks, artifacts] }
        totalInScope:     { type: integer }
        locationRequired: { type: boolean }
        locationContext:
          type: object
          nullable: true
          properties:
            city:    { type: ["string", "null"] }
            state:   { type: ["string", "null"] }
            country: { type: ["string", "null"] }

    LocalChallenge:
      type: object
      required: [id, title, scope, scopeValue, metric, targetValue, startAt, endAt, rewardXp, rewardCoins, participantCount, isJoined, isRelevant]
      properties:
        id:               { type: integer }
        title:            { type: string }
        description:      { type: ["string", "null"] }
        scope:            { type: string }
        scopeValue:       { type: string }
        metric:           { type: string }
        targetValue:      { type: integer }
        startAt:          { type: string }
        endAt:            { type: string }
        rewardXp:         { type: integer }
        rewardCoins:      { type: integer }
        rewardArtifactId: { type: ["integer", "null"] }
        participantCount: { type: integer }
        isJoined:         { type: boolean }
        isRelevant:       { type: boolean }

    LocalChallengeLeaderboardEntry:
      type: object
      required: [rank, playerId, username, level, currentValue, isMe]
      properties:
        rank:         { type: integer }
        playerId:     { type: integer }
        username:     { type: string }
        displayName:  { type: ["string", "null"] }
        avatarUrl:    { type: ["string", "null"] }
        level:        { type: integer }
        currentValue: { type: integer }
        completedAt:  { type: ["string", "null"] }
        isMe:         { type: boolean }

    LocalChallengeLeaderboardResult:
      type: object
      required: [challenge, entries]
      properties:
        challenge:
          $ref: "#/components/schemas/LocalChallenge"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LocalChallengeLeaderboardEntry"
        myEntry:
          oneOf:
            - $ref: "#/components/schemas/LocalChallengeLeaderboardEntry"
            - type: "null"

    # ── Nutrition ──────────────────────────────────────────────────────────
    NutritionMacroBreakdown:
      type: object
      required: [calories, protein, carbs, fat]
      properties:
        calories: { type: number }
        protein:  { type: number }
        carbs:    { type: number }
        fat:      { type: number }

    NutritionTopFood:
      type: object
      required: [name, emoji, count]
      properties:
        name:  { type: string }
        emoji: { type: string }
        count: { type: integer }

    NutritionWeeklySummary:
      type: object
      required:
        - weekStart
        - daysLogged
        - mealsLogged
        - averages
        - targets
        - gaps
        - ratios
        - adherence
        - topFoods
        - hatchlingMood
        - hatchlingEmoji
        - aiTip
        - aiSource
      properties:
        weekStart:   { type: string, format: date-time }
        daysLogged:  { type: integer }
        mealsLogged: { type: integer }
        averages: { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        targets:  { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        gaps:     { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        ratios:   { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        adherence: { type: number }
        topFoods:
          type: array
          items:
            $ref: "#/components/schemas/NutritionTopFood"
        hatchlingMood:
          type: string
          enum: [thriving, happy, okay, hungry, sad]
        hatchlingEmoji: { type: string }
        aiTip:          { type: string }
        aiSource:
          type: string
          enum: [ai, fallback]

    MealAuthor:
      type: object
      required: [id, username, displayName]
      properties:
        id:          { type: integer }
        username:    { type: string }
        displayName: { type: ["string", "null"] }

    MealPost:
      type: object
      required:
        - id
        - playerId
        - emoji
        - name
        - tag
        - aiAnalyzed
        - likesCount
        - commentsCount
        - createdAt
        - liked
        - author
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        imageUrl:      { type: ["string", "null"] }
        emoji:         { type: string }
        name:          { type: string }
        tag:           { type: string }
        description:   { type: ["string", "null"] }
        calories:      { type: ["integer", "null"] }
        proteinG:      { type: ["number", "null"] }
        carbsG:        { type: ["number", "null"] }
        fatG:          { type: ["number", "null"] }
        aiAnalyzed:    { type: boolean }
        likesCount:    { type: integer }
        commentsCount: { type: integer }
        createdAt:     { type: string }
        liked:         { type: boolean }
        author:
          $ref: "#/components/schemas/MealAuthor"

    MealPostFeedPage:
      type: object
      required: [mode, fellBackToDiscover, posts]
      properties:
        mode:
          type: string
          enum: [feed, discover]
        fellBackToDiscover: { type: boolean }
        posts:
          type: array
          items:
            $ref: "#/components/schemas/MealPost"

    CreateMealPostInput:
      type: object
      required: [playerId, name]
      properties:
        playerId:     { type: integer }
        name:         { type: string, minLength: 1, maxLength: 100 }
        emoji:        { type: string }
        tag:          { type: string }
        description:  { type: string }
        imageUrl:
          type: string
          description: Object path returned by `/storage/uploads/request-url`. Must start with `/objects/`.
          maxLength: 500
        uploadToken:
          type: string
          description: HMAC token issued alongside the presigned upload URL. Required when `imageUrl` is provided.
          minLength: 1
          maxLength: 256
        calories:     { type: number }
        proteinG:     { type: number }
        carbsG:       { type: number }
        fatG:         { type: number }
        aiAnalyzed:   { type: boolean }
        qualityScore: { type: integer, minimum: 1, maximum: 10 }

    MealHatchlingStatChange:
      type: object
      required: [hatchlingId, hatchlingName, happinessDelta, energyDelta, happiness, energy, buffActive, imageUrl, realm]
      properties:
        hatchlingId:    { type: integer }
        hatchlingName:  { type: string }
        happinessDelta: { type: integer }
        energyDelta:    { type: integer }
        happiness:      { type: integer }
        energy:         { type: integer }
        buffActive:     { type: boolean }
        imageUrl:       { type: ["string", "null"] }
        realm:          { type: ["string", "null"] }

    MealDailyMacroRewardHatchling:
      type: object
      required: [hatchlingId, hatchlingName, bondDelta, xpDelta]
      properties:
        hatchlingId:   { type: integer }
        hatchlingName: { type: string }
        bondDelta:     { type: integer }
        xpDelta:       { type: integer }

    MealDailyMacroReward:
      type: object
      required:
        - currentStreak
        - longestStreak
        - playerXpDelta
        - playerCoinsDelta
        - hatchlingReward
        - goal
        - totals
        - target
      properties:
        currentStreak:    { type: integer }
        longestStreak:    { type: integer }
        playerXpDelta:    { type: integer }
        playerCoinsDelta: { type: integer }
        hatchlingReward:
          oneOf:
            - $ref: "#/components/schemas/MealDailyMacroRewardHatchling"
            - type: "null"
        goal:   { type: string }
        totals: { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        target: { $ref: "#/components/schemas/NutritionMacroBreakdown" }

    CreateMealPostResult:
      type: object
      required:
        - id
        - playerId
        - emoji
        - name
        - tag
        - aiAnalyzed
        - likesCount
        - commentsCount
        - createdAt
        - newBadges
        - hatchlingStatChange
        - dailyMacroReward
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        imageUrl:      { type: ["string", "null"] }
        emoji:         { type: string }
        name:          { type: string }
        tag:           { type: string }
        description:   { type: ["string", "null"] }
        calories:      { type: ["integer", "null"] }
        proteinG:      { type: ["number", "null"] }
        carbsG:        { type: ["number", "null"] }
        fatG:          { type: ["number", "null"] }
        aiAnalyzed:    { type: boolean }
        likesCount:    { type: integer }
        commentsCount: { type: integer }
        createdAt:     { type: string }
        newBadges:
          type: array
          items: { type: string }
        hatchlingStatChange:
          oneOf:
            - $ref: "#/components/schemas/MealHatchlingStatChange"
            - type: "null"
        dailyMacroReward:
          oneOf:
            - $ref: "#/components/schemas/MealDailyMacroReward"
            - type: "null"

    UpdateMealPostInput:
      type: object
      description: |
        All fields are optional. Send only what you want to change. Pass `null`
        to clear `imageUrl`, `description`, or any macro. `uploadToken` is
        required when changing `imageUrl` to a new `/objects/` path.
      properties:
        name:        { type: string, minLength: 1, maxLength: 100 }
        emoji:       { type: string, maxLength: 16 }
        tag:         { type: string, maxLength: 64 }
        description: { type: ["string", "null"], maxLength: 2000 }
        imageUrl:
          type: ["string", "null"]
          description: Object path returned by `/storage/uploads/request-url`, or null to remove the image. Must start with `/objects/` when non-null.
          maxLength: 500
        uploadToken:
          type: string
          description: HMAC token issued alongside the presigned upload URL. Required when `imageUrl` is being changed to a new value.
          minLength: 1
          maxLength: 256
        calories: { type: ["number", "null"] }
        proteinG: { type: ["number", "null"] }
        carbsG:   { type: ["number", "null"] }
        fatG:     { type: ["number", "null"] }

    MealPostRecord:
      type: object
      description: Raw meal post row as stored in the database, without viewer-specific fields.
      required:
        - id
        - playerId
        - emoji
        - name
        - tag
        - aiAnalyzed
        - likesCount
        - commentsCount
        - createdAt
      properties:
        id:            { type: integer }
        playerId:      { type: integer }
        imageUrl:      { type: ["string", "null"] }
        emoji:         { type: string }
        name:          { type: string }
        tag:           { type: string }
        description:   { type: ["string", "null"] }
        calories:      { type: ["integer", "null"] }
        proteinG:      { type: ["number", "null"] }
        carbsG:        { type: ["number", "null"] }
        fatG:          { type: ["number", "null"] }
        aiAnalyzed:    { type: boolean }
        likesCount:    { type: integer }
        commentsCount: { type: integer }
        createdAt:     { type: string }

    DeleteMealPostResult:
      type: object
      required: [deleted, id]
      properties:
        deleted: { type: boolean }
        id:      { type: integer }

    MealLikeResult:
      type: object
      required: [liked, likesCount]
      properties:
        liked:      { type: boolean }
        likesCount: { type: integer }

    MealCommentAuthor:
      type: object
      required: [username, displayName]
      properties:
        username:    { type: string }
        displayName: { type: ["string", "null"] }

    MealComment:
      type: object
      required: [id, mealPostId, playerId, content, createdAt, author]
      properties:
        id:         { type: integer }
        mealPostId: { type: integer }
        playerId:   { type: integer }
        content:    { type: string }
        createdAt:  { type: string }
        author:
          $ref: "#/components/schemas/MealCommentAuthor"

    AddMealCommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }

    NutritionAnalyzeInput:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 3, maxLength: 500 }

    NutritionAnalyzeResult:
      type: object
      properties:
        calories:      { type: number }
        protein_g:     { type: number }
        carbs_g:       { type: number }
        fat_g:         { type: number }
        quality_score: { type: integer, minimum: 1, maximum: 10 }
        suggestions:
          type: array
          items: { type: string }

    NutritionAnalyzeImageInput:
      type: object
      required: [imageUrl, uploadToken]
      properties:
        imageUrl:    { type: string, pattern: "^/objects/", maxLength: 500 }
        uploadToken: { type: string, minLength: 1, maxLength: 256 }

    NutritionAnalyzeImageResult:
      type: object
      required: [recognized]
      properties:
        recognized:    { type: boolean }
        food_name:     { type: string }
        description:   { type: string }
        calories:      { type: number }
        protein_g:     { type: number }
        carbs_g:       { type: number }
        fat_g:         { type: number }
        quality_score: { type: integer, minimum: 1, maximum: 10 }
        suggestions:
          type: array
          items: { type: string }

    NutritionChallenge:
      type: object
      required:
        - key
        - name
        - description
        - target
        - unit
        - xpReward
        - coinsReward
        - badge
        - icon
        - currentValue
        - completedAt
      properties:
        key:          { type: string }
        name:         { type: string }
        description:  { type: string }
        target:       { type: integer }
        unit:         { type: string }
        xpReward:     { type: integer }
        coinsReward:  { type: integer }
        badge:        { type: string }
        icon:         { type: string }
        currentValue: { type: integer }
        completedAt:  { type: ["string", "null"] }

    ChallengeProgressInput:
      type: object
      required: [playerId]
      properties:
        playerId:  { type: integer }
        increment: { type: integer, default: 1 }

    ChallengeProgressResult:
      type: object
      required: [currentValue, target]
      properties:
        currentValue:     { type: integer }
        target:           { type: integer }
        isComplete:       { type: boolean }
        alreadyCompleted: { type: boolean }
        newBadge:         { type: ["string", "null"] }

    NutritionMacroTarget:
      type: object
      required: [goal, calories, protein, carbs, fat, tip, aiPersonalized]
      properties:
        goal:           { type: string }
        calories:       { type: number }
        protein:        { type: number }
        carbs:          { type: number }
        fat:            { type: number }
        tip:            { type: string }
        aiPersonalized: { type: boolean }

    NutritionStreakToday:
      type: object
      required: [totals, target, tolerance]
      properties:
        totals:    { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        target:    { $ref: "#/components/schemas/NutritionMacroBreakdown" }
        tolerance: { type: number }

    NutritionStreak:
      type: object
      required: [currentStreak, longestStreak, lastHitDate, hitToday, today, weekly]
      properties:
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        lastHitDate:   { type: ["string", "null"] }
        hitToday:      { type: boolean }
        today:
          $ref: "#/components/schemas/NutritionStreakToday"
        weekly:
          $ref: "#/components/schemas/NutritionWeeklyStreak"

    NutritionWeeklyStreak:
      type: object
      description: |
        Per-day hit/miss history for the last 7 UTC days (oldest first, today last)
        plus a summary of bond/XP/coins earned from daily macro-target hits this week.
      required: [days, rewards]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/NutritionWeeklyDay"
        rewards:
          $ref: "#/components/schemas/NutritionWeeklyRewards"

    NutritionWeeklyDay:
      type: object
      required: [date, status]
      properties:
        date:   { type: string, description: "UTC date in YYYY-MM-DD." }
        status: { type: string, enum: [hit, miss, no_data] }

    NutritionWeeklyRewards:
      type: object
      required: [hitCount, xp, coins, bond]
      properties:
        hitCount: { type: integer, description: "Number of macro-target hit days in the last 7 UTC days." }
        xp:       { type: integer, description: "Total bonus player XP earned from macro-target hits this week." }
        coins:    { type: integer, description: "Total bonus coins earned from macro-target hits this week." }
        bond:     { type: integer, description: "Total Hatchling bond/friendship gained from macro-target hits this week." }

    NutritionMacroGaps:
      type: object
      required: [calories, protein, carbs, fat]
      properties:
        calories: { type: number }
        protein:  { type: number }
        carbs:    { type: number }
        fat:      { type: number }

    NutritionMealIdea:
      type: object
      required: [name, emoji, description, summary, servings, fillsMacro, calories, proteinG, carbsG, fatG, source]
      properties:
        name:        { type: string }
        emoji:       { type: string }
        description: { type: string }
        summary:     { type: string, description: "Short tag like '~25g protein, low carb'." }
        servings:    { type: number }
        fillsMacro:  { type: string, enum: [protein, carbs, fat, calories] }
        calories:    { type: number }
        proteinG:    { type: number }
        carbsG:      { type: number }
        fatG:        { type: number }
        source:
          type: string
          enum: [ai, catalog]
          description: Which path produced this idea — `ai` from the AI nutritionist, `catalog` from the static fallback.
        tip:
          type: string
          description: Optional one-line coaching tip from the AI nutritionist.
        tags:
          type: array
          items: { type: string }
          description: Optional dietary/style tags (e.g. vegan, high-protein) the idea respects.

    NutritionNextMealSuggestion:
      type: object
      required: [hasGap, primaryMacro, gaps, suggestion, tolerance, goal]
      properties:
        hasGap:       { type: boolean }
        primaryMacro:
          type: ["string", "null"]
          enum: [protein, carbs, fat, calories, null]
        gaps:         { $ref: "#/components/schemas/NutritionMacroGaps" }
        suggestion:
          oneOf:
            - { $ref: "#/components/schemas/NutritionMealIdea" }
            - { type: "null" }
        tolerance:    { type: number }
        goal:         { type: string }
        usedAi:
          type: boolean
          description: True when AI personalization was attempted for this request (regardless of whether it succeeded).
        aiError:
          type: string
          description: Present when AI was attempted but failed; the catalog fallback was used.
        savedPantry:
          type: string
          description: |
            The player's saved free-text pantry notes (empty string when nothing
            is saved). Lets the UI pre-fill the pantry input without a separate
            request so the value follows the player across devices.

    NutritionRecapSendResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }

    NutritionRecapPreview:
      type: object
      required: [title, body, recap]
      properties:
        title: { type: string }
        body:  { type: string }
        recap:
          type: object
          additionalProperties: true

    PhysiqueGoalInput:
      type: object
      required: [playerId, physiqueGoal]
      properties:
        playerId:     { type: integer }
        physiqueGoal: { type: string }

    PhysiqueGoalResult:
      type: object
      required: [physiqueGoal]
      properties:
        physiqueGoal: { type: string }

    PantryNotesInput:
      type: object
      required: [pantryNotes]
      properties:
        pantryNotes:
          type: string
          maxLength: 300
          description: Free-text pantry contents. Empty string clears the saved value.

    PantryNotesResult:
      type: object
      required: [pantryNotes]
      properties:
        pantryNotes:
          type: string
          description: The saved pantry text after the update (empty string when cleared).

    # ── Battle (REST request/response schemas) ──────────────────────────────
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    BattleQueueJoinBody:
      type: object
      properties:
        # Optional — when omitted, the server uses the caller's active partner
        # Hatchling (players.activeHatchlingId, with a most-recent fallback).
        hatchlingId: { type: integer }
        mode:        { type: string, enum: [casual, ranked], default: casual }

    BattleQueueJoinResponse:
      type: object
      required: [ok, message]
      properties:
        ok:      { type: boolean }
        message: { type: string }

    BattleWsTokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }

    BattleHistoryEntry:
      type: object
      description: |
        A row from `/battles/history`. Mirrors the underlying battle row plus
        viewer-perspective fields. `winnerId` is `null` for draws or unresolved
        battles, and `0` when a bot won.
      required:
        - id
        - player1Id
        - player2Id
        - winnerId
        - hatchling1Id
        - hatchling2Id
        - xpAwarded
        - coinsAwarded
        - battleMode
        - eloChange
        - createdAt
        - isViewer1
        - viewerWon
        - opponent
        - opponentPlayerId
        - opponentUsername
        - opponentDisplayName
        - myHatchling
        - opponentHatchling
      properties:
        id:                  { type: integer }
        player1Id:           { type: integer }
        player2Id:           { type: ["integer", "null"] }
        winnerId:            { type: ["integer", "null"] }
        hatchling1Id:        { type: integer }
        hatchling2Id:        { type: ["integer", "null"] }
        turnsJson:
          description: Raw turn log (array of BattleTurnResult-shaped rows). Untyped here because legacy rows may be `null`.
          nullable: true
        xpAwarded:           { type: integer }
        coinsAwarded:        { type: integer }
        battleMode:          { type: string }
        eloChange:           { type: integer }
        createdAt:           { type: string, format: date-time }
        isViewer1:           { type: boolean }
        viewerWon:           { type: boolean }
        opponent:            { type: string, description: "Opponent display name, or `Bot` for bot battles." }
        opponentPlayerId:    { type: ["integer", "null"] }
        opponentUsername:    { type: ["string", "null"] }
        opponentDisplayName: { type: ["string", "null"] }
        myHatchling:         { type: ["string", "null"] }
        opponentHatchling:   { type: ["string", "null"] }

    BattleDetail:
      type: object
      description: Full battle row including raw turn log, returned by `GET /battles/{id}`.
      required:
        - id
        - player1Id
        - player2Id
        - winnerId
        - hatchling1Id
        - hatchling2Id
        - xpAwarded
        - coinsAwarded
        - battleMode
        - eloChange
        - createdAt
      properties:
        id:           { type: integer }
        player1Id:    { type: integer }
        player2Id:    { type: ["integer", "null"] }
        winnerId:     { type: ["integer", "null"] }
        hatchling1Id: { type: integer }
        hatchling2Id: { type: ["integer", "null"] }
        turnsJson:
          description: Raw turn log (array of BattleTurnResult-shaped rows). May be `null` on legacy rows.
          nullable: true
        xpAwarded:    { type: integer }
        coinsAwarded: { type: integer }
        battleMode:   { type: string }
        eloChange:    { type: integer }
        createdAt:    { type: string, format: date-time }

    BattleRival:
      type: object
      required:
        - opponentId
        - opponentUsername
        - opponentDisplayName
        - totalBattles
        - wins
        - losses
        - draws
        - lastBattleAt
        - lastBattleId
        - lastEloChange
        - streakType
        - streakCount
      properties:
        opponentId:          { type: integer }
        opponentUsername:    { type: ["string", "null"] }
        opponentDisplayName: { type: ["string", "null"] }
        totalBattles:        { type: integer }
        wins:                { type: integer }
        losses:              { type: integer }
        draws:               { type: integer }
        lastBattleAt:        { type: string, format: date-time }
        lastBattleId:        { type: integer }
        lastEloChange:       { type: integer, description: "ELO swing from the viewer's most recent battle vs this rival." }
        streakType:          { type: string, enum: [W, L, D], description: "Outcome type of the current head-to-head streak." }
        streakCount:         { type: integer, description: "Length of the current head-to-head streak." }

    BattleRivalDetailEntry:
      type: object
      description: |
        A single battle in the head-to-head log returned by
        `GET /battles/rivals/{opponentId}`. All fields are from the
        authenticated viewer's perspective.
      required:
        - id
        - createdAt
        - battleMode
        - outcome
        - viewerWon
        - myHatchlingId
        - myHatchlingName
        - opponentHatchlingId
        - opponentHatchlingName
        - eloChange
        - xpAwarded
        - coinsAwarded
      properties:
        id:                    { type: integer }
        createdAt:             { type: string, format: date-time }
        battleMode:            { type: string }
        outcome:
          type: string
          enum: [win, loss, draw]
        viewerWon:             { type: boolean }
        myHatchlingId:         { type: ["integer", "null"] }
        myHatchlingName:       { type: ["string", "null"] }
        opponentHatchlingId:   { type: ["integer", "null"] }
        opponentHatchlingName: { type: ["string", "null"] }
        eloChange:             { type: integer, description: "Signed ELO delta from the viewer's perspective." }
        xpAwarded:             { type: integer }
        coinsAwarded:          { type: integer }

    BattleRivalDetail:
      type: object
      description: |
        Aggregated head-to-head record plus the full reverse-chronological
        battle log between the authenticated viewer and a single opponent.
        Returned by `GET /battles/rivals/{opponentId}`.
      required:
        - opponentId
        - opponentUsername
        - opponentDisplayName
        - opponentBattleElo
        - totalBattles
        - wins
        - losses
        - draws
        - viewerEloDelta
        - lastBattleId
        - lastBattleAt
        - battles
      properties:
        opponentId:          { type: integer }
        opponentUsername:    { type: ["string", "null"] }
        opponentDisplayName: { type: ["string", "null"] }
        opponentBattleElo:   { type: integer }
        totalBattles:        { type: integer }
        wins:                { type: integer }
        losses:              { type: integer }
        draws:               { type: integer }
        viewerEloDelta:      { type: integer, description: "Net ELO swing across all head-to-head battles, from the viewer's perspective." }
        lastBattleId:        { type: ["integer", "null"] }
        lastBattleAt:        { type: ["string", "null"], format: date-time }
        battles:
          type: array
          items:
            $ref: "#/components/schemas/BattleRivalDetailEntry"

    BattleRematchCreateBody:
      type: object
      required: [battleId, hatchlingId]
      properties:
        battleId:    { type: integer }
        hatchlingId: { type: integer }

    BattleRematchInvite:
      type: object
      required:
        - id
        - fromPlayerId
        - toPlayerId
        - fromDisplayName
        - toDisplayName
        - mode
        - fromHatchlingId
        - fromHatchlingName
        - fromBattleId
        - status
        - createdAt
        - expiresAt
      properties:
        id:                 { type: string }
        fromPlayerId:       { type: integer }
        toPlayerId:         { type: integer }
        fromDisplayName:    { type: ["string", "null"] }
        toDisplayName:      { type: ["string", "null"] }
        mode:               { type: string, enum: [casual, ranked] }
        fromHatchlingId:    { type: integer }
        fromHatchlingName:  { type: string }
        fromBattleId:       { type: integer }
        status:             { type: string, enum: [pending, accepted, declined, expired, consumed] }
        createdAt:          { type: string, format: date-time }
        expiresAt:          { type: string, format: date-time }

    BattleRematchAcceptResponse:
      type: object
      required: [ok, inviteId]
      properties:
        ok:       { type: boolean }
        inviteId: { type: string }

    BattleEloLeaderboardEntry:
      type: object
      required:
        - rank
        - playerId
        - username
        - displayName
        - battleElo
        - totalBattleWins
        - level
      properties:
        rank:            { type: integer }
        playerId:        { type: integer }
        username:        { type: ["string", "null"] }
        displayName:     { type: ["string", "null"] }
        battleElo:       { type: integer }
        totalBattleWins: { type: integer }
        level:           { type: integer }

    # ── Battle (live WebSocket payload schemas) ─────────────────────────────
    # These schemas mirror the fighter / battle state structures pushed over
    # the live battle WebSocket (`/api/ws/battle`). They are documented here so
    # generated TS types and Zod schemas stay in sync with the server.
    EquippedArtifactSlot:
      type: object
      required: [id, name, rarity, imageSlug, slot, isPowered, evolutionStage]
      properties:
        id:             { type: integer }
        name:           { type: string }
        rarity:         { type: string }
        imageSlug:      { type: string }
        slot:           { type: string, enum: [major, minor] }
        isPowered:      { type: boolean }
        evolutionStage: { type: integer }

    FighterState:
      type: object
      required:
        - playerId
        - playerUsername
        - playerDisplayName
        - hatchlingId
        - hatchlingName
        - hatchlingLevel
        - realm
        - maxHp
        - currentHp
        - maxEnergy
        - energy
        - speed
        - defenseBonus
        - specialCooldown
        - itemUsed
        - isBot
        - equippedArtifacts
        - artifactPowerScore
      properties:
        playerId:
          type: integer
          description: Player id of the fighter's owner. `0` indicates a bot opponent with no real player.
        playerUsername:
          type: ["string", "null"]
          description: Username of the fighter's owner, used to display opponent identity. `null` for bots.
        playerDisplayName:
          type: ["string", "null"]
          description: Display name of the fighter's owner. Falls back to `playerUsername` in the UI when null. `null` for bots.
        hatchlingId:        { type: integer }
        hatchlingName:      { type: string }
        hatchlingLevel:     { type: integer }
        realm:              { type: string }
        maxHp:              { type: integer }
        currentHp:          { type: integer }
        maxEnergy:          { type: integer }
        energy:             { type: integer }
        speed:              { type: integer }
        defenseBonus:       { type: integer }
        specialCooldown:    { type: integer }
        itemUsed:           { type: boolean }
        isBot:              { type: boolean }
        equippedArtifacts:
          type: array
          items: { $ref: "#/components/schemas/EquippedArtifactSlot" }
        artifactPowerScore: { type: integer }

    BattleTurnResult:
      type: object
      required:
        - turnNumber
        - actingSlot
        - move
        - damage
        - healing
        - isCrit
        - isSuper
        - p1HpAfter
        - p2HpAfter
        - p1EnergyAfter
        - p2EnergyAfter
      properties:
        turnNumber:    { type: integer }
        actingSlot:    { type: integer, enum: [1, 2] }
        move:          { type: string, enum: [basic_attack, special_move, defend, use_item] }
        damage:        { type: integer }
        healing:       { type: integer }
        isCrit:        { type: boolean }
        isSuper:       { type: boolean }
        p1HpAfter:     { type: integer }
        p2HpAfter:     { type: integer }
        p1EnergyAfter: { type: integer }
        p2EnergyAfter: { type: integer }

    BattleState:
      type: object
      required:
        - battleId
        - mode
        - fighter1
        - fighter2
        - currentSlot
        - turnNumber
        - phase
        - winner
        - turns
      properties:
        battleId:    { type: integer }
        mode:        { type: string, enum: [casual, ranked] }
        fighter1:    { $ref: "#/components/schemas/FighterState" }
        fighter2:    { $ref: "#/components/schemas/FighterState" }
        currentSlot: { type: integer, enum: [1, 2] }
        turnNumber:  { type: integer }
        phase:       { type: string, enum: [lobby, active, ended] }
        winner:
          type: ["integer", "null"]
          enum: [0, 1, 2, null]
          description: Winning slot (1 or 2), `0` for a draw, `null` while the battle is still ongoing.
        turns:
          type: array
          items: { $ref: "#/components/schemas/BattleTurnResult" }

    # ── Battle live WebSocket message envelopes ─────────────────────────────
    # These shapes are the messages exchanged over `/api/ws/battle`. The
    # server validates inbound (client→server) messages with the generated
    # Zod schema for `BattleWsClientMessage`; the hatchup frontend validates
    # inbound (server→client) messages with the generated Zod schema for
    # `BattleWsServerMessage`. Each variant is discriminated by `type`.

    # Client → Server
    BattleWsJoinQueueMessage:
      type: object
      required: [type, hatchlingId, mode]
      properties:
        type:            { type: string, enum: [join_queue] }
        hatchlingId:     { type: integer }
        mode:            { type: string, enum: [casual, ranked] }
        rematchInviteId: { type: string }
    BattleWsLeaveQueueMessage:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [leave_queue] }
    BattleWsPlayerMoveMessage:
      type: object
      required: [type, battleId, move]
      properties:
        type:     { type: string, enum: [player_move] }
        battleId: { type: integer }
        move:     { type: string, enum: [basic_attack, special_move, defend, use_item] }
    BattleWsReconnectMessage:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [reconnect] }
    BattleWsClientMessage:
      oneOf:
        - $ref: "#/components/schemas/BattleWsJoinQueueMessage"
        - $ref: "#/components/schemas/BattleWsLeaveQueueMessage"
        - $ref: "#/components/schemas/BattleWsPlayerMoveMessage"
        - $ref: "#/components/schemas/BattleWsReconnectMessage"
      discriminator:
        propertyName: type
        mapping:
          join_queue:  "#/components/schemas/BattleWsJoinQueueMessage"
          leave_queue: "#/components/schemas/BattleWsLeaveQueueMessage"
          player_move: "#/components/schemas/BattleWsPlayerMoveMessage"
          reconnect:   "#/components/schemas/BattleWsReconnectMessage"

    # Server → Client
    BattleWsQueueJoinedMessage:
      type: object
      required: [type, position, mode, rematchInviteId]
      properties:
        type:            { type: string, enum: [queue_joined] }
        position:        { type: integer }
        mode:            { type: string, enum: [casual, ranked] }
        rematchInviteId: { type: ["string", "null"] }
    BattleWsQueueLeftMessage:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [queue_left] }
    BattleWsBattleStartMessage:
      type: object
      required: [type, battleId, slot1PlayerId, slot2PlayerId, state, yourSlot]
      properties:
        type:          { type: string, enum: [battle_start] }
        battleId:      { type: integer }
        slot1PlayerId: { type: integer }
        slot2PlayerId:
          type: integer
          description: Player id of slot 2, or `0` when slot 2 is a bot.
        state:         { $ref: "#/components/schemas/BattleState" }
        yourSlot:      { type: integer, enum: [1, 2] }
    BattleWsBattleStateMessage:
      type: object
      required: [type, battleId, state]
      properties:
        type:     { type: string, enum: [battle_state] }
        battleId: { type: integer }
        state:    { $ref: "#/components/schemas/BattleState" }
    BattleWsRewards:
      type: object
      required: [xp, coins]
      properties:
        xp:    { type: integer }
        coins: { type: integer }
    BattleWsArtifactXpGain:
      type: object
      required: [artifactId, newStage, xpGained]
      properties:
        artifactId: { type: integer }
        newStage:   { type: integer }
        xpGained:   { type: integer }
    BattleWsHatchlingXp:
      type: object
      required: [xpDelta, prevLevel, newLevel, newXp]
      properties:
        xpDelta:   { type: integer, description: "XP awarded to the Pal." }
        prevLevel: { type: integer, description: "Pal level before XP was applied." }
        newLevel:  { type: integer, description: "Pal level after XP was applied." }
        newXp:     { type: integer, description: "Pal total XP after the reward." }
    BattleWsBattleEndMessage:
      type: object
      required: [type, battleId, winner, rewards, eloChange, artifactXp, state]
      properties:
        type:       { type: string, enum: [battle_end] }
        battleId:   { type: integer }
        winner:
          type: ["integer", "null"]
          enum: [0, 1, 2, null]
          description: Winning slot (1 or 2), `0` for a draw, `null` if the battle ended without a resolved winner.
        rewards:    { $ref: "#/components/schemas/BattleWsRewards" }
        eloChange:  { type: integer }
        artifactXp:
          type: array
          items: { $ref: "#/components/schemas/BattleWsArtifactXpGain" }
        state:      { $ref: "#/components/schemas/BattleState" }
        hatchlingXp:
          $ref: "#/components/schemas/BattleWsHatchlingXp"
          description: "Pal XP delta and level progression for the receiving player's Hatchling."
        winnerHpPct:
          type: number
          description: "Winner's remaining HP as a fraction of their max HP (0–1). Omitted for draws or no-winner outcomes."
    BattleWsReconnectedMessage:
      type: object
      required: [type, battleId, yourSlot, state]
      properties:
        type:     { type: string, enum: [reconnected] }
        battleId: { type: integer }
        yourSlot: { type: integer, enum: [1, 2] }
        state:    { $ref: "#/components/schemas/BattleState" }
    BattleWsErrorMessage:
      type: object
      required: [type, message]
      properties:
        type:    { type: string, enum: [error] }
        message: { type: string }
        error:
          type: string
          description: Machine-readable error code, e.g. `battle_daily_cap_reached`.
        cap:
          type: integer
          description: Free-tier daily cap value, included with `battle_daily_cap_reached` errors.
    BattleWsServerMessage:
      oneOf:
        - $ref: "#/components/schemas/BattleWsQueueJoinedMessage"
        - $ref: "#/components/schemas/BattleWsQueueLeftMessage"
        - $ref: "#/components/schemas/BattleWsBattleStartMessage"
        - $ref: "#/components/schemas/BattleWsBattleStateMessage"
        - $ref: "#/components/schemas/BattleWsBattleEndMessage"
        - $ref: "#/components/schemas/BattleWsReconnectedMessage"
        - $ref: "#/components/schemas/BattleWsErrorMessage"
      discriminator:
        propertyName: type
        mapping:
          queue_joined: "#/components/schemas/BattleWsQueueJoinedMessage"
          queue_left:   "#/components/schemas/BattleWsQueueLeftMessage"
          battle_start: "#/components/schemas/BattleWsBattleStartMessage"
          battle_state: "#/components/schemas/BattleWsBattleStateMessage"
          battle_end:   "#/components/schemas/BattleWsBattleEndMessage"
          reconnected:  "#/components/schemas/BattleWsReconnectedMessage"
          error:        "#/components/schemas/BattleWsErrorMessage"

    # ── Appeals ─────────────────────────────────────────────────────────────
    Appeal:
      type: object
      required: [id, playerId, message, status, reviewerNote, createdAt, resolvedAt]
      properties:
        id:           { type: integer }
        playerId:     { type: integer }
        message:      { type: string }
        status:
          type: string
          enum: [pending, approved, denied]
        reviewerId:   { type: ["integer", "null"] }
        reviewerNote: { type: ["string", "null"] }
        createdAt:    { type: string, format: date-time }
        resolvedAt:   { type: ["string", "null"], format: date-time }
    MyAppealResponse:
      type: object
      required: [appeal]
      properties:
        appeal:
          oneOf:
            - $ref: "#/components/schemas/Appeal"
            - type: "null"
    AppealSubmitBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 1000
          description: Why the suspension should be reconsidered.
    AppealEnvelope:
      type: object
      required: [appeal]
      properties:
        appeal:
          $ref: "#/components/schemas/Appeal"
    AppealErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Machine-readable error code (e.g. `not_suspended`,
            `invalid_message`, `appeal_already_resolved`).
        message: { type: string }
    AppealConflictEnvelope:
      type: object
      required: [error]
      properties:
        error:   { type: string, enum: [appeal_already_open] }
        message: { type: string }
        appeal:
          $ref: "#/components/schemas/Appeal"
    AdminAppealPlayer:
      type: object
      required: [id, username, displayName, avatarUrl, isSuspended, suspendedAt]
      properties:
        id:            { type: integer }
        username:      { type: string }
        displayName:   { type: ["string", "null"] }
        avatarUrl:     { type: ["string", "null"] }
        isSuspended:   { type: boolean }
        suspendedAt:   { type: ["string", "null"], format: date-time }
    AdminAppeal:
      allOf:
        - $ref: "#/components/schemas/Appeal"
        - type: object
          required: [player]
          properties:
            player:
              oneOf:
                - $ref: "#/components/schemas/AdminAppealPlayer"
                - type: "null"
    AppealResolveBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, denied]
        reviewerNote:
          type: ["string", "null"]
          maxLength: 1000
          description: Optional note shown to the player on the suspended banner.
        unsuspend:
          type: boolean
          description: |
            Defaults to `true` when approving. Set to `false` to approve the
            appeal without lifting the suspension (e.g. partial resolutions).
            Ignored when denying.
    AppealResolveResponse:
      type: object
      required: [appeal, unsuspended]
      properties:
        appeal:
          $ref: "#/components/schemas/Appeal"
        unsuspended: { type: boolean }
