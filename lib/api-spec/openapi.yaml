        teamEnergy:        { type: integer }
        bonusXp:           { type: integer }
        xpBonusPct:        { type: integer }
        memberCount:       { type: integer }
        challengesAdvanced: { type: integer }
        raidDamage:        { type: integer }
        raidUnlocked:      { type: boolean }
        fitnessXpEarned:   { type: integer }
        activity:          { $ref: "#/components/schemas/FitnessActivity" }
        player:            { $ref: "#/components/schemas/Player" }

    SendGroupMessageInput:
      type: object
      required: [playerId, content]
      properties:
        playerId: { type: integer }
        content:  { type: string, minLength: 1, maxLength: 280 }

    JoinGroupByCodeInput:
      type: object
      required: [playerId, inviteCode]
      properties:
        playerId:   { type: integer }
        inviteCode: { type: string, minLength: 6, maxLength: 6 }

    GroupChallengeProgressInput:
      type: object
      required: [playerId, progressValue]
      properties:
        playerId:      { type: integer }
        progressValue: { type: integer }

    GroupChallengeProgressResult:
      type: object
      required: [challengesAdvanced, challenges]
      properties:
        challengesAdvanced: { type: integer }
        challenges:
          type: array
          items:
            $ref: "#/components/schemas/GroupChallenge"

    GroupRaidAttackInput:
      type: object
      required: [playerId, damage]
      properties:
        playerId: { type: integer }
        damage:   { type: integer }

    PersonalRecord:
      type: object
      required: [id, playerId, activityType, metric, value, achievedAt]
