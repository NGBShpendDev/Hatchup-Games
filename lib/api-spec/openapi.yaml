        name:        { type: string }
        lore:        { type: string }
        rarity:      { type: string }
        type:        { type: string }
        imageSlug:   { type: string }
        isHidden:    { type: boolean }
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactAbility"
        discovered:  { type: boolean }
