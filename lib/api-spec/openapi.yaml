          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubMember"
        "404":
          description: Club not found

  /clubs/{id}/members/{playerId}:
    patch:
      operationId: updateClubMemberRole
      tags: [clubs]
      summary: Promote or demote a club member (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClubMemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubMember"
        "400":
          description: Invalid input
        "403":
          description: Only the club owner can change roles
        "404":
          description: Club or member not found

  /clubs/{id}/transfer-ownership:
    post:
      operationId: transferClubOwnership
      tags: [clubs]
      summary: Transfer club ownership to another member (owner only)
      description: |
        Promotes the chosen member to "owner" and demotes the current owner to
        "officer". Only the current owner can call this. After a successful
        transfer the former owner can leave the club using POST /clubs/{id}/leave.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferClubOwnershipInput"
      responses:
        "200":
          description: Ownership transferred
          content:
            application/json:
              schema:
                type: object
                required: [success, newOwnerId]
                properties:
                  success:
                    type: boolean
                  newOwnerId:
                    type: integer
        "400":
          description: Invalid input
        "403":
          description: Only the current owner can transfer ownership
        "404":
          description: Club or member not found

  /clubs/{id}/members/{memberId}/kick:
    post:
      operationId: kickClubMember
      tags: [clubs]
      summary: Remove a member from the club (owner/officer only)
      description: |
        Removes the target member from the club. Clears their clubId and
        clubRole and decrements the club's memberCount. Only the owner or an
        officer can kick. Owners cannot be kicked. Officers can only be kicked
        by the owner.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "403":
          description: Caller is not authorized to kick this member
        "404":
          description: Club or member not found

  /clubs/{id}/join:
    post:
      operationId: joinClub
      tags: [clubs]
      summary: Join a club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinClubInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}/leave:
    post:
      operationId: leaveClub
      tags: [clubs]
      summary: Leave a club
      description: |
        Removes the authenticated caller from the club. Decrements the club's
        memberCount and clears the caller's clubId and clubRole. Owners cannot
        leave until they transfer ownership.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left the club
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "403":
          description: Caller is the owner or not a member
        "404":
          description: Club not found

