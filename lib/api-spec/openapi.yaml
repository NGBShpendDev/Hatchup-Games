openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HatchUp Fitness Pals Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: accessibility
    description: Onboarding, adaptive goals, family teams, and accessibility settings
  - name: health
    description: Health operations
  - name: players
    description: Player profile and stats
  - name: hatchlings
    description: Creature/hatchling management
  - name: evolutions
    description: Evolution catalog and system
  - name: competitions
    description: Mini-games and competitive play
  - name: leaderboards
    description: Rankings and leaderboards
  - name: items
    description: Items and inventory
  - name: events
    description: Live events
  - name: clubs
    description: Clubs and guilds
  - name: eggs
    description: Egg incubation and hatching
  - name: fitness
    description: Fitness tracking, quests, and realms
  - name: training
    description: AI workout plans, meal plans, and coaching
  - name: health-sync
    description: Health platform connections and passive fitness sync
  - name: groups
    description: Workout groups, team energy, challenges, raids, and chat
  - name: coach
    description: AI Fitness Coach chat
  - name: challenges
    description: User-generated fitness challenges
  - name: social
    description: Social feed, posts, reactions, comments, follows, and creator profiles
  - name: storage
    description: Object storage upload and serving endpoints
  - name: notifications
    description: In-app notifications (challenge invites, etc.)
  - name: nutrition
    description: Meal logging, macro tracking, and weekly nutrition rollups

paths:
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageErrorEnvelope'

  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Send a message to the AI Fitness Coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatBody"
      responses:
        "200":
          description: SSE stream of coach reply chunks
          content:
            text/event-stream:
              schema:
                type: string

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Players ──────────────────────────────────────────────────────────────
  /players:
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/search:
    get:
      operationId: searchPlayers
      tags: [players]
      summary: Search players by username or display name
      description: |
        Returns up to `limit` players whose username or displayName contains the
        query string (case-insensitive). Used by the Invite Friends sheet on
        challenges to let creators invite anyone, not just people they follow.
        The current player is excluded from results.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Matching players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerStub"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/dashboard:
    get:
      operationId: getPlayerDashboard
      tags: [players]
      summary: Get player dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDashboard"

  # ── Hatchlings ────────────────────────────────────────────────────────────
  /hatchlings:
    get:
      operationId: listHatchlings
      tags: [hatchlings]
      summary: List hatchlings (optionally by owner)
      parameters:
        - name: playerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"
    post:
      operationId: createHatchling
      tags: [hatchlings]
      summary: Hatch a new creature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/{id}:
    get:
      operationId: getHatchling
      tags: [hatchlings]
      summary: Get hatchling by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hatchling found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
        "404":
          description: Not found
    patch:
      operationId: updateHatchling
      tags: [hatchlings]
      summary: Update hatchling (name, mood, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
    delete:
      operationId: deleteHatchling
      tags: [hatchlings]
      summary: Release a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /hatchlings/{id}/evolve:
    post:
      operationId: evolveHatchling
      tags: [hatchlings]
      summary: Trigger evolution for a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveInput"
      responses:
        "200":
          description: Evolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/showcase:
    get:
      operationId: getHatchlingShowcase
      tags: [hatchlings]
      summary: Get top/featured hatchlings for showcase
      responses:
        "200":
          description: Showcase hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"

  # ── Evolutions ────────────────────────────────────────────────────────────
  /evolutions:
    get:
      operationId: listEvolutions
      tags: [evolutions]
      summary: List all evolution types in the catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
        - name: realm
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Evolution catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionType"

  /evolutions/{id}:
    get:
      operationId: getEvolution
      tags: [evolutions]
      summary: Get evolution type by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evolution type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionType"

  /evolutions/categories:
    get:
      operationId: getEvolutionCategories
      tags: [evolutions]
      summary: Get evolution categories with counts
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionCategory"

  /evolutions/realms:
    get:
      operationId: getEvolutionRealms
      tags: [evolutions]
      summary: Get realm metadata with evolution counts
      responses:
        "200":
          description: Realm metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RealmInfo"

  # ── Competitions ──────────────────────────────────────────────────────────
  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List competitions (past and upcoming)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed]
        - name: mode
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Join or create a competition match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Competition created/joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get competition details and results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}/result:
    post:
      operationId: submitCompetitionResult
      tags: [competitions]
      summary: Submit result for a competition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionResultInput"
      responses:
        "200":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/game-modes:
    get:
      operationId: listGameModes
      tags: [competitions]
      summary: List all available game modes
      responses:
        "200":
          description: Game modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameMode"

  # ── Leaderboards ──────────────────────────────────────────────────────────
  /leaderboards/global:
    get:
      operationId: getGlobalLeaderboard
      tags: [leaderboards]
      summary: Get global player leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Global leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/by-mode:
    get:
      operationId: getModeLeaderboard
      tags: [leaderboards]
      summary: Get leaderboard for a specific game mode
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Mode leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/speed:
    get:
      operationId: getSpeedLeaderboard
      tags: [leaderboards]
      summary: Get speed/fitness leaderboard (mode=steps for top daily steps, mode=pace for fastest runners)
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [steps, pace]
            default: steps
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Speed leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeedLeaderboardEntry"

  /leaderboards/rank-distribution:
    get:
      operationId: getRankDistribution
      tags: [leaderboards]
      summary: Get distribution of players across ranks
      responses:
        "200":
          description: Rank distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankDistribution"

  /leaderboards/artifacts:
    get:
      operationId: getArtifactsLeaderboard
      tags: [leaderboards]
      summary: Top artifact collectors ranked by weighted rarity score
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Top artifact collectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactCollectorEntry"

  # ── Artifacts ─────────────────────────────────────────────────────────────
  /artifacts:
    get:
      operationId: listArtifacts
      tags: [players]
      summary: Get artifact museum — all artifacts with per-player discovery state
      responses:
        "200":
          description: Artifact museum list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactMuseumEntry"

  /players/me/artifacts:
    get:
      operationId: getMyArtifacts
      tags: [players]
      summary: Get owned artifacts for the authenticated player
      responses:
        "200":
          description: Owned artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedArtifact"

  /players/me/artifacts/{id}:
    patch:
      operationId: toggleOwnedArtifact
      tags: [players]
      summary: Toggle equipped / featured state on an owned artifact
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleOwnedArtifactBody"
      responses:
        "200":
          description: Updated owned artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedArtifact"
        "404":
          description: Artifact not owned by the authenticated player

  /players/me/featured-order:
    put:
      operationId: reorderFeaturedArtifacts
      tags: [players]
      summary: Reorder the authenticated player's featured artifact showcase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFeaturedArtifactsBody"
      responses:
        "200":
          description: New featured order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderFeaturedArtifactsResponse"

  /players/me/fitness-bars:
    get:
      operationId: getMyFitnessBars
      tags: [players]
      summary: Get all 8 fitness bar levels for the authenticated player
      responses:
        "200":
          description: Fitness bars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessBar"

  /artifacts/world-notifications:
    get:
      operationId: getArtifactWorldNotifications
      tags: [players]
      summary: Get recent world notifications for Mythic+ artifact drops
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: World notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactWorldNotification"

  # ── Artifact Loadouts ────────────────────────────────────────────────────
  /artifacts/loadout/{hatchlingId}:
    get:
      operationId: getArtifactLoadout
      tags: [players]
      summary: Get the active artifact loadout for a hatchling
      parameters:
        - name: hatchlingId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Active loadout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactLoadout" }
    post:
      operationId: saveArtifactLoadout
      tags: [players]
      summary: Save / update the active artifact loadout for a hatchling
      parameters:
        - name: hatchlingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveArtifactLoadoutBody" }
      responses:
        "200":
          description: Saved loadout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactLoadout" }

  /artifacts/builds:
    get:
      operationId: listArtifactBuilds
      tags: [players]
      summary: List all saved named artifact builds for the authenticated player
      responses:
        "200":
          description: Saved builds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtifactLoadout" }
    post:
      operationId: saveArtifactBuild
      tags: [players]
      summary: Save a named artifact build (preset)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveArtifactBuildBody" }
      responses:
        "200":
          description: Saved build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactLoadout" }

  /artifacts/builds/{id}:
    delete:
      operationId: deleteArtifactBuild
      tags: [players]
      summary: Delete a named artifact build
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /artifacts/battle-xp:
    get:
      operationId: getArtifactBattleXp
      tags: [players]
      summary: Get battle XP and evolution stages for all owned artifacts
      responses:
        "200":
          description: Battle XP entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtifactBattleXpEntry" }

  # ── Items ─────────────────────────────────────────────────────────────────
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List available items in the shop/catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /items/{id}/use:
    post:
      operationId: useItem
      tags: [items]
      summary: Use an item on a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseItemInput"
      responses:
        "200":
          description: Item used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  # ── Live Events ───────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List current and upcoming live events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, upcoming, past]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveEvent"

  /events/{id}:
    get:
      operationId: getLiveEvent
      tags: [events]
      summary: Get live event details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEvent"

  # ── Clubs ─────────────────────────────────────────────────────────────────
  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: List clubs/guilds
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"
    post:
      operationId: createClub
      tags: [clubs]
      summary: Create a new club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [clubs]
      summary: Get club details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}/members:
    get:
      operationId: listClubMembers
      tags: [clubs]
      summary: List members of a club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
