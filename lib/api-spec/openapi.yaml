openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HATCHUP Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player profile and stats
  - name: hatchlings
    description: Creature/hatchling management
  - name: evolutions
    description: Evolution catalog and system
  - name: competitions
    description: Mini-games and competitive play
  - name: leaderboards
    description: Rankings and leaderboards
  - name: items
    description: Items and inventory
  - name: events
    description: Live events
  - name: clubs
    description: Clubs and guilds

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Players ──────────────────────────────────────────────────────────────
  /players:
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/dashboard:
    get:
      operationId: getPlayerDashboard
      tags: [players]
      summary: Get player dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDashboard"

  # ── Hatchlings ────────────────────────────────────────────────────────────
  /hatchlings:
    get:
      operationId: listHatchlings
      tags: [hatchlings]
      summary: List hatchlings (optionally by owner)
      parameters:
        - name: playerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"
    post:
      operationId: createHatchling
      tags: [hatchlings]
      summary: Hatch a new creature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/{id}:
    get:
      operationId: getHatchling
      tags: [hatchlings]
      summary: Get hatchling by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hatchling found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
        "404":
          description: Not found
    patch:
      operationId: updateHatchling
      tags: [hatchlings]
      summary: Update hatchling (name, mood, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HatchlingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"
    delete:
      operationId: deleteHatchling
      tags: [hatchlings]
      summary: Release a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /hatchlings/{id}/evolve:
    post:
      operationId: evolveHatchling
      tags: [hatchlings]
      summary: Trigger evolution for a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvolveInput"
      responses:
        "200":
          description: Evolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  /hatchlings/showcase:
    get:
      operationId: getHatchlingShowcase
      tags: [hatchlings]
      summary: Get top/featured hatchlings for showcase
      responses:
        "200":
          description: Showcase hatchlings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hatchling"

  # ── Evolutions ────────────────────────────────────────────────────────────
  /evolutions:
    get:
      operationId: listEvolutions
      tags: [evolutions]
      summary: List all evolution types in the catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Evolution catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionType"

  /evolutions/{id}:
    get:
      operationId: getEvolution
      tags: [evolutions]
      summary: Get evolution type by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evolution type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionType"

  /evolutions/categories:
    get:
      operationId: getEvolutionCategories
      tags: [evolutions]
      summary: Get evolution categories with counts
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionCategory"

  # ── Competitions ──────────────────────────────────────────────────────────
  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List competitions (past and upcoming)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed]
        - name: mode
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Join or create a competition match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Competition created/joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get competition details and results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}/result:
    post:
      operationId: submitCompetitionResult
      tags: [competitions]
      summary: Submit result for a competition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionResultInput"
      responses:
        "200":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/game-modes:
    get:
      operationId: listGameModes
      tags: [competitions]
      summary: List all available game modes
      responses:
        "200":
          description: Game modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameMode"

  # ── Leaderboards ──────────────────────────────────────────────────────────
  /leaderboards/global:
    get:
      operationId: getGlobalLeaderboard
      tags: [leaderboards]
      summary: Get global player leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Global leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/by-mode:
    get:
      operationId: getModeLeaderboard
      tags: [leaderboards]
      summary: Get leaderboard for a specific game mode
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Mode leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboards/rank-distribution:
    get:
      operationId: getRankDistribution
      tags: [leaderboards]
      summary: Get distribution of players across ranks
      responses:
        "200":
          description: Rank distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankDistribution"

  # ── Items ─────────────────────────────────────────────────────────────────
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List available items in the shop/catalog
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /items/{id}/use:
    post:
      operationId: useItem
      tags: [items]
      summary: Use an item on a hatchling
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseItemInput"
      responses:
        "200":
          description: Item used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hatchling"

  # ── Live Events ───────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List current and upcoming live events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, upcoming, past]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveEvent"

  /events/{id}:
    get:
      operationId: getLiveEvent
      tags: [events]
      summary: Get live event details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEvent"

  # ── Clubs ─────────────────────────────────────────────────────────────────
  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: List clubs/guilds
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"
    post:
      operationId: createClub
      tags: [clubs]
      summary: Create a new club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [clubs]
      summary: Get club details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}/join:
    post:
      operationId: joinClub
      tags: [clubs]
      summary: Join a club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinClubInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Player ──────────────────────────────────────────────────────────────
    Player:
      type: object
      required: [id, username, level, xp, coins, rank, totalWins, totalMatches, createdAt]
      properties:
        id:          { type: integer }
        username:    { type: string }
        displayName: { type: ["string", "null"] }
        avatarUrl:   { type: ["string", "null"] }
        level:       { type: integer }
        xp:          { type: integer }
        coins:       { type: integer }
        rank:        { type: string }
        rankScore:   { type: integer }
        totalWins:   { type: integer }
        totalMatches: { type: integer }
        clubId:      { type: ["integer", "null"] }
        createdAt:   { type: string }

    PlayerInput:
      type: object
      required: [username]
      properties:
        username:    { type: string, minLength: 2, maxLength: 20 }
        displayName: { type: string }
        avatarUrl:   { type: string }

    PlayerUpdate:
      type: object
      properties:
        displayName: { type: string }
        avatarUrl:   { type: string }

    PlayerDashboard:
      type: object
      required: [player, hatchlingCount, totalWins, recentCompetitions, activeEvents, topHatchling]
      properties:
        player:               { $ref: "#/components/schemas/Player" }
        hatchlingCount:       { type: integer }
        totalWins:            { type: integer }
        winRate:              { type: number }
        recentCompetitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"
        activeEvents:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
        topHatchling:         { $ref: "#/components/schemas/Hatchling" }

    # ── Hatchling ────────────────────────────────────────────────────────────
    Hatchling:
      type: object
      required: [id, playerId, name, species, evolutionStage, personality, mood, level, xp, happiness, hunger, energy, createdAt]
      properties:
        id:             { type: integer }
        playerId:       { type: integer }
        name:           { type: string }
        species:        { type: string }
        evolutionStage: { type: integer }
        evolutionType:  { type: ["string", "null"] }
        category:       { type: string }
        rarity:         { type: string }
        personality:    { type: string }
        mood:           { type: string }
        level:          { type: integer }
        xp:             { type: integer }
        happiness:      { type: integer }
        hunger:         { type: integer }
        energy:         { type: integer }
        abilityName:    { type: ["string", "null"] }
        abilityDesc:    { type: ["string", "null"] }
        imageUrl:       { type: ["string", "null"] }
        isShiny:        { type: boolean }
        isFusion:       { type: boolean }
        color:          { type: ["string", "null"] }
        createdAt:      { type: string }

    HatchlingInput:
      type: object
      required: [playerId, name]
      properties:
        playerId: { type: integer }
        name:     { type: string, minLength: 1, maxLength: 30 }
        species:  { type: string }

    HatchlingUpdate:
      type: object
      properties:
        name:      { type: string }
        mood:      { type: string }
        happiness: { type: integer }
        hunger:    { type: integer }
        energy:    { type: integer }

    EvolveInput:
      type: object
      required: [triggerId]
      properties:
        triggerId: { type: integer }

    # ── Evolution ────────────────────────────────────────────────────────────
    EvolutionType:
      type: object
      required: [id, name, category, rarity, description, unlockedCount]
      properties:
        id:            { type: integer }
        name:          { type: string }
        category:      { type: string }
        rarity:        { type: string }
        description:   { type: string }
        unlockHint:    { type: ["string", "null"] }
        imageUrl:      { type: ["string", "null"] }
        abilityName:   { type: ["string", "null"] }
        abilityDesc:   { type: ["string", "null"] }
        unlockedCount: { type: integer }
        color:         { type: ["string", "null"] }

    EvolutionCategory:
      type: object
      required: [category, count, rarest]
      properties:
        category: { type: string }
        count:    { type: integer }
        rarest:   { type: string }
        color:    { type: ["string", "null"] }

    # ── Competition ──────────────────────────────────────────────────────────
    Competition:
      type: object
      required: [id, mode, status, playerId, hatchlingId, score, rank, createdAt]
      properties:
        id:          { type: integer }
        mode:        { type: string }
        status:      { type: string }
        playerId:    { type: integer }
        playerName:  { type: ["string", "null"] }
        hatchlingId: { type: integer }
        hatchlingName: { type: ["string", "null"] }
        score:       { type: integer }
        rank:        { type: ["integer", "null"] }
        duration:    { type: ["integer", "null"] }
        xpEarned:    { type: ["integer", "null"] }
        coinsEarned: { type: ["integer", "null"] }
        createdAt:   { type: string }

    CompetitionInput:
      type: object
      required: [mode, playerId, hatchlingId]
      properties:
        mode:        { type: string }
        playerId:    { type: integer }
        hatchlingId: { type: integer }

    CompetitionResultInput:
      type: object
      required: [score, duration]
      properties:
        score:    { type: integer }
        duration: { type: integer }
        rank:     { type: integer }

    GameMode:
      type: object
      required: [id, name, description, type, maxPlayers, minLevel]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        maxPlayers:  { type: integer }
        minLevel:    { type: integer }
        iconEmoji:   { type: ["string", "null"] }
        color:       { type: ["string", "null"] }
        isLive:      { type: boolean }

    # ── Leaderboard ──────────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [position, playerId, username, rank, score, wins, hatchlingName]
      properties:
        position:      { type: integer }
        playerId:      { type: integer }
        username:      { type: string }
        displayName:   { type: ["string", "null"] }
        avatarUrl:     { type: ["string", "null"] }
        rank:          { type: string }
        score:         { type: integer }
        wins:          { type: integer }
        hatchlingName: { type: string }
        hatchlingCategory: { type: ["string", "null"] }

    RankDistribution:
      type: object
      required: [rank, count, percentage, color]
      properties:
        rank:       { type: string }
        count:      { type: integer }
        percentage: { type: number }
        color:      { type: string }

    # ── Item ─────────────────────────────────────────────────────────────────
    Item:
      type: object
      required: [id, name, description, category, price, effectType, effectValue]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        category:    { type: string }
        price:       { type: integer }
        imageUrl:    { type: ["string", "null"] }
        effectType:  { type: string }
        effectValue: { type: integer }
        rarity:      { type: string }
        color:       { type: ["string", "null"] }

    UseItemInput:
      type: object
      required: [hatchlingId, playerId]
      properties:
        hatchlingId: { type: integer }
        playerId:    { type: integer }

    # ── Live Event ────────────────────────────────────────────────────────────
    LiveEvent:
      type: object
      required: [id, name, description, type, status, startsAt, endsAt, participants]
      properties:
        id:           { type: integer }
        name:         { type: string }
        description:  { type: string }
        type:         { type: string }
        status:       { type: string }
        startsAt:     { type: string }
        endsAt:       { type: string }
        participants: { type: integer }
        reward:       { type: ["string", "null"] }
        imageUrl:     { type: ["string", "null"] }
        color:        { type: ["string", "null"] }
        isFeatured:   { type: boolean }

    # ── Club ──────────────────────────────────────────────────────────────────
    Club:
      type: object
      required: [id, name, description, memberCount, level, totalWins, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string }
        emblem:      { type: ["string", "null"] }
        memberCount: { type: integer }
        maxMembers:  { type: integer }
        level:       { type: integer }
        totalWins:   { type: integer }
        isPublic:    { type: boolean }
        color:       { type: ["string", "null"] }
        createdAt:   { type: string }

    ClubInput:
      type: object
      required: [name, description]
      properties:
        name:        { type: string, minLength: 2, maxLength: 30 }
        description: { type: string }
        isPublic:    { type: boolean }
        color:       { type: string }

    JoinClubInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: integer }
